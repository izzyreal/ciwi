- id: build
  trigger: manual
  vcs_source:
    repo: https://github.com/izzyreal/ciwi.git
  versioning:
    file: VERSION
    tag_prefix: v
  jobs:
    - id: unit-tests
      runs_on:
        executor: script
        shell: posix
      go_cache: {}
      requires:
        tools:
          git: "*"
          go: ">=1.24"
      timeout_seconds: 600
      steps:
        - name: Run Go unit tests
          test:
            name: go-unit
            command: mkdir -p dist && go test -p 1 -tags nowayland,nox11,novulkan,noopengl -coverpkg=./... -json -coverprofile=dist/go-unit.cover ./... > dist/go-unit.json
            format: go-test-json
            report: dist/go-unit.json
            coverage_format: go-coverprofile
            coverage_report: dist/go-unit.cover
    - id: integration-tests
      runs_on:
        executor: script
        shell: posix
        container_runtime: auto
        container_image: mcr.microsoft.com/playwright:v1.62.1-noble
        container_cpus: "4"
        container_memory: 4G
        container_shm_size: 1G
      requires:
        tools:
          git: "*"
        container:
          tools:
            node: "*"
            npm: "*"
      timeout_seconds: 1800
      artifacts:
        - dist/browser-dom-junit.xml
      steps:
        - name: Run browser DOM integration tests
          env:
            HOME: /tmp
            CI: "1"
            CIWI_JUNIT_REPORT: /workspace/dist/browser-dom-junit.xml
          test:
            name: browser-dom-integration
            command: mkdir -p dist integration/browser-dom/node_modules && cd integration/browser-dom && npm ci && npm test
            format: junit-xml
            report: dist/browser-dom-junit.xml
    - id: container-cancellation-apple
      runs_on:
        executor: script
        shell: posix
        os: darwin
        arch: arm64
      go_cache: {}
      requires:
        tools:
          git: "*"
          go: ">=1.24"
          container: ">=1.2.2"
      timeout_seconds: 600
      steps:
        - name: Verify apple container cancellation
          env:
            CIWI_TEST_CONTAINER_RUNTIME: apple
          test:
            name: container-cancellation-apple
            command: mkdir -p dist && go test -tags integration -run '^TestContainerLiveCancellation$' -count=1 -timeout=5m -json ./internal/agent > dist/container-cancellation-apple.json
            format: go-test-json
            report: dist/container-cancellation-apple.json
    - id: container-cancellation-docker
      runs_on:
        executor: script
        shell: posix
        os: linux
      go_cache: {}
      requires:
        tools:
          git: "*"
          go: ">=1.24"
          docker: "*"
      timeout_seconds: 600
      steps:
        - name: Verify docker container cancellation
          env:
            CIWI_TEST_CONTAINER_RUNTIME: docker
          test:
            name: container-cancellation-docker
            command: mkdir -p dist && go test -tags integration -run '^TestContainerLiveCancellation$' -count=1 -timeout=5m -json ./internal/agent > dist/container-cancellation-docker.json
            format: go-test-json
            report: dist/container-cancellation-docker.json
    - id: build-cross-platform
      needs:
        - unit-tests
        - integration-tests
        - container-cancellation-apple
        - container-cancellation-docker
      runs_on:
        executor: script
        shell: posix
      go_cache: {}
      requires:
        tools:
          git: "*"
          go: ">=1.24"
      timeout_seconds: 600
      artifacts:
        - dist/**
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - name: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
      steps:
        - name: Prepare dist
          run: mkdir -p dist
        - name: Build ciwi binary
          run: GOOS={{goos}} GOARCH={{goarch}} CGO_ENABLED=0 go build -v -trimpath -ldflags="-s -w -X github.com/izzyreal/ciwi/internal/version.Version=${CIWI_PIPELINE_VERSION}" -o dist/ciwi-{{name}}{{ext}} ./cmd/ciwi
