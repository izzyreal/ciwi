apiVersion: ciwi.ui/v1
kind: Theme
metadata: {name: default, title: Default, description: "Bright mint with stronger color and contrast."}
theme:
  colors: &colors
    background: "#edf7f1"
    background-start: "#bce8d0"
    background-end: "#dff2e8"
    background-glow-a: "#79d5aa"
    background-glow-b: "#b8dcf0"
    surface: "#ffffff"
    surface-raised: "#ffffff"
    surface-subtle: "#f7fcf9"
    surface-glow: "#e0f7eb"
    text: "#17271f"
    text-muted: "#536b60"
    accent: "#087d61"
    accent-strong: "#075f4b"
    pill-background: "#dff4e9"
    pill-text: "#176247"
    notice-background: "#113a2b"
    notice-text: "#effbf4"
    notice-border: "#3d775e"
    border: "#abd4bf"
    success: "#13834a"
    warning: "#a76900"
    awaiting-surface: "#fff3d6"
    awaiting-border: "#e4c06c"
    awaiting-text: "#8f5900"
    danger: "#c03b4d"
    focus: "#2568d8"
    console-background: "#0e1713"
    console-surface: "#17261f"
    console-border: "#294238"
    console-text: "#d5eee2"
    console-muted: "#98b4a7"
    console-accent: "#a8d7c1"
    console-success: "#9ce397"
  gradients:
    page:
      kind: linear
      angle: 135
      stops: [{color: "#f8fcfa", position: 0}, {color: "#dcefe6", position: 100}]
    hero:
      kind: radial
      stops: [{color: "#ffffff", position: 0}, {color: "#e6f5ee", position: 100}]
  dimensions: {small: "8", medium: "16", large: "24", page: "1600", page-inset: "16", section-padding: "14", card-padding: "16", hero-padding: "16", surface-radius: "12", control-radius: "8", control-padding-x: "12", control-padding-y: "8", text-body: "16", text-control: "14", text-code: "13", text-badge: "12", text-subtitle: "16", text-heading: "18", text-title: "28", image-brand-width: "110", image-brand-height: "91"}
