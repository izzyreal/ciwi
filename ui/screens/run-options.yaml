apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: run-options
  title: Run options
  description: Select a source ref and eligible agent before queueing work
screen:
  dataSources:
    - name: runOptions
      query: get-run-options
      watchTopics: [projects, agent-eligibility]
  root:
    component: page
    id: run-options
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        layout:
          direction: horizontal
          gap: medium
          align: center
        children:
          - component: button
            text:
              literal: Back
            icon: arrow-left
            actions:
              - on: activate
                command: navigate-back
                arguments:
                  fallbackRoute: /projects/{{runOptions.project_id}}
          - component: text
            text:
              template: "Run options: {{runOptions.target_label}}"
            layout:
              grow: true
            style:
              role: title
              emphasis: strong
      - component: column
        id: run-options-loading
        visible: {binding: runOptions.loading}
        layout: {direction: vertical, gap: medium}
        children:
          - component: row
            layout: {grow: true, minHeight: "14"}
            style: {role: skeleton}
          - component: card
            layout: {direction: vertical, gap: medium, padding: large}
            children:
              - component: row
                layout: {grow: true, minHeight: "18"}
                style: {role: skeleton}
              - component: spacer
                layout: {grow: true, minHeight: "120"}
      - component: column
        id: run-options-load-error
        visible: {binding: runOptions.load_error, empty: true, not: true}
        layout: {direction: vertical, gap: medium}
        children:
          - component: text
            text: {literal: Could not load Run Options}
            style: {role: heading, emphasis: strong, tone: danger}
          - component: text
            text: {binding: runOptions.load_error}
            style: {tone: danger}
          - component: row
            layout: {direction: horizontal, gap: small, wrap: true}
            children:
              - component: button
                text: {literal: Retry}
                icon: refresh
                actions: [{on: activate, command: refresh}]
              - component: button
                text: {literal: Back}
                icon: arrow-left
                actions: [{on: activate, command: navigate-back, arguments: {fallbackRoute: "/projects/{{runOptions.project_id}}"}}]
      - component: section
        visible: {binding: runOptions.ready}
        layout:
          direction: vertical
          gap: medium
          padding: large
        children:
          - component: text
            text:
              binding: runOptions.source_repo
            style:
              role: body
              tone: muted
          - component: text
            text:
              template: "{{runOptions.pending_jobs}} job execution(s) will be queued"
            style:
              role: body
          - component: column
            layout:
              direction: vertical
              gap: small
            children:
              - component: text
                text:
                  literal: Source branch
                style:
                  role: body
                  emphasis: strong
              - component: select
                select:
                  value: runOptions.selected_source_ref
                  options: runOptions.source_refs
                  as: sourceRefOption
                  optionValue: sourceRefOption.value
                  optionLabel: sourceRefOption.label
                actions:
                  - on: change
                    command: set-run-option
                    arguments:
                      field: sourceRef
                      value: "{{selection.value}}"
          - component: column
            layout:
              direction: vertical
              gap: small
            children:
              - component: text
                text:
                  literal: Agent
                style:
                  role: body
                  emphasis: strong
              - component: select
                select:
                  value: runOptions.selected_agent_id
                  options: runOptions.eligible_agents
                  as: agentOption
                  optionValue: agentOption.value
                  optionLabel: agentOption.label
                actions:
                  - on: change
                    command: set-run-option
                    arguments:
                      field: agentId
                      value: "{{selection.value}}"
          - component: row
            visible:
              binding: runOptions.target_kind
              equals: pipeline
            layout:
              direction: horizontal
              gap: medium
              align: center
            children:
              - component: button
                text:
                  literal: Run Pipeline
                icon: player-play
                actions:
                  - on: activate
                    command: run-pipeline
                    arguments:
                      pipelineDbId: "{{runOptions.pipeline_db_id}}"
                      sourceRef: "{{runOptions.selected_source_ref}}"
                      agentId: "{{runOptions.selected_agent_id}}"
                      backOnSuccess: "true"
                      fallbackRoute: /projects/{{runOptions.project_id}}
              - component: button
                text:
                  literal: Dry Run
                icon: player-play
                visible:
                  binding: runOptions.supports_dry_run
                actions:
                  - on: activate
                    command: run-pipeline
                    arguments:
                      pipelineDbId: "{{runOptions.pipeline_db_id}}"
                      sourceRef: "{{runOptions.selected_source_ref}}"
                      agentId: "{{runOptions.selected_agent_id}}"
                      dryRun: "true"
                      backOnSuccess: "true"
                      fallbackRoute: /projects/{{runOptions.project_id}}
          - component: row
            visible:
              binding: runOptions.target_kind
              equals: chain
            layout:
              direction: horizontal
              gap: medium
              align: center
            children:
              - component: button
                text:
                  literal: Run Chain
                icon: player-play
                actions:
                  - on: activate
                    command: run-chain
                    arguments:
                      projectId: "{{runOptions.project_id}}"
                      chainId: "{{runOptions.chain_id}}"
                      sourceRef: "{{runOptions.selected_source_ref}}"
                      agentId: "{{runOptions.selected_agent_id}}"
                      backOnSuccess: "true"
                      fallbackRoute: /projects/{{runOptions.project_id}}
              - component: button
                text:
                  literal: Dry Run Chain
                icon: player-play
                visible:
                  binding: runOptions.supports_dry_run
                actions:
                  - on: activate
                    command: run-chain
                    arguments:
                      projectId: "{{runOptions.project_id}}"
                      chainId: "{{runOptions.chain_id}}"
                      sourceRef: "{{runOptions.selected_source_ref}}"
                      agentId: "{{runOptions.selected_agent_id}}"
                      dryRun: "true"
                      backOnSuccess: "true"
                      fallbackRoute: /projects/{{runOptions.project_id}}
