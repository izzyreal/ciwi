apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: agents
  title: Agents
screen:
  dataSources:
    - name: agents
      query: get-agents-view
      watchTopics: [agents]
  root:
    component: page
    id: agents
    layout: {direction: vertical, gap: large, padding: large, maxWidth: page}
    children:
      - component: row
        layout: {direction: horizontal, gap: medium, align: center}
        children:
          - component: column
            layout: {direction: vertical, gap: small, grow: true}
            children:
              - component: text
                text: {literal: Agents}
                style: {role: title, emphasis: strong}
              - component: text
                text: {binding: agents.summary}
                style: {tone: muted}
          - component: button
            text: {literal: Refresh}
            icon: refresh
            actions: [{on: activate, command: refresh}]
          - component: button
            text: {literal: Back to Main}
            icon: arrow-left
            actions: [{on: activate, command: navigate, arguments: {route: /}}]
      - component: column
        id: agents-loading
        visible: {binding: agents.loading}
        layout: {direction: vertical, gap: medium}
        children:
          - component: row
            layout: {grow: true, minHeight: "14"}
            style: {role: skeleton}
          - component: card
            layout: {direction: vertical, gap: medium, padding: medium}
            children:
              - component: row
                layout: {grow: true, minHeight: "18"}
                style: {role: skeleton}
              - component: row
                layout: {grow: true, minHeight: "72"}
                style: {role: skeleton}
      - component: column
        id: agents-load-error
        visible: {binding: agents.load_error, empty: true, not: true}
        layout: {direction: vertical, gap: medium}
        children:
          - component: text
            text: {literal: Could not load Agents}
            style: {role: heading, emphasis: strong, tone: danger}
          - component: text
            text: {binding: agents.load_error}
            style: {tone: danger}
          - component: row
            layout: {direction: horizontal, gap: small, wrap: true}
            children:
              - component: button
                text: {literal: Retry}
                icon: refresh
                actions: [{on: activate, command: refresh}]
              - component: button
                text: {literal: Back to Main}
                icon: arrow-left
                actions: [{on: activate, command: navigate, arguments: {route: /}}]
      - component: card
        id: agents-table
        visible: {binding: agents.ready}
        layout: {direction: vertical, gap: medium, padding: medium}
        children:
          - component: row
            layout: {direction: horizontal, gap: medium, align: center, wrap: true}
            style: {role: agent-header, emphasis: strong, tone: muted}
            children:
              - component: text
                text: {literal: Agent ID}
                layout: {grow: true}
              - component: text
                text: {literal: Host}
                layout: {grow: true}
              - component: text
                text: {literal: Platform}
                layout: {grow: true}
              - component: text
                text: {literal: Version}
                layout: {grow: true}
              - component: text
                text: {literal: Heartbeat}
                layout: {grow: true}
              - component: text
                text: {literal: Health}
                layout: {grow: true}
              - component: text
                text: {literal: Run mode}
                layout: {grow: true}
          - component: list
            layout: {direction: vertical, gap: small}
            repeat: {source: agents.agents, as: agent, key: agent.id}
            children:
              - component: card
                layout: {direction: vertical, gap: small, padding: small}
                actions:
                  - on: activate
                    command: navigate
                    arguments: {route: "/agents/{{agent.id}}"}
                children:
                  - component: row
                    layout: {direction: horizontal, gap: medium, align: center, wrap: true}
                    style: {role: agent-record}
                    children:
                      - component: text
                        text: {binding: agent.id}
                        layout: {grow: true}
                        style: {role: link, emphasis: strong}
                      - component: text
                        text: {binding: agent.hostname}
                        layout: {grow: true}
                      - component: text
                        text: {binding: agent.platform}
                        layout: {grow: true}
                        style: {role: code}
                      - component: text
                        text: {binding: agent.version}
                        layout: {grow: true}
                      - component: column
                        layout: {direction: vertical, gap: small, grow: true}
                        children:
                          - component: icon
                            icon: heart
                            pulse: {binding: agent.last_seen_unix_ms}
                            style: {tone: danger}
                          - component: text
                            text: {binding: agent.last_seen}
                            style: {role: detail-small, tone: muted}
                      - component: badge
                        text: {binding: agent.status_label}
                        layout: {grow: true}
                        style: {toneBinding: agent.status}
                      - component: text
                        text: {binding: agent.run_mode}
                        layout: {grow: true}
                      - component: icon
                        icon: chevron-right
