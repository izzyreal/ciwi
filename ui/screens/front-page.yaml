apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: front-page
  title: ciwi
  description: Projects and pipeline entry points
screen:
  dataSources:
    - name: frontPage
      query: get-front-page-view
      watchTopics: [server, projects, queue, history]
  persistence:
    - name: projectsExpanded
      storageKey: ciwi.front-page.projects-expanded.v1
      defaultValue: "true"
      scope: client
  root:
    component: page
    id: front-page
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        id: masthead
        layout:
          direction: horizontal
          gap: large
          align: center
        style:
          role: hero
        children:
          - component: image
            image:
              asset: ciwi-logo
              description: ciwi CI/CD server
          - component: column
            layout:
              direction: vertical
              gap: small
              grow: true
            children:
              - component: text
                text:
                  template: "ciwi {{frontPage.server.version}}"
                style:
                  role: title
                  emphasis: strong
              - component: text
                text:
                  literal: Projects, pipelines and job executions
                style:
                  role: subtitle
                  tone: muted
          - component: button
            text:
              literal: Agents
            icon: server
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /agents
          - component: button
            text:
              literal: Global Settings
            icon: settings
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /settings
      - component: section
        id: projects
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Projects
            style:
              role: heading
              emphasis: strong
          - component: list
            id: project-list
            layout:
              direction: vertical
              gap: medium
            repeat:
              source: frontPage.projects
              as: project
              key: project.id
            children:
              - component: disclosure
                text:
                  template: "Project: {{project.name}}"
                disclosure:
                  defaultExpanded: true
                  stateKey: "front-project:{{project.id}}"
                layout:
                  direction: vertical
                  gap: small
                  padding: medium
                style:
                  role: body
                  emphasis: strong
                children:
                  - component: row
                    layout:
                      direction: horizontal
                      gap: medium
                      align: center
                    children:
                      - component: text
                        text:
                          binding: project.repo_url
                        layout:
                          grow: true
                        visible:
                          binding: project.repo_url
                          equals: ""
                          not: true
                        style:
                          role: body
                          tone: muted
                          truncate: true
                      - component: button
                        text:
                          literal: View details
                        actions:
                          - on: activate
                            command: navigate
                            arguments:
                              route: /projects/{{project.id}}
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: project.pipeline_chains
                      as: chain
                      key: chain.id
                    children:
                      - component: row
                        layout:
                          direction: horizontal
                          gap: medium
                          align: center
                        children:
                          - component: column
                            layout:
                              direction: vertical
                              gap: small
                              grow: true
                            children:
                              - component: text
                                text:
                                  template: "Chain: {{chain.name}}"
                                style:
                                  role: body
                                  emphasis: strong
                              - component: text
                                text:
                                  binding: chain.sequence_label
                                style:
                                  role: body
                                  tone: muted
                          - component: button
                            text:
                              literal: Options
                            icon: adjustments
                            actions:
                              - on: activate
                                command: navigate
                                arguments:
                                  route: /run-options/projects/{{project.id}}/chains/{{chain.id}}
                          - component: button
                            text:
                              literal: Run Chain
                            icon: player-play
                            actions:
                              - on: activate
                                command: run-chain
                                arguments:
                                  projectId: "{{project.id}}"
                                  chainId: "{{chain.id}}"
                                confirm:
                                  title: Run pipeline chain
                                  message: Queues every pipeline in this chain as one independent run. It does not interrupt jobs that are already queued or running.
                          - component: button
                            text:
                              literal: Dry Run
                            icon: player-play
                            visible:
                              binding: chain.supports_dry_run
                            actions:
                              - on: activate
                                command: run-chain
                                arguments:
                                  projectId: "{{project.id}}"
                                  chainId: "{{chain.id}}"
                                  dryRun: "true"
                                confirm:
                                  title: Dry-run pipeline chain
                                  message: Queues a dry-run execution of every pipeline in this chain. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: project.pipelines
                      as: pipeline
                      key: pipeline.id
                    children:
                      - component: row
                        layout:
                          direction: horizontal
                          gap: medium
                          align: center
                        children:
                          - component: text
                            text:
                              binding: pipeline.pipeline_id
                            style:
                              role: body
                              emphasis: strong
                          - component: spacer
                            layout:
                              grow: true
                          - component: button
                            text:
                              literal: Options
                            icon: adjustments
                            actions:
                              - on: activate
                                command: navigate
                                arguments:
                                  route: /run-options/projects/{{project.id}}/pipelines/{{pipeline.id}}
                          - component: button
                            text:
                              literal: Run
                            icon: player-play
                            actions:
                              - on: activate
                                command: run-pipeline
                                arguments:
                                  pipelineDbId: "{{pipeline.id}}"
                                confirm:
                                  title: Run pipeline
                                  message: This adds a new execution without interrupting jobs that are already queued or running.
                          - component: button
                            text:
                              literal: Dry Run
                            icon: player-play
                            visible:
                              binding: pipeline.supports_dry_run
                            actions:
                              - on: activate
                                command: run-pipeline
                                arguments:
                                  pipelineDbId: "{{pipeline.id}}"
                                  dryRun: "true"
                                confirm:
                                  title: Dry-run pipeline
                                  message: Queues a dry-run execution of this pipeline. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
        overrides:
          gio:
            layout:
              gap: small
      - component: section
        id: queued-executions
        layout:
          direction: vertical
          gap: medium
        children:
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            children:
              - component: text
                text:
                  literal: Queued and In Progress Job Executions
                layout:
                  grow: true
                style:
                  role: heading
                  emphasis: strong
              - component: button
                text:
                  literal: Clear Queue
                icon: trash
                actions:
                  - on: activate
                    command: clear-queue
                    confirm:
                      title: Clear queued executions?
                      message: Removes queued and leased execution records from the server. Running jobs continue, and agent caches and workspaces are not cleared.
              - component: button
                text:
                  literal: Collapse All
                icon: chevrons-up
                actions:
                  - on: activate
                    command: set-disclosures
                    arguments:
                      prefix: "front-queued:"
                      expanded: "false"
              - component: button
                text:
                  literal: Expand All
                icon: chevrons-down
                actions:
                  - on: activate
                    command: set-disclosures
                    arguments:
                      prefix: "front-queued:"
                      expanded: "true"
          - component: list
            layout:
              direction: vertical
              gap: small
            repeat:
              source: frontPage.queued_executions
              as: execution
              key: execution.key
            children:
              - component: disclosure
                disclosure:
                  stateKey: "front-queued:{{execution.key}}"
                layout:
                  direction: vertical
                  gap: small
                  padding: small
                text:
                  template: "{{execution.title}} · {{execution.summary.in_progress}} active · {{execution.summary.waiting}} waiting"
                image:
                  asset: ciwi-logo
                  description: ciwi execution
                style:
                  role: execution-row
                  emphasis: strong
                  toneBinding: execution.status
                children:
                  - component: text
                    text:
                      template: "{{execution.summary.in_progress}} active · {{execution.summary.waiting}} waiting · {{execution.summary.total_jobs}} total"
                    style:
                      tone: muted
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: execution.sections
                      as: section
                      key: section.key
                    children:
                      - component: column
                        layout:
                          direction: vertical
                          gap: small
                        children:
                          - component: text
                            text:
                              template: "Pipeline: {{section.label}}"
                            style:
                              emphasis: strong
                          - component: list
                            layout:
                              direction: vertical
                              gap: small
                            repeat:
                              source: section.jobs
                              as: job
                              key: job.id
                            children:
                              - component: row
                                layout:
                                  direction: horizontal
                                  gap: medium
                                  align: center
                                children:
                                  - component: column
                                    layout:
                                      direction: vertical
                                      gap: small
                                      grow: true
                                    children:
                                      - component: text
                                        text:
                                          binding: job.label
                                        style:
                                          emphasis: strong
                                      - component: badge
                                        text:
                                          binding: job.status
                                        style:
                                          toneBinding: job.status
                                      - component: text
                                        text:
                                          binding: job.current_step
                                        visible:
                                          binding: job.current_step
                                          equals: ""
                                          not: true
                                        style:
                                          tone: muted
                                  - component: button
                                    text:
                                      literal: Open details
                                    actions:
                                      - on: activate
                                        command: navigate
                                        arguments:
                                          route: /jobs/{{job.id}}
      - component: section
        id: execution-history
        layout:
          direction: vertical
          gap: medium
        children:
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            children:
              - component: text
                text:
                  literal: Job Execution History
                layout:
                  grow: true
                style:
                  role: heading
                  emphasis: strong
              - component: button
                text:
                  literal: Flush History
                icon: trash
                actions:
                  - on: activate
                    command: flush-history
                    confirm:
                      title: Flush execution history?
                      message: Removes all terminal execution records and their server-side artifacts. It does not clear caches or workspaces on agents, and it does not affect queued or running jobs.
              - component: button
                text:
                  literal: Collapse All
                icon: chevrons-up
                actions:
                  - on: activate
                    command: set-disclosures
                    arguments:
                      prefix: "front-history:"
                      expanded: "false"
              - component: button
                text:
                  literal: Expand All
                icon: chevrons-down
                actions:
                  - on: activate
                    command: set-disclosures
                    arguments:
                      prefix: "front-history:"
                      expanded: "true"
          - component: list
            layout:
              direction: vertical
              gap: small
            repeat:
              source: frontPage.history_executions
              as: execution
              key: execution.key
            children:
              - component: disclosure
                disclosure:
                  stateKey: "front-history:{{execution.key}}"
                layout:
                  direction: vertical
                  gap: small
                  padding: small
                text:
                  template: "{{execution.title}} · {{execution.summary.succeeded}}/{{execution.summary.total_jobs}} successful"
                image:
                  asset: ciwi-logo
                  description: ciwi execution
                style:
                  role: execution-row
                  emphasis: strong
                  toneBinding: execution.status
                children:
                  - component: row
                    layout:
                      direction: horizontal
                      align: center
                    children:
                      - component: spacer
                        layout:
                          grow: true
                      - component: button
                        text:
                          literal: Delete execution
                        icon: trash
                        actions:
                          - on: activate
                            command: delete-execution
                            arguments:
                              jobExecutionIds: "{{execution.job_execution_ids_csv}}"
                            confirm:
                              title: Delete this execution?
                              message: Removes this execution's terminal job records and server-side artifacts. It does not clear caches or workspaces on agents, and it does not affect queued or running jobs.
                  - component: text
                    text:
                      template: "{{execution.summary.succeeded}} succeeded · {{execution.summary.failed}} failed · {{execution.summary.total_jobs}} total"
                    style:
                      tone: muted
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: execution.sections
                      as: section
                      key: section.key
                    children:
                      - component: column
                        layout:
                          direction: vertical
                          gap: small
                        children:
                          - component: text
                            text:
                              template: "Pipeline: {{section.label}}"
                            style:
                              emphasis: strong
                          - component: list
                            layout:
                              direction: vertical
                              gap: small
                            repeat:
                              source: section.jobs
                              as: job
                              key: job.id
                            children:
                              - component: row
                                layout:
                                  direction: horizontal
                                  gap: medium
                                  align: center
                                children:
                                  - component: column
                                    layout:
                                      direction: vertical
                                      gap: small
                                      grow: true
                                    children:
                                      - component: text
                                        text:
                                          binding: job.label
                                        style:
                                          emphasis: strong
                                      - component: badge
                                        text:
                                          binding: job.status
                                        style:
                                          toneBinding: job.status
                                      - component: text
                                        text:
                                          binding: job.current_step
                                        visible:
                                          binding: job.current_step
                                          equals: ""
                                          not: true
                                        style:
                                          tone: muted
                                  - component: button
                                    text:
                                      literal: Open details
                                    actions:
                                      - on: activate
                                        command: navigate
                                        arguments:
                                          route: /jobs/{{job.id}}
