apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: front-page
  title: ciwi
  description: Projects and pipeline entry points
screen:
  dataSources:
    - name: frontPage
      query: get-front-page-view
      watchTopics: [server, projects, agents, agent-eligibility, queue, history]
    - name: client
      query: get-native-client-state
  persistence:
    - name: projectsExpanded
      storageKey: ciwi.front-page.projects-expanded.v1
      defaultValue: "true"
      scope: client
  root:
    component: page
    id: front-page
    layout:
      direction: vertical
      gap: "16"
      padding: large
      maxWidth: page
    children:
      - component: row
        id: masthead
        layout:
          direction: horizontal
          gap: "12"
          align: center
        style:
          role: hero
        overrides:
          compact:
            layout:
              direction: vertical
              align: start
        children:
          - component: row
            layout:
              direction: horizontal
              gap: medium
              align: center
              grow: true
            children:
              - component: image
                image:
                  asset: ciwi-logo
                  description: ciwi CI/CD server
              - component: column
                layout:
                  direction: vertical
                  gap: small
                children:
                  - component: row
                    layout:
                      direction: horizontal
                      gap: small
                      align: center
                    children:
                      - component: text
                        text:
                          literal: ciwi
                        style:
                          role: title
                          emphasis: strong
                      - component: badge
                        text:
                          binding: frontPage.server.version
                        style:
                          tone: muted
                  - component: text
                    text:
                      literal: Projects, pipelines and job executions
                    style:
                      role: subtitle
                      tone: muted
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            style:
              role: compact-toolbar
            children:
              - component: button
                text:
                  literal: Agents
                icon: server
                enabled:
                  binding: client.connected
                style:
                  emphasis: strong
                overrides:
                  compact:
                    style:
                      role: icon-button
                actions:
                  - on: activate
                    command: navigate
                    arguments:
                      route: /agents
              - component: button
                text:
                  literal: Global Settings
                icon: settings
                style:
                  emphasis: strong
                overrides:
                  compact:
                    style:
                      role: icon-button
                actions:
                  - on: activate
                    command: navigate
                    arguments:
                      route: /settings
              - component: button
                text:
                  literal: Trying to connect…
                icon: network
                style:
                  role: connection-pulse
                visible:
                  binding: client.connecting
                actions:
                  - on: activate
                    command: navigate
                    arguments:
                      route: /settings
              - component: button
                text:
                  literal: Configure server
                icon: server
                visible:
                  binding: client.offline
                actions:
                  - on: activate
                    command: navigate
                    arguments:
                      route: /settings
      - component: section
        id: projects
        layout:
          direction: vertical
          gap: "12"
        children:
          - component: row
            layout:
              direction: horizontal
              gap: medium
              align: center
            children:
              - component: text
                text:
                  literal: Projects
                style:
                  role: heading
                  emphasis: strong
                layout:
                  grow: true
              - component: button
                text:
                  literal: Trying to connect…
                icon: network
                style:
                  role: connection-pulse
                visible:
                  binding: client.connecting
                actions:
                  - on: activate
                    command: navigate
                    arguments:
                      route: /settings
              - component: button
                text:
                  literal: Configure server
                icon: server
                visible:
                  binding: client.offline
                actions:
                  - on: activate
                    command: navigate
                    arguments:
                      route: /settings
          - component: list
            id: project-list
            layout:
              direction: vertical
              gap: "10"
            repeat:
              source: frontPage.projects
              as: project
              key: project.id
            children:
              - component: disclosure
                text:
                  literal: "Project:"
                disclosure:
                  defaultExpanded: true
                  stateKey: "front-project:{{project.id}}"
                  compactPresentation: sheet
                  summary:
                    - component: text
                      text:
                        binding: project.name
                      style:
                        tone: accent
                        emphasis: strong
                        role: link
                      actions:
                        - on: activate
                          command: navigate
                          arguments:
                            route: /projects/{{project.id}}
                    - component: badge
                      text:
                        binding: project.repo_url
                      visible:
                        binding: project.repo_url
                        empty: true
                        not: true
                      style:
                        tone: muted
                    - component: badge
                      text:
                        template: "branch:{{project.repo_ref}}"
                      visible:
                        binding: project.repo_ref
                        empty: true
                        not: true
                      style:
                        tone: muted
                    - component: badge
                      text:
                        binding: project.config_file
                      visible:
                        binding: project.config_file
                        empty: true
                        not: true
                      style:
                        tone: muted
                    - component: spacer
                      layout:
                        grow: true
                    - component: badge
                      text:
                        binding: project.pipeline_count_label
                      style:
                        tone: muted
                layout:
                  direction: vertical
                  gap: small
                  padding: "10"
                style:
                  role: project-row
                  emphasis: strong
                children:
                  - component: row
                    layout:
                      direction: horizontal
                      gap: medium
                      align: center
                    children:
                      - component: text
                        text:
                          binding: project.repo_url
                        layout:
                          grow: true
                        visible:
                          binding: project.repo_url
                          empty: true
                          not: true
                        style:
                          role: body
                          tone: muted
                          truncate: true
                      - component: button
                        text:
                          literal: View details
                        overrides:
                          gio:
                            hidden: true
                        actions:
                          - on: activate
                            command: navigate
                            arguments:
                              route: /projects/{{project.id}}
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: project.pipeline_chains
                      as: chain
                      key: chain.id
                    children:
                      - component: row
                        layout:
                          direction: horizontal
                          gap: medium
                          align: center
                        children:
                          - component: column
                            layout:
                              direction: vertical
                              gap: small
                              grow: true
                            children:
                              - component: text
                                text:
                                  template: "Chain: {{chain.name}}"
                                style:
                                  role: body
                                  emphasis: strong
                              - component: text
                                text:
                                  binding: chain.sequence_label
                                style:
                                  role: body
                                  tone: muted
                          - component: button
                            text:
                              literal: Options
                            icon: adjustments
                            overrides:
                              compact:
                                style:
                                  role: icon-button
                            actions:
                              - on: activate
                                command: navigate
                                arguments:
                                  route: /run-options/projects/{{project.id}}/chains/{{chain.id}}
                          - component: button
                            text:
                              literal: Run Chain
                            icon: player-play
                            actions:
                              - on: activate
                                command: run-chain
                                arguments:
                                  projectId: "{{project.id}}"
                                  chainId: "{{chain.id}}"
                                confirm:
                                  title: Run pipeline chain
                                  message: Queues every pipeline in this chain as one independent run. It does not interrupt jobs that are already queued or running.
                          - component: button
                            text:
                              literal: Dry Run
                            icon: player-play
                            visible:
                              binding: chain.supports_dry_run
                            actions:
                              - on: activate
                                command: run-chain
                                arguments:
                                  projectId: "{{project.id}}"
                                  chainId: "{{chain.id}}"
                                  dryRun: "true"
                                confirm:
                                  title: Dry-run pipeline chain
                                  message: Queues a dry-run execution of every pipeline in this chain. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
                        style:
                          role: compact-action-row
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: project.pipelines
                      as: pipeline
                      key: pipeline.id
                    children:
                      - component: row
                        layout:
                          direction: horizontal
                          gap: medium
                          align: center
                        children:
                          - component: text
                            text:
                              binding: pipeline.pipeline_id
                            style:
                              role: body
                              emphasis: strong
                          - component: spacer
                            layout:
                              grow: true
                          - component: button
                            text:
                              literal: Options
                            icon: adjustments
                            overrides:
                              compact:
                                style:
                                  role: icon-button
                            actions:
                              - on: activate
                                command: navigate
                                arguments:
                                  route: /run-options/projects/{{project.id}}/pipelines/{{pipeline.id}}
                          - component: button
                            text:
                              literal: Run
                            icon: player-play
                            actions:
                              - on: activate
                                command: run-pipeline
                                arguments:
                                  pipelineDbId: "{{pipeline.id}}"
                                confirm:
                                  title: Run pipeline
                                  message: This adds a new execution without interrupting jobs that are already queued or running.
                          - component: button
                            text:
                              literal: Dry Run
                            icon: player-play
                            visible:
                              binding: pipeline.supports_dry_run
                            actions:
                              - on: activate
                                command: run-pipeline
                                arguments:
                                  pipelineDbId: "{{pipeline.id}}"
                                  dryRun: "true"
                                confirm:
                                  title: Dry-run pipeline
                                  message: Queues a dry-run execution of this pipeline. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
                        style:
                          role: compact-action-row
        overrides:
          gio:
            layout:
              gap: small
      - component: section
        id: queued-executions
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Queued and In Progress Job Executions
            style:
              role: heading
              emphasis: strong
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            style:
              role: compact-toolbar
            children:
              - component: button
                text:
                  literal: Clear Queue
                actions:
                  - on: activate
                    command: clear-queue
                    confirm:
                      title: Clear queued executions?
                      message: Removes queued and leased execution records from the server. Running jobs continue, and agent caches and workspaces are not cleared.
              - component: button
                text:
                  literal: Collapse All
                icon: chevrons-up
                style:
                  role: icon-button
                actions:
                  - on: activate
                    command: set-disclosures
                    arguments:
                      prefix: "front-queued:"
                      expanded: "false"
              - component: button
                text:
                  literal: Expand All
                icon: chevrons-down
                style:
                  role: icon-button
                actions:
                  - on: activate
                    command: set-disclosures
                    arguments:
                      prefix: "front-queued:"
                      expanded: "true"
          - component: text
            text:
              literal: No queued jobs.
            visible:
              binding: frontPage.queued_empty
            style:
              tone: muted
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            style:
              role: queued-execution-header
            children:
              - component: text
                text: {literal: Job}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Status}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Pipeline}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Build}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Agent}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Created}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Reason}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Actions}
                style: {role: table-header, emphasis: strong}
          - component: list
            layout:
              direction: vertical
              gap: small
            repeat:
              source: frontPage.queued_executions
              as: execution
              key: execution.key
            children:
              - component: disclosure
                progress:
                  binding: execution.progress
                disclosure:
                  stateKey: "front-queued:{{execution.key}}"
                  compactPresentation: sheet
                  summary:
                    - component: text
                      text:
                        binding: execution.summary_label
                      style:
                        toneBinding: execution.summary_tone
                        emphasis: strong
                layout:
                  direction: vertical
                  gap: small
                  padding: small
                text:
                  binding: execution.title
                image:
                  asset: ciwi-logo
                  description: ciwi execution
                style:
                  role: execution-row
                  emphasis: strong
                  toneBinding: execution.status
                children:
                  - component: text
                    text:
                      template: "{{execution.summary.in_progress}} active · {{execution.summary.waiting}} waiting · {{execution.summary.total_jobs}} total"
                    style:
                      tone: muted
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: execution.sections
                      as: section
                      key: section.key
                    children:
                      - component: column
                        layout:
                          direction: vertical
                          gap: small
                        children:
                          - component: text
                            progress:
                              binding: section.progress
                            text:
                              template: "pipeline: {{section.label}}"
                            style:
                              emphasis: strong
                              tone: muted
                          - component: list
                            layout:
                              direction: vertical
                              gap: small
                            repeat:
                              source: section.jobs
                              as: job
                              key: job.id
                            children:
                              - component: row
                                layout:
                                  direction: horizontal
                                  gap: small
                                  align: start
                                style:
                                  role: queued-execution-job-row
                                children:
                                  - component: text
                                    text:
                                      binding: job.label
                                    style:
                                      role: link
                                      tone: accent
                                      emphasis: strong
                                    actions:
                                      - on: activate
                                        command: navigate
                                        arguments:
                                          route: /jobs/{{job.id}}
                                  - component: text
                                    text:
                                      binding: job.status
                                    style:
                                      toneBinding: job.status
                                      emphasis: strong
                                  - component: text
                                    text: {binding: job.pipeline_id}
                                  - component: text
                                    text: {binding: job.build_label}
                                  - component: text
                                    text: {binding: job.agent_id}
                                  - component: text
                                    text: {binding: job.created_label}
                                  - component: text
                                    text: {binding: job.reason}
                                    style: {tone: warning}
                                  - component: row
                                    layout:
                                      direction: horizontal
                                      gap: small
                                      align: center
                                    children:
                                      - component: button
                                        text: {literal: Remove}
                                        visible:
                                          binding: job.action
                                          equals: remove
                                        actions:
                                          - on: activate
                                            command: remove-execution
                                            arguments:
                                              jobExecutionId: "{{job.id}}"
                                      - component: button
                                        text: {literal: Cancel}
                                        visible:
                                          binding: job.action
                                          equals: cancel
                                        actions:
                                          - on: activate
                                            command: cancel-execution
                                            arguments:
                                              jobExecutionId: "{{job.id}}"
                                            confirm:
                                              title: Cancel job?
                                              message: Requests cancellation of this running job. Other queued and running executions are not affected.
      - component: section
        id: execution-history
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Job Execution History
            style:
              role: heading
              emphasis: strong
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            style:
              role: compact-toolbar
            children:
              - component: button
                text:
                  literal: Flush History
                actions:
                  - on: activate
                    command: flush-history
                    confirm:
                      title: Flush execution history?
                      message: Removes all terminal execution records and their server-side artifacts. It does not clear caches or workspaces on agents, and it does not affect queued or running jobs.
              - component: button
                text:
                  literal: Collapse All
                icon: chevrons-up
                style:
                  role: icon-button
                actions:
                  - on: activate
                    command: set-disclosures
                    arguments:
                      prefix: "front-history:"
                      expanded: "false"
              - component: button
                text:
                  literal: Expand All
                icon: chevrons-down
                style:
                  role: icon-button
                actions:
                  - on: activate
                    command: set-disclosures
                    arguments:
                      prefix: "front-history:"
                      expanded: "true"
          - component: text
            text:
              literal: No execution history.
            visible:
              binding: frontPage.history_empty
            style:
              tone: muted
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            style:
              role: history-execution-header
            children:
              - component: text
                text: {literal: Job}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Status}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Pipeline}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Build}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Agent}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Created}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Duration}
                style: {role: table-header, emphasis: strong}
          - component: list
            layout:
              direction: vertical
              gap: small
            repeat:
              source: frontPage.history_executions
              as: execution
              key: execution.key
            children:
              - component: disclosure
                disclosure:
                  stateKey: "front-history:{{execution.key}}"
                  compactPresentation: sheet
                  summary:
                    - component: text
                      text:
                        template: "{{execution.summary.succeeded}}/{{execution.summary.total_jobs}} successful"
                      style:
                        toneBinding: execution.status
                        emphasis: strong
                    - component: button
                      text:
                        literal: Delete execution
                      icon: trash
                      style:
                        role: icon-button
                      actions:
                        - on: activate
                          command: delete-execution
                          arguments:
                            jobExecutionIds: "{{execution.job_execution_ids_csv}}"
                          confirm:
                            title: Delete this execution?
                            message: Removes this execution's terminal job records and server-side artifacts. It does not clear caches or workspaces on agents, and it does not affect queued or running jobs.
                layout:
                  direction: vertical
                  gap: small
                  padding: small
                text:
                  binding: execution.title
                image:
                  asset: ciwi-logo
                  description: ciwi execution
                style:
                  role: execution-row
                  emphasis: strong
                  toneBinding: execution.status
                children:
                  - component: text
                    text:
                      template: "{{execution.summary.succeeded}} succeeded · {{execution.summary.failed}} failed · {{execution.summary.total_jobs}} total"
                    style:
                      tone: muted
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: execution.sections
                      as: section
                      key: section.key
                    children:
                      - component: column
                        layout:
                          direction: vertical
                          gap: small
                        children:
                          - component: text
                            text:
                              template: "pipeline: {{section.label}}"
                            style:
                              emphasis: strong
                              tone: muted
                          - component: list
                            layout:
                              direction: vertical
                              gap: small
                            repeat:
                              source: section.jobs
                              as: job
                              key: job.id
                            children:
                              - component: row
                                layout:
                                  direction: horizontal
                                  gap: small
                                  align: start
                                style:
                                  role: history-execution-job-row
                                children:
                                  - component: text
                                    text:
                                      binding: job.label
                                    style:
                                      role: link
                                      tone: accent
                                      emphasis: strong
                                    actions:
                                      - on: activate
                                        command: navigate
                                        arguments:
                                          route: /jobs/{{job.id}}
                                  - component: text
                                    text:
                                      binding: job.status
                                    style:
                                      toneBinding: job.status
                                      emphasis: strong
                                  - component: text
                                    text: {binding: job.pipeline_id}
                                  - component: text
                                    text: {binding: job.build_label}
                                  - component: text
                                    text: {binding: job.agent_id}
                                  - component: text
                                    text: {binding: job.created_label}
                                  - component: text
                                    text: {binding: job.duration_label}
