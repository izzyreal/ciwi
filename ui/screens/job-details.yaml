apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: job-details
  title: ciwi job execution
  description: Job execution status and phase/step timeline
screen:
  dataSources:
    - name: jobDetails
      query: get-job-details
      watchTopics: [agents, agent-eligibility, queue, history]
  root:
    component: page
    id: job-details
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        id: job-header
        layout:
          direction: horizontal
          gap: medium
          align: center
        style:
          role: hero
        children:
          - component: column
            layout:
              direction: vertical
              gap: small
              grow: true
            children:
              - component: text
                text:
                  binding: jobDetails.title
                style:
                  role: title
                  emphasis: strong
              - component: text
                text:
                  binding: jobDetails.context
                style:
                  role: subtitle
                  tone: muted
                  truncate: true
          - component: button
            text:
              literal: Run Job Again
            icon: refresh
            visible:
              binding: jobDetails.can_rerun
            actions:
              - on: activate
                command: rerun-execution
                arguments:
                  jobExecutionId: "{{jobDetails.id}}"
                confirm:
                  title: Run this job again?
                  message: Creates an independent queued attempt from this stored execution. It does not interrupt, replace, or otherwise affect jobs that are already queued or running.
          - component: button
            text:
              literal: Cancel Execution
            icon: circle-x
            visible:
              binding: jobDetails.can_cancel
            actions:
              - on: activate
                command: cancel-execution
                arguments:
                  jobExecutionId: "{{jobDetails.id}}"
                confirm:
                  title: Cancel this execution?
                  message: Marks this execution failed on the server. A process already running on an agent is not forcibly terminated and may finish in the background; other queued and running executions are unaffected.
          - component: button
            text:
              literal: Back to Executions
            icon: arrow-left
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /
      - component: section
        id: execution-summary
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Execution
            style:
              role: heading
              emphasis: strong
          - component: card
            layout:
              direction: vertical
              gap: small
              padding: medium
            children:
              - component: row
                layout:
                  direction: horizontal
                  gap: small
                  align: center
                children:
                  - component: badge
                    text:
                      binding: jobDetails.status_label
                    style:
                      toneBinding: jobDetails.status
                  - component: badge
                    text:
                      binding: jobDetails.mode
                    style:
                      tone: muted
              - component: text
                text:
                  template: "Created: {{jobDetails.created}}"
                visible:
                  binding: jobDetails.created
                  empty: true
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Started: {{jobDetails.started}}"
                visible:
                  binding: jobDetails.started
                  empty: true
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Finished: {{jobDetails.finished}} · Duration: {{jobDetails.duration}}"
                visible:
                  binding: jobDetails.finished
                  empty: true
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Agent: {{jobDetails.agent}}"
                visible:
                  binding: jobDetails.agent
                  empty: true
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Current step: {{jobDetails.current_step}}"
                visible:
                  binding: jobDetails.current_step
                  empty: true
                  not: true
              - component: text
                text:
                  template: "Exit code: {{jobDetails.exit_code}}"
                visible:
                  binding: jobDetails.exit_code
                  empty: true
                  not: true
              - component: text
                text:
                  template: "Error: {{jobDetails.error}}"
                visible:
                  binding: jobDetails.error
                  empty: true
                  not: true
                style:
                  tone: danger
              - component: column
                layout:
                  direction: vertical
                  gap: small
                visible:
                  binding: jobDetails.scheduling_diagnosis.summary
                  empty: true
                  not: true
                children:
                  - component: text
                    text:
                      literal: Scheduling
                    style:
                      emphasis: strong
                  - component: text
                    text:
                      binding: jobDetails.scheduling_diagnosis.summary
                  - component: text
                    text:
                      template: "Required: {{jobDetails.scheduling_diagnosis.requirements_label}}"
                    visible:
                      binding: jobDetails.scheduling_diagnosis.requirements_label
                      empty: true
                      not: true
                    style:
                      tone: muted
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: jobDetails.scheduling_diagnosis.agents
                      as: schedulingAgent
                      key: schedulingAgent.agent_id
                    children:
                      - component: row
                        layout:
                          direction: horizontal
                          gap: small
                          align: center
                        children:
                          - component: text
                            text:
                              binding: schedulingAgent.agent_id
                            style:
                              emphasis: strong
                          - component: badge
                            text:
                              binding: schedulingAgent.status
                            style:
                              toneBinding: schedulingAgent.tone
                          - component: text
                            text:
                              binding: schedulingAgent.details
                            visible:
                              binding: schedulingAgent.details
                              empty: true
                              not: true
                            layout:
                              grow: true
                            style:
                              tone: muted
                  - component: text
                    text:
                      binding: jobDetails.scheduling_diagnosis.additional_agents_label
                    visible:
                      binding: jobDetails.scheduling_diagnosis.additional_agents_label
                      empty: true
                      not: true
                    style:
                      tone: muted
      - component: section
        id: execution-path
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Execution path
            style:
              role: heading
              emphasis: strong
          - component: scroller
            layout:
              direction: horizontal
              gap: small
              maxHeight: "118"
            repeat:
              source: jobDetails.timeline
              as: item
              key: item.id
            children:
              - component: card
                layout:
                  direction: vertical
                  gap: small
                  padding: small
                  minWidth: "235"
                  maxWidth: "300"
                  minHeight: "86"
                actions:
                  - on: activate
                    command: select-timeline-item
                    arguments:
                      id: "{{item.id}}"
                children:
                  - component: text
                    text:
                      binding: item.title
                    style:
                      emphasis: strong
                      truncate: true
                  - component: badge
                    text:
                      binding: item.status_label
                    style:
                      toneBinding: item.status
          - component: card
            id: selected-execution-step
            layout:
              direction: vertical
              gap: small
              padding: medium
            children:
              - component: text
                text:
                  binding: jobDetails.selected_timeline_item.title
                style:
                  emphasis: strong
              - component: badge
                text:
                  binding: jobDetails.selected_timeline_item.status_label
                visible:
                  binding: jobDetails.selected_timeline_item.status_label
                  empty: true
                  not: true
                style:
                  toneBinding: jobDetails.selected_timeline_item.status
              - component: text
                text:
                  binding: jobDetails.selected_timeline_item.description
                visible:
                  binding: jobDetails.selected_timeline_item.description
                  empty: true
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Duration: {{jobDetails.selected_timeline_item.duration}}"
                visible:
                  binding: jobDetails.selected_timeline_item.duration
                  empty: true
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Exit code: {{jobDetails.selected_timeline_item.exit_code}}"
                visible:
                  binding: jobDetails.selected_timeline_item.exit_code
                  empty: true
                  not: true
              - component: text
                text:
                  template: "Error: {{jobDetails.selected_timeline_item.error}}"
                visible:
                  binding: jobDetails.selected_timeline_item.error
                  empty: true
                  not: true
                style:
                  tone: danger
      - component: section
        id: execution-output
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Output / Error
            style:
              role: heading
              emphasis: strong
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            children:
              - component: button
                text:
                  binding: jobDetails.tailing_label
                actions:
                  - on: activate
                    command: toggle-output-tailing
              - component: button
                text:
                  literal: Copy Output
                icon: copy
                actions:
                  - on: activate
                    command: copy-output
              - component: input
                layout:
                  grow: true
                  minWidth: "180"
                input:
                  value: jobDetails.output_search
                  placeholder: Search output
                actions:
                  - on: change
                    command: change-output-search
                    arguments:
                      query: "{{input.value}}"
              - component: button
                text:
                  literal: Previous
                icon: chevron-up
                actions:
                  - on: activate
                    command: find-output
                    arguments:
                      query: "{{jobDetails.output_search}}"
                      direction: previous
              - component: button
                text:
                  literal: Next
                icon: chevron-down
                actions:
                  - on: activate
                    command: find-output
                    arguments:
                      query: "{{jobDetails.output_search}}"
                      direction: next
              - component: text
                text:
                  binding: jobDetails.output_search_count
                style:
                  tone: muted
          - component: card
            id: job-output-system
            layout:
              direction: vertical
              gap: small
              padding: small
            visible:
              binding: jobDetails.system_output
              empty: true
              not: true
            children:
              - component: text
                text:
                  literal: System messages
                style:
                  emphasis: strong
              - component: text
                id: job-output-system-text
                text:
                  binding: jobDetails.system_output
                style:
                  role: code
          - component: scroller
            id: job-output-groups
            layout:
              direction: vertical
              gap: small
              maxHeight: "720"
            repeat:
              source: jobDetails.output_groups
              as: outputGroup
              key: outputGroup.id
            children:
              - component: disclosure
                text:
                  binding: outputGroup.title
                disclosure:
                  defaultExpanded: false
                  stateKey: "{{outputGroup.state_key}}"
                layout:
                  direction: vertical
                  gap: small
                  padding: medium
                style:
                  toneBinding: outputGroup.status
                children:
                  - component: text
                    text:
                      binding: outputGroup.command_summary
                    visible:
                      binding: outputGroup.command_summary
                      empty: true
                      not: true
                    style:
                      role: code
                      tone: muted
                      truncate: true
                  - component: badge
                    text:
                      binding: outputGroup.status_label
                    style:
                      toneBinding: outputGroup.status
                  - component: text
                    text:
                      template: "Started: {{outputGroup.started}}"
                    visible:
                      binding: outputGroup.started
                      empty: true
                      not: true
                    style:
                      tone: muted
                  - component: text
                    text:
                      template: "Duration: {{outputGroup.duration}}"
                    visible:
                      binding: outputGroup.duration
                      empty: true
                      not: true
                    style:
                      tone: muted
                  - component: text
                    text:
                      template: "Exit code: {{outputGroup.exit_code}}"
                    visible:
                      binding: outputGroup.exit_code
                      empty: true
                      not: true
                  - component: text
                    text:
                      template: "Error: {{outputGroup.error}}"
                    visible:
                      binding: outputGroup.error
                      empty: true
                      not: true
                    style:
                      tone: danger
                  - component: text
                    text:
                      literal: Details
                    visible:
                      binding: outputGroup.is_phase
                    style:
                      emphasis: strong
                  - component: text
                    text:
                      binding: outputGroup.details
                    visible:
                      binding: outputGroup.is_phase
                    style:
                      role: code
                  - component: text
                    text:
                      literal: YAML literal
                    visible:
                      binding: outputGroup.is_step
                    style:
                      emphasis: strong
                  - component: text
                    text:
                      binding: outputGroup.yaml_literal
                    visible:
                      binding: outputGroup.is_step
                    style:
                      role: code
                  - component: text
                    text:
                      literal: Expanded command
                    visible:
                      binding: outputGroup.is_step
                    style:
                      emphasis: strong
                  - component: text
                    text:
                      binding: outputGroup.expanded_command
                    visible:
                      binding: outputGroup.is_step
                    style:
                      role: code
                  - component: text
                    text:
                      literal: Output
                    style:
                      emphasis: strong
                  - component: text
                    id: job-output-group-text
                    text:
                      binding: outputGroup.output
                    visible:
                      binding: outputGroup.output
                      empty: true
                      not: true
                    style:
                      role: code
                  - component: text
                    text:
                      binding: outputGroup.empty_output_label
                    visible:
                      binding: outputGroup.output
                      empty: true
                    style:
                      role: code
                      tone: muted
                  - component: button
                    text:
                      literal: Collapse
                    icon: arrow-up
                    actions:
                      - on: activate
                        command: set-disclosures
                        arguments:
                          prefix: "{{outputGroup.state_key}}"
                          expanded: "false"
