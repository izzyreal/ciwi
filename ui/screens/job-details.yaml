apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: job-details
  title: ciwi job execution
  description: Job execution status and phase/step timeline
screen:
  dataSources:
    - name: jobDetails
      watchTopics: [agent-eligibility, queue, history]
  root:
    component: page
    id: job-details
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        id: job-header
        progress:
          binding: jobDetails.progress
        layout:
          direction: horizontal
          gap: medium
          align: center
        style:
          role: hero
        children:
          - component: image
            image:
              binding: jobDetails.project_icon
              description: Project logo
            visible:
              binding: jobDetails.project_icon
              empty: true
              not: true
            style:
              role: job-header-icon
          - component: column
            layout:
              direction: vertical
              gap: small
              grow: true
            children:
              - component: text
                text:
                  binding: jobDetails.title
                style:
                  role: job-title
                  emphasis: strong
              - component: row
                layout: {direction: horizontal, gap: small, align: center}
                children:
                  - component: text
                    text: {literal: "Status:"}
                    style: {role: subtitle, tone: muted}
                  - component: text
                    text: {binding: jobDetails.status_label}
                    style: {role: subtitle, emphasis: strong, toneBinding: jobDetails.status}
                  - component: text
                    text: {template: "- {{jobDetails.current_step}}"}
                    visible: {binding: jobDetails.current_step, empty: true, not: true}
                    style: {role: subtitle, tone: muted, truncate: true}
          - component: button
            text:
              literal: Run Job Again
            icon: refresh
            visible:
              binding: jobDetails.can_rerun
            actions:
              - on: activate
                command: rerun-execution
                arguments:
                  jobExecutionId: "{{jobDetails.id}}"
                confirm:
                  title: Run this job again?
                  message: Creates an independent queued attempt from this stored execution. It does not interrupt, replace, or otherwise affect jobs that are already queued or running.
          - component: button
            text:
              literal: Cancel
            icon: circle-x
            visible:
              binding: jobDetails.can_cancel
            actions:
              - on: activate
                command: cancel-execution
                arguments:
                  jobExecutionId: "{{jobDetails.id}}"
                confirm:
                  title: Cancel this execution?
                  message: Marks this execution failed on the server. A process already running on an agent is not forcibly terminated and may finish in the background; other queued and running executions are unaffected.
          - component: button
            text:
              literal: Back to Job Executions
            icon: arrow-left
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /
                  section: execution-history
      - component: column
        id: job-details-loading
        visible: {binding: jobDetails.loading}
        layout: {direction: vertical, gap: medium}
        children:
          - component: row
            layout: {grow: true, minHeight: "14"}
            style: {role: skeleton}
          - component: card
            layout: {direction: vertical, gap: medium, padding: large}
            children:
              - component: row
                layout: {grow: true, minHeight: "18"}
                style: {role: skeleton}
              - component: spacer
                layout: {grow: true, minHeight: "140"}
      - component: column
        id: job-details-load-error
        visible: {binding: jobDetails.load_error, empty: true, not: true}
        layout: {direction: vertical, gap: medium}
        children:
          - component: text
            text: {literal: Could not load Job Details}
            style: {role: heading, emphasis: strong, tone: danger}
          - component: text
            text: {binding: jobDetails.load_error}
            style: {tone: danger}
          - component: row
            layout: {direction: horizontal, gap: small, wrap: true}
            children:
              - component: button
                text: {literal: Retry}
                icon: refresh
                actions: [{on: activate, command: refresh}]
              - component: button
                text: {literal: Back to Job Executions}
                icon: arrow-left
                actions: [{on: activate, command: navigate, arguments: {route: /, section: execution-history}}]
      - component: column
        id: execution-details
        visible: {binding: jobDetails.ready}
        layout:
          direction: vertical
          gap: medium
        children:
          - component: row
            layout: {direction: horizontal, gap: medium, align: start, wrap: true}
            children:
              - component: card
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                children:
                  - component: text
                    text: {literal: Job Properties}
                    style: {role: heading, emphasis: strong}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.job_properties, as: detailRow, key: detailRow.label}
                    children:
                      - component: row
                        layout: {direction: horizontal, gap: small, align: start}
                        overrides:
                          compact:
                            layout: {direction: vertical, align: start}
                        children:
                          - component: text
                            text: {binding: detailRow.label}
                            layout: {minWidth: "150"}
                            style: {role: detail, tone: muted}
                          - component: text
                            text: {binding: detailRow.value}
                            layout: {grow: true}
                            style: {role: detail}
              - component: card
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                children:
                  - component: text
                    text: {literal: Cache Statistics}
                    style: {role: heading, emphasis: strong}
                  - component: text
                    text: {binding: jobDetails.cache_statistics_empty}
                    visible: {binding: jobDetails.cache_statistics_empty, empty: true, not: true}
                    style: {role: detail, tone: muted}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.cache_statistics, as: cacheRow, key: cacheRow.label}
                    children:
                      - component: card
                        layout: {direction: vertical, gap: small, padding: small}
                        children:
                          - component: text
                            text: {binding: cacheRow.label}
                            style: {role: detail, emphasis: strong}
                          - component: text
                            text: {binding: cacheRow.value}
                            style: {role: cache-statistics, toneBinding: cacheRow.tone}
          - component: row
            layout: {direction: horizontal, gap: medium, align: start, wrap: true}
            children:
              - component: card
                visible: {binding: jobDetails.scheduling_diagnosis.summary, empty: true, not: true}
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                style: {role: scheduling-awaiting}
                children:
                  - component: text
                    text: {literal: Scheduling}
                    style: {role: heading, emphasis: strong, tone: awaiting}
                  - component: text
                    text: {binding: jobDetails.scheduling_diagnosis.summary}
                    style: {role: detail, emphasis: strong, tone: awaiting}
                  - component: text
                    text: {template: "Required: {{jobDetails.scheduling_diagnosis.requirements_label}}"}
                    visible: {binding: jobDetails.scheduling_diagnosis.requirements_label, empty: true, not: true}
                    style: {role: detail, tone: awaiting}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.scheduling_diagnosis.agents, as: schedulingAgent, key: schedulingAgent.agent_id}
                    children:
                      - component: text
                        text: {template: "{{schedulingAgent.agent_id}}: {{schedulingAgent.status}} — {{schedulingAgent.details}}"}
                        style: {role: detail, tone: awaiting}
                  - component: text
                    text: {binding: jobDetails.scheduling_diagnosis.additional_agents_label}
                    visible: {binding: jobDetails.scheduling_diagnosis.additional_agents_label, empty: true, not: true}
                    style: {role: detail, tone: awaiting}
              - component: card
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                children:
                  - component: text
                    text: {literal: Host Tool Requirements}
                    style: {role: heading, emphasis: strong}
                  - component: text
                    text: {binding: jobDetails.host_tool_requirements.empty_label}
                    visible: {binding: jobDetails.host_tool_requirements.empty_label, empty: true, not: true}
                    style: {role: detail, tone: muted}
                  - component: text
                    text: {binding: jobDetails.host_tool_requirements.summary}
                    visible: {binding: jobDetails.host_tool_requirements.summary, empty: true, not: true}
                    style: {role: detail, emphasis: strong, toneBinding: jobDetails.host_tool_requirements.tone}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.host_tool_requirements.issues, as: requirementIssue, key: requirementIssue}
                    children:
                      - component: text
                        text: {template: "• {{requirementIssue}}"}
                        style: {role: detail, tone: danger}
              - component: card
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                children:
                  - component: text
                    text: {literal: Container Tool Requirements}
                    style: {role: heading, emphasis: strong}
                  - component: text
                    text: {binding: jobDetails.container_tool_requirements.empty_label}
                    visible: {binding: jobDetails.container_tool_requirements.empty_label, empty: true, not: true}
                    style: {role: detail, tone: muted}
                  - component: text
                    text: {binding: jobDetails.container_tool_requirements.summary}
                    visible: {binding: jobDetails.container_tool_requirements.summary, empty: true, not: true}
                    style: {role: detail, emphasis: strong, toneBinding: jobDetails.container_tool_requirements.tone}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.container_tool_requirements.issues, as: requirementIssue, key: requirementIssue}
                    children:
                      - component: text
                        text: {template: "• {{requirementIssue}}"}
                        style: {role: detail, tone: danger}
          - component: card
            visible: {binding: jobDetails.has_release_summary}
            layout: {direction: vertical, gap: small, padding: medium}
            children:
              - component: text
                text: {literal: Release Summary}
                style: {role: heading, emphasis: strong}
              - component: list
                layout: {direction: vertical, gap: small}
                repeat: {source: jobDetails.release_summary, as: releaseRow, key: releaseRow.label}
                children:
                  - component: row
                    layout: {direction: horizontal, gap: small, align: start}
                    children:
                      - component: text
                        text: {template: "{{releaseRow.label}}:"}
                        visible: {binding: releaseRow.label, empty: true, not: true}
                        style: {role: detail, emphasis: strong}
                      - component: text
                        text: {binding: releaseRow.value}
                        style: {role: detail, toneBinding: releaseRow.tone}
      - component: section
        visible: {binding: jobDetails.ready}
        id: execution-output
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Output / Error
            style:
              role: heading
              emphasis: strong
          - component: column
            id: execution-path
            layout:
              direction: vertical
              gap: small
            children:
              - component: text
                text:
                  literal: Execution path
                style:
                  emphasis: strong
                  tone: muted
              - component: scroller
                layout:
                  direction: horizontal
                  gap: small
                  maxHeight: "118"
                repeat:
                  source: jobDetails.timeline
                  as: item
                  key: item.id
                children:
                  - component: card
                    progress:
                      binding: item.progress
                    layout:
                      direction: vertical
                      gap: small
                      padding: small
                      minWidth: "235"
                      maxWidth: "235"
                      minHeight: "86"
                    actions:
                      - on: activate
                        command: select-timeline-item
                        arguments:
                          id: "{{item.id}}"
                    children:
                      - component: text
                        text:
                          binding: item.title
                        style:
                          emphasis: strong
                          truncate: true
                      - component: badge
                        text:
                          binding: item.status_label
                        style:
                          toneBinding: item.status
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
              wrap: true
            style:
              role: compact-toolbar
            children:
              - component: button
                text: {literal: Clean Log}
                icon: download
                actions:
                  - on: activate
                    command: download-job-log
                    arguments: {jobExecutionId: "{{jobDetails.id}}", format: clean}
              - component: button
                text: {literal: Raw Log}
                icon: download
                actions:
                  - on: activate
                    command: download-job-log
                    arguments: {jobExecutionId: "{{jobDetails.id}}", format: raw}
              - component: button
                id: job-output-tailing-toggle
                text:
                  binding: jobDetails.tailing_label
                icon: arrow-bar-to-down
                style:
                  role: tailing-toggle
                  toneBinding: jobDetails.tailing_tone
                actions:
                  - on: activate
                    command: toggle-output-tailing
              - component: button
                text:
                  literal: Copy Output
                icon: copy
                overrides:
                  compact:
                    style:
                      role: icon-button
                actions:
                  - on: activate
                    command: copy-output
              - component: input
                id: job-output-search
                layout:
                  grow: true
                  minWidth: "90"
                input:
                  value: jobDetails.output_search
                  placeholder: Search output
                actions:
                  - on: change
                    command: change-output-search
                    arguments:
                      query: "{{input.value}}"
              - component: button
                text:
                  literal: Previous
                icon: chevron-up
                style:
                  role: icon-button
                actions:
                  - on: activate
                    command: find-output
                    arguments:
                      query: "{{jobDetails.output_search}}"
                      direction: previous
              - component: button
                text:
                  literal: Next
                icon: chevron-down
                style:
                  role: icon-button
                actions:
                  - on: activate
                    command: find-output
                    arguments:
                      query: "{{jobDetails.output_search}}"
                      direction: next
              - component: text
                id: job-output-search-count
                text:
                  binding: jobDetails.output_search_count
                style:
                  tone: muted
          - component: card
            visible:
              binding: jobDetails.legacy_log_notice
              empty: true
              not: true
            style:
              tone: warning
            layout:
              padding: small
            children:
              - component: text
                text:
                  binding: jobDetails.legacy_log_notice
                style:
                  tone: warning
          - component: card
            id: job-output-system
            style:
              role: output-system
            layout:
              direction: vertical
              gap: small
              padding: small
            visible:
              binding: jobDetails.system_output
              empty: true
              not: true
            children:
              - component: text
                text:
                  literal: System messages
                style:
                  emphasis: strong
                  tone: console-accent
              - component: text
                id: job-output-system-text
                text:
                  binding: jobDetails.system_output
                style:
                  role: output-code
                  tone: console-text
          - component: card
            id: job-log-system
            style:
              role: output-system
            layout:
              direction: vertical
              gap: small
              padding: small
            visible:
              binding: jobDetails.interactive_log_available
            children:
              - component: text
                text:
                  literal: System messages
                style:
                  emphasis: strong
                  tone: console-accent
              - component: log-view
                logView:
                  jobExecutionId: jobDetails.id
          - component: scroller
            id: job-output-groups
            layout:
              direction: vertical
              gap: small
              maxHeight: "660"
            repeat:
              source: jobDetails.output_groups
              as: outputGroup
              key: outputGroup.id
            children:
              - component: disclosure
                progress:
                  binding: outputGroup.progress
                text:
                  binding: outputGroup.title
                disclosure:
                  defaultExpanded: false
                  defaultExpandedBinding: outputGroup.default_expanded
                  stateKey: "{{outputGroup.state_key}}"
                layout:
                  direction: vertical
                  gap: "0"
                  padding: section-padding
                style:
                  role: output-group
                  toneBinding: outputGroup.status
                children:
                  - component: button
                    text:
                      literal: Collapse
                    icon: arrow-up
                    style:
                      role: floating-collapse
                    actions:
                      - on: activate
                        command: set-disclosures
                        arguments:
                          prefix: "{{outputGroup.state_key}}"
                          expanded: "false"
                  - component: text
                    text: {literal: "Status: Not reached"}
                    visible: {binding: outputGroup.reached, equals: "false"}
                    style: {role: output-meta, tone: console-muted}
                  - component: text
                    text:
                      template: "Started: {{outputGroup.started}}"
                    visible:
                      binding: outputGroup.started
                      empty: true
                      not: true
                    style:
                      role: output-meta
                      tone: console-muted
                  - component: text
                    text:
                      template: "Duration: {{outputGroup.duration}}"
                    visible:
                      binding: outputGroup.duration
                      empty: true
                      not: true
                    style:
                      role: output-meta
                      tone: console-muted
                  - component: text
                    text:
                      template: "Exit code: {{outputGroup.exit_code}}"
                    visible:
                      binding: outputGroup.exit_code
                      empty: true
                      not: true
                    style: {role: output-meta, tone: console-text}
                  - component: text
                    text:
                      template: "Error: {{outputGroup.error}}"
                    visible:
                      binding: outputGroup.error
                      empty: true
                      not: true
                    style:
                      role: output-meta
                      tone: danger
                  - component: text
                    text:
                      literal: Details
                    visible:
                      binding: outputGroup.kind
                      equals: phase
                    style:
                      role: output-label
                      tone: console-accent
                  - component: text
                    text:
                      binding: outputGroup.details
                    visible:
                      binding: outputGroup.kind
                      equals: phase
                    style:
                      role: output-code
                      tone: console-text
                  - component: text
                    text:
                      literal: YAML literal
                    visible:
                      binding: outputGroup.kind
                      equals: phase
                      not: true
                    style:
                      role: output-label
                      tone: console-accent
                  - component: text
                    text:
                      binding: outputGroup.yaml_literal
                    visible:
                      binding: outputGroup.kind
                      equals: phase
                      not: true
                    style:
                      role: output-code
                      tone: console-text
                  - component: text
                    text:
                      literal: Expanded command
                    visible:
                      binding: outputGroup.kind
                      equals: phase
                      not: true
                    style:
                      role: output-label
                      tone: console-accent
                  - component: text
                    text:
                      binding: outputGroup.expanded_command
                    visible:
                      binding: outputGroup.kind
                      equals: phase
                      not: true
                    style:
                      role: output-code
                      tone: console-text
                  - component: text
                    text:
                      literal: Output
                    style:
                      role: output-label
                      tone: console-accent
                  - component: text
                    id: job-output-group-text
                    text:
                      binding: outputGroup.output
                    visible:
                      binding: outputGroup.output
                      empty: true
                      not: true
                  - component: log-view
                    visible:
                      binding: jobDetails.interactive_log_available
                    logView:
                      jobExecutionId: jobDetails.id
                      itemId: outputGroup.id
                    style:
                      role: output-code
                      tone: console-text
                  - component: text
                    text:
                      binding: outputGroup.empty_output_label
                    visible:
                      binding: outputGroup.output
                      empty: true
                    style:
                      role: output-code
                      tone: console-muted
      - component: column
        visible: {binding: jobDetails.ready}
        id: execution-reports
        layout: {direction: vertical, gap: medium, align: stretch}
        style: {role: report-stack}
        children:
          - component: card
            layout: {direction: vertical, gap: small, padding: medium}
            style: {role: report-card}
            children:
              - component: row
                layout: {direction: horizontal, gap: small, align: center}
                children:
                  - component: text
                    text: {literal: Artifacts}
                    style: {role: heading, emphasis: strong}
                  - component: spacer
                    layout: {grow: true}
                  - component: button
                    text: {literal: Download All (.zip)}
                    icon: download
                    visible: {binding: jobDetails.artifacts.can_download_all, equals: "true"}
                    actions:
                      - on: activate
                        command: download-artifact
                        arguments: {jobExecutionId: "{{jobDetails.id}}", kind: all, path: ""}
              - component: text
                text: {binding: jobDetails.artifacts.empty_label}
                visible: {binding: jobDetails.artifacts.empty_label, empty: true, not: true}
                style: {role: detail, tone: muted}
              - component: text
                text: {binding: jobDetails.artifacts.summary}
                visible: {binding: jobDetails.artifacts.summary, empty: true, not: true}
                style: {role: report-summary, emphasis: strong, toneBinding: jobDetails.artifacts.tone}
              - component: tree-view
                treeView:
                  stateKey: job-artifacts
                  nodes: jobDetails.artifacts.nodes
                  as: treeNode
                  nodeKey: treeNode.key
                  nodeLabel: {binding: treeNode.label}
                  nodeDetail: {binding: treeNode.detail}
                  nodeTone: treeNode.tone
                  children: treeNode.children
                  defaultExpanded: treeNode.default_expanded
                  actionLabel: {binding: treeNode.action_label}
                actions:
                  - on: activate
                    command: download-artifact
                    arguments: {jobExecutionId: "{{jobDetails.id}}", kind: "{{treeNode.action_kind}}", path: "{{treeNode.action_path}}"}
          - component: card
            layout: {direction: vertical, gap: small, padding: medium}
            style: {role: report-card}
            children:
              - component: text
                text: {literal: Test Report}
                style: {role: heading, emphasis: strong}
              - component: text
                text: {binding: jobDetails.test_report.empty_label}
                visible: {binding: jobDetails.test_report.empty_label, empty: true, not: true}
                style: {role: detail, tone: muted}
              - component: text
                text: {binding: jobDetails.test_report.summary}
                visible: {binding: jobDetails.test_report.summary, empty: true, not: true}
                style: {role: report-summary, emphasis: strong, toneBinding: jobDetails.test_report.tone}
              - component: select
                visible: {binding: jobDetails.test_report.summary, empty: true, not: true}
                select:
                  value: jobDetails.test_report.filter
                  options: jobDetails.test_report.filters
                  as: reportFilter
                  optionValue: reportFilter.value
                  optionLabel: reportFilter.label
                actions:
                  - on: change
                    command: set-report-filter
                    arguments: {value: "{{selection.value}}"}
              - component: tree-view
                treeView:
                  stateKey: job-tests
                  nodes: jobDetails.test_report.nodes
                  as: treeNode
                  nodeKey: treeNode.key
                  nodeLabel: {binding: treeNode.label}
                  nodeDetail: {binding: treeNode.detail}
                  nodeTone: treeNode.tone
                  nodeLink: treeNode.link
                  children: treeNode.children
                  defaultExpanded: treeNode.default_expanded
                  filter: jobDetails.test_report.filter
                  filterValues: treeNode.filter_values
          - component: card
            layout: {direction: vertical, gap: small, padding: medium}
            style: {role: report-card}
            children:
              - component: text
                text: {literal: Coverage Report}
                style: {role: heading, emphasis: strong}
              - component: text
                text: {binding: jobDetails.coverage_report.empty_label}
                visible: {binding: jobDetails.coverage_report.empty_label, empty: true, not: true}
                style: {role: detail, tone: muted}
              - component: text
                text: {binding: jobDetails.coverage_report.summary}
                visible: {binding: jobDetails.coverage_report.summary, empty: true, not: true}
                style: {role: report-summary, emphasis: strong, toneBinding: jobDetails.coverage_report.tone}
              - component: tree-view
                treeView:
                  stateKey: job-coverage
                  nodes: jobDetails.coverage_report.nodes
                  as: treeNode
                  nodeKey: treeNode.key
                  nodeLabel: {binding: treeNode.label}
                  nodeDetail: {binding: treeNode.detail}
                  nodeTone: treeNode.tone
                  children: treeNode.children
                  defaultExpanded: treeNode.default_expanded
      - component: card
        id: job-run-context
        visible: {binding: jobDetails.run_context.available}
        layout: {direction: vertical, gap: medium, padding: medium}
        children:
          - component: text
            text: {literal: Run Context}
            style: {role: heading, emphasis: strong}
          - component: text
            text: {binding: jobDetails.run_context.scope_label}
            style: {role: detail, tone: muted}
          - component: graph-view
            text: {literal: Pipelines}
            graphView:
              stateKey: "job-run-context:{{jobDetails.id}}"
              defaultMode: graph
              nodes: jobDetails.run_context.pipelines
              as: runPipeline
              nodeKey: runPipeline.pipeline_id
              nodeLabel: {binding: runPipeline.pipeline_id}
              nodeMeta: {binding: runPipeline.summary_label}
              dependencies: runPipeline.depends_on
              root:
                binding: jobDetails.run_context
                as: runRoot
                key: runRoot.current_execution_id
                label: {binding: runRoot.scope_label}
                meta: {template: "Execution {{runRoot.current_execution_id}}"}
              details:
                - component: text
                  text: {template: "Pipeline: {{runPipeline.pipeline_id}}"}
                  style: {role: heading, emphasis: strong}
                - component: graph-view
                  text: {literal: Jobs}
                  graphView:
                    stateKey: "job-run-context-jobs:{{jobDetails.id}}:{{runPipeline.pipeline_id}}"
                    defaultMode: graph
                    nodes: runPipeline.jobs
                    as: runJob
                    nodeKey: runJob.id
                    nodeLabel: {binding: runJob.id}
                    nodeMeta: {binding: runJob.summary_label}
                    dependencies: runJob.needs
                    root:
                      binding: runPipeline
                      as: runPipelineRoot
                      key: runPipelineRoot.id
                      label: {template: "Pipeline: {{runPipelineRoot.pipeline_id}}"}
                      meta: {binding: runPipelineRoot.summary_label}
                    details:
                      - component: text
                        text: {template: "Job: {{runJob.id}}"}
                        style: {role: heading, emphasis: strong}
                      - component: list
                        layout: {direction: vertical, gap: small}
                        repeat: {source: runJob.executions, as: runExecution, key: runExecution.id}
                        children:
                          - component: row
                            layout: {direction: horizontal, gap: small, align: center}
                            children:
                              - component: button
                                text: {binding: runExecution.matrix_label}
                                actions:
                                  - on: activate
                                    command: navigate
                                    arguments: {route: "/jobs/{{runExecution.id}}"}
                              - component: badge
                                text: {binding: runExecution.status}
                                style: {toneBinding: runExecution.status}
                              - component: text
                                text: {binding: runExecution.attempt_label}
                                style: {role: detail-small, tone: muted}
                  children:
                    - component: list
                      repeat: {source: runPipeline.jobs, as: runJob, key: runJob.id}
                      children:
                        - component: text
                          text: {template: "{{runJob.id}} · {{runJob.summary_label}}"}
                          style: {role: detail}
            children:
              - component: list
                repeat: {source: jobDetails.run_context.pipelines, as: runPipeline, key: runPipeline.pipeline_id}
                children:
                  - component: text
                    text: {template: "{{runPipeline.pipeline_id}} · {{runPipeline.summary_label}}"}
                    style: {role: detail}
