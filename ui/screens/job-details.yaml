apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: job-details
  title: ciwi job execution
  description: Job execution status and phase/step timeline
screen:
  dataSources:
    - name: jobDetails
      query: get-job-details
      watchTopics: [queue, history]
  root:
    component: page
    id: job-details
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        id: job-header
        layout:
          direction: horizontal
          gap: medium
          align: center
        style:
          role: hero
        children:
          - component: column
            layout:
              direction: vertical
              gap: small
              grow: true
            children:
              - component: text
                text:
                  binding: jobDetails.title
                style:
                  role: title
                  emphasis: strong
              - component: text
                text:
                  binding: jobDetails.context
                style:
                  role: subtitle
                  tone: muted
                  truncate: true
          - component: button
            text:
              literal: Back to Executions
            icon: arrow-left
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /
      - component: section
        id: execution-summary
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Execution
            style:
              role: heading
              emphasis: strong
          - component: card
            layout:
              direction: vertical
              gap: small
              padding: medium
            children:
              - component: row
                layout:
                  direction: horizontal
                  gap: small
                  align: center
                children:
                  - component: badge
                    text:
                      binding: jobDetails.status_label
                    style:
                      toneBinding: jobDetails.status
                  - component: badge
                    text:
                      binding: jobDetails.mode
                    style:
                      tone: muted
              - component: text
                text:
                  template: "Created: {{jobDetails.created}}"
                visible:
                  binding: jobDetails.created
                  equals: ""
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Started: {{jobDetails.started}}"
                visible:
                  binding: jobDetails.started
                  equals: ""
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Finished: {{jobDetails.finished}} · Duration: {{jobDetails.duration}}"
                visible:
                  binding: jobDetails.finished
                  equals: ""
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Agent: {{jobDetails.agent}}"
                visible:
                  binding: jobDetails.agent
                  equals: ""
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Current step: {{jobDetails.current_step}}"
                visible:
                  binding: jobDetails.current_step
                  equals: ""
                  not: true
              - component: text
                text:
                  template: "Exit code: {{jobDetails.exit_code}}"
                visible:
                  binding: jobDetails.exit_code
                  equals: ""
                  not: true
              - component: text
                text:
                  template: "Error: {{jobDetails.error}}"
                visible:
                  binding: jobDetails.error
                  equals: ""
                  not: true
                style:
                  tone: danger
      - component: section
        id: execution-path
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Execution path
            style:
              role: heading
              emphasis: strong
          - component: scroller
            layout:
              direction: horizontal
              gap: small
              maxHeight: "118"
            repeat:
              source: jobDetails.timeline
              as: item
              key: item.id
            children:
              - component: card
                layout:
                  direction: vertical
                  gap: small
                  padding: small
                  minWidth: "235"
                  maxWidth: "300"
                  minHeight: "86"
                actions:
                  - on: activate
                    command: select-timeline-item
                    arguments:
                      id: "{{item.id}}"
                children:
                  - component: text
                    text:
                      binding: item.title
                    style:
                      emphasis: strong
                      truncate: true
                  - component: badge
                    text:
                      binding: item.status_label
                    style:
                      toneBinding: item.status
          - component: card
            id: selected-execution-step
            layout:
              direction: vertical
              gap: small
              padding: medium
            children:
              - component: text
                text:
                  binding: jobDetails.selected_timeline_item.title
                style:
                  emphasis: strong
              - component: badge
                text:
                  binding: jobDetails.selected_timeline_item.status_label
                visible:
                  binding: jobDetails.selected_timeline_item.status_label
                  equals: ""
                  not: true
                style:
                  toneBinding: jobDetails.selected_timeline_item.status
              - component: text
                text:
                  binding: jobDetails.selected_timeline_item.description
                visible:
                  binding: jobDetails.selected_timeline_item.description
                  equals: ""
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Duration: {{jobDetails.selected_timeline_item.duration}}"
                visible:
                  binding: jobDetails.selected_timeline_item.duration
                  equals: ""
                  not: true
                style:
                  tone: muted
              - component: text
                text:
                  template: "Exit code: {{jobDetails.selected_timeline_item.exit_code}}"
                visible:
                  binding: jobDetails.selected_timeline_item.exit_code
                  equals: ""
                  not: true
              - component: text
                text:
                  template: "Error: {{jobDetails.selected_timeline_item.error}}"
                visible:
                  binding: jobDetails.selected_timeline_item.error
                  equals: ""
                  not: true
                style:
                  tone: danger
      - component: section
        id: execution-output
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Output / Error
            style:
              role: heading
              emphasis: strong
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            children:
              - component: button
                text:
                  binding: jobDetails.tailing_label
                actions:
                  - on: activate
                    command: toggle-output-tailing
              - component: button
                text:
                  literal: Copy Output
                icon: copy
                actions:
                  - on: activate
                    command: copy-output
              - component: input
                layout:
                  grow: true
                  minWidth: "180"
                input:
                  value: jobDetails.output_search
                  placeholder: Search output
                actions:
                  - on: change
                    command: change-output-search
                    arguments:
                      query: "{{input.value}}"
              - component: button
                text:
                  literal: Previous
                icon: chevron-up
                actions:
                  - on: activate
                    command: find-output
                    arguments:
                      query: "{{jobDetails.output_search}}"
                      direction: previous
              - component: button
                text:
                  literal: Next
                icon: chevron-down
                actions:
                  - on: activate
                    command: find-output
                    arguments:
                      query: "{{jobDetails.output_search}}"
                      direction: next
              - component: text
                text:
                  binding: jobDetails.output_search_count
                style:
                  tone: muted
          - component: card
            layout:
              direction: vertical
              gap: small
              maxHeight: "420"
            children:
              - component: text
                id: job-output-text
                text:
                  binding: jobDetails.output
                style:
                  role: code
              - component: text
                id: job-output-empty
                text:
                  literal: No output reported yet.
                visible:
                  binding: jobDetails.output
                  equals: ""
                style:
                  tone: muted
