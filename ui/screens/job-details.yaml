apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: job-details
  title: ciwi job execution
  description: Job execution status and phase/step timeline
screen:
  dataSources:
    - name: jobDetails
      query: get-job-details
      watchTopics: [agents, agent-eligibility, queue, history]
  root:
    component: page
    id: job-details
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        id: job-header
        progress:
          binding: jobDetails.progress
        layout:
          direction: horizontal
          gap: medium
          align: center
        style:
          role: hero
        children:
          - component: image
            image:
              binding: jobDetails.project_icon
              description: Project logo
            visible:
              binding: jobDetails.project_icon
              empty: true
              not: true
            style:
              role: job-header-icon
          - component: column
            layout:
              direction: vertical
              gap: small
              grow: true
            children:
              - component: text
                text:
                  binding: jobDetails.title
                style:
                  role: job-title
                  emphasis: strong
              - component: row
                layout: {direction: horizontal, gap: small, align: center}
                children:
                  - component: text
                    text: {literal: "Status:"}
                    style: {role: subtitle, tone: muted}
                  - component: text
                    text: {binding: jobDetails.status_label}
                    style: {role: subtitle, emphasis: strong, toneBinding: jobDetails.status}
                  - component: text
                    text: {template: "- {{jobDetails.current_step}}"}
                    visible: {binding: jobDetails.current_step, empty: true, not: true}
                    style: {role: subtitle, tone: muted, truncate: true}
          - component: button
            text:
              literal: Run Job Again
            icon: refresh
            visible:
              binding: jobDetails.can_rerun
            actions:
              - on: activate
                command: rerun-execution
                arguments:
                  jobExecutionId: "{{jobDetails.id}}"
                confirm:
                  title: Run this job again?
                  message: Creates an independent queued attempt from this stored execution. It does not interrupt, replace, or otherwise affect jobs that are already queued or running.
          - component: button
            text:
              literal: Cancel
            icon: circle-x
            visible:
              binding: jobDetails.can_cancel
            actions:
              - on: activate
                command: cancel-execution
                arguments:
                  jobExecutionId: "{{jobDetails.id}}"
                confirm:
                  title: Cancel this execution?
                  message: Marks this execution failed on the server. A process already running on an agent is not forcibly terminated and may finish in the background; other queued and running executions are unaffected.
          - component: button
            text:
              literal: Back to Job Executions
            icon: arrow-left
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /
      - component: column
        id: execution-details
        layout:
          direction: vertical
          gap: medium
        children:
          - component: row
            layout: {direction: horizontal, gap: medium, align: start, wrap: true}
            children:
              - component: card
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                children:
                  - component: text
                    text: {literal: Job Properties}
                    style: {role: heading, emphasis: strong}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.job_properties, as: detailRow, key: detailRow.label}
                    children:
                      - component: row
                        layout: {direction: horizontal, gap: small, align: start}
                        overrides:
                          compact:
                            layout: {direction: vertical, align: start}
                        children:
                          - component: text
                            text: {binding: detailRow.label}
                            layout: {minWidth: "150"}
                            style: {role: detail, tone: muted}
                          - component: text
                            text: {binding: detailRow.value}
                            layout: {grow: true}
                            style: {role: detail}
              - component: card
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                children:
                  - component: text
                    text: {literal: Cache Statistics}
                    style: {role: heading, emphasis: strong}
                  - component: text
                    text: {binding: jobDetails.cache_statistics_empty}
                    visible: {binding: jobDetails.cache_statistics_empty, empty: true, not: true}
                    style: {role: detail, tone: muted}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.cache_statistics, as: cacheRow, key: cacheRow.label}
                    children:
                      - component: card
                        layout: {direction: vertical, gap: small, padding: small}
                        children:
                          - component: text
                            text: {binding: cacheRow.label}
                            style: {role: detail, emphasis: strong}
                          - component: text
                            text: {binding: cacheRow.value}
                            style: {role: cache-statistics, toneBinding: cacheRow.tone}
          - component: row
            layout: {direction: horizontal, gap: medium, align: start, wrap: true}
            children:
              - component: card
                visible: {binding: jobDetails.scheduling_diagnosis.summary, empty: true, not: true}
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                style: {role: scheduling-awaiting}
                children:
                  - component: text
                    text: {literal: Scheduling}
                    style: {role: heading, emphasis: strong, tone: awaiting}
                  - component: text
                    text: {binding: jobDetails.scheduling_diagnosis.summary}
                    style: {role: detail, emphasis: strong, tone: awaiting}
                  - component: text
                    text: {template: "Required: {{jobDetails.scheduling_diagnosis.requirements_label}}"}
                    visible: {binding: jobDetails.scheduling_diagnosis.requirements_label, empty: true, not: true}
                    style: {role: detail, tone: awaiting}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.scheduling_diagnosis.agents, as: schedulingAgent, key: schedulingAgent.agent_id}
                    children:
                      - component: text
                        text: {template: "{{schedulingAgent.agent_id}}: {{schedulingAgent.status}} — {{schedulingAgent.details}}"}
                        style: {role: detail, tone: awaiting}
                  - component: text
                    text: {binding: jobDetails.scheduling_diagnosis.additional_agents_label}
                    visible: {binding: jobDetails.scheduling_diagnosis.additional_agents_label, empty: true, not: true}
                    style: {role: detail, tone: awaiting}
              - component: card
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                children:
                  - component: text
                    text: {literal: Host Tool Requirements}
                    style: {role: heading, emphasis: strong}
                  - component: text
                    text: {binding: jobDetails.host_tool_requirements.empty_label}
                    visible: {binding: jobDetails.host_tool_requirements.empty_label, empty: true, not: true}
                    style: {role: detail, tone: muted}
                  - component: text
                    text: {binding: jobDetails.host_tool_requirements.summary}
                    visible: {binding: jobDetails.host_tool_requirements.summary, empty: true, not: true}
                    style: {role: detail, emphasis: strong, toneBinding: jobDetails.host_tool_requirements.tone}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.host_tool_requirements.issues, as: requirementIssue, key: requirementIssue}
                    children:
                      - component: text
                        text: {template: "• {{requirementIssue}}"}
                        style: {role: detail, tone: danger}
              - component: card
                layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
                children:
                  - component: text
                    text: {literal: Container Tool Requirements}
                    style: {role: heading, emphasis: strong}
                  - component: text
                    text: {binding: jobDetails.container_tool_requirements.empty_label}
                    visible: {binding: jobDetails.container_tool_requirements.empty_label, empty: true, not: true}
                    style: {role: detail, tone: muted}
                  - component: text
                    text: {binding: jobDetails.container_tool_requirements.summary}
                    visible: {binding: jobDetails.container_tool_requirements.summary, empty: true, not: true}
                    style: {role: detail, emphasis: strong, toneBinding: jobDetails.container_tool_requirements.tone}
                  - component: list
                    layout: {direction: vertical, gap: small}
                    repeat: {source: jobDetails.container_tool_requirements.issues, as: requirementIssue, key: requirementIssue}
                    children:
                      - component: text
                        text: {template: "• {{requirementIssue}}"}
                        style: {role: detail, tone: danger}
          - component: card
            visible: {binding: jobDetails.has_release_summary}
            layout: {direction: vertical, gap: small, padding: medium}
            children:
              - component: text
                text: {literal: Release Summary}
                style: {role: heading, emphasis: strong}
              - component: list
                layout: {direction: vertical, gap: small}
                repeat: {source: jobDetails.release_summary, as: releaseRow, key: releaseRow.label}
                children:
                  - component: row
                    layout: {direction: horizontal, gap: small, align: start}
                    children:
                      - component: text
                        text: {template: "{{releaseRow.label}}:"}
                        visible: {binding: releaseRow.label, empty: true, not: true}
                        style: {role: detail, emphasis: strong}
                      - component: text
                        text: {binding: releaseRow.value}
                        style: {role: detail, toneBinding: releaseRow.tone}
          - component: card
            visible: {binding: jobDetails.run_context.available}
            layout: {direction: vertical, gap: medium, padding: medium}
            children:
              - component: text
                text: {literal: Run Context}
                style: {role: heading, emphasis: strong}
              - component: text
                text: {binding: jobDetails.run_context.scope_label}
                style: {role: detail, tone: muted}
              - component: graph-view
                text: {literal: Pipelines}
                graphView:
                  stateKey: "job-run-context:{{jobDetails.id}}"
                  defaultMode: graph
                  nodes: jobDetails.run_context.pipelines
                  as: runPipeline
                  nodeKey: runPipeline.pipeline_id
                  nodeLabel: {binding: runPipeline.pipeline_id}
                  nodeMeta: {binding: runPipeline.summary_label}
                  dependencies: runPipeline.depends_on
                  details:
                    - component: text
                      text: {template: "Pipeline: {{runPipeline.pipeline_id}}"}
                      style: {role: heading, emphasis: strong}
                    - component: graph-view
                      text: {literal: Jobs}
                      graphView:
                        stateKey: "job-run-context-jobs:{{jobDetails.id}}:{{runPipeline.pipeline_id}}"
                        defaultMode: graph
                        nodes: runPipeline.jobs
                        as: runJob
                        nodeKey: runJob.id
                        nodeLabel: {binding: runJob.id}
                        nodeMeta: {binding: runJob.summary_label}
                        dependencies: runJob.needs
                        details:
                          - component: text
                            text: {template: "Job: {{runJob.id}}"}
                            style: {role: heading, emphasis: strong}
                          - component: list
                            layout: {direction: vertical, gap: small}
                            repeat: {source: runJob.executions, as: runExecution, key: runExecution.id}
                            children:
                              - component: row
                                layout: {direction: horizontal, gap: small, align: center}
                                children:
                                  - component: button
                                    text: {binding: runExecution.matrix_label}
                                    actions:
                                      - on: activate
                                        command: navigate
                                        arguments: {route: "/jobs/{{runExecution.id}}"}
                                  - component: badge
                                    text: {binding: runExecution.status}
                                    style: {toneBinding: runExecution.status}
                                  - component: text
                                    text: {binding: runExecution.attempt_label}
                                    style: {role: detail-small, tone: muted}
                      children:
                        - component: list
                          repeat: {source: runPipeline.jobs, as: runJob, key: runJob.id}
                          children:
                            - component: text
                              text: {template: "{{runJob.id}} · {{runJob.summary_label}}"}
                              style: {role: detail}
                children:
                  - component: list
                    repeat: {source: jobDetails.run_context.pipelines, as: runPipeline, key: runPipeline.pipeline_id}
                    children:
                      - component: text
                        text: {template: "{{runPipeline.pipeline_id}} · {{runPipeline.summary_label}}"}
                        style: {role: detail}
      - component: section
        id: execution-output
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Output / Error
            style:
              role: heading
              emphasis: strong
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            style:
              role: compact-toolbar
            children:
              - component: button
                text:
                  binding: jobDetails.tailing_label
                icon: arrow-bar-to-down
                style:
                  role: tailing-toggle
                  toneBinding: jobDetails.tailing_tone
                actions:
                  - on: activate
                    command: toggle-output-tailing
              - component: button
                text:
                  literal: Copy Output
                icon: copy
                overrides:
                  compact:
                    style:
                      role: icon-button
                actions:
                  - on: activate
                    command: copy-output
              - component: input
                layout:
                  grow: true
                  minWidth: "90"
                input:
                  value: jobDetails.output_search
                  placeholder: Search output
                actions:
                  - on: change
                    command: change-output-search
                    arguments:
                      query: "{{input.value}}"
              - component: button
                text:
                  literal: Previous
                icon: chevron-up
                style:
                  role: icon-button
                actions:
                  - on: activate
                    command: find-output
                    arguments:
                      query: "{{jobDetails.output_search}}"
                      direction: previous
              - component: button
                text:
                  literal: Next
                icon: chevron-down
                style:
                  role: icon-button
                actions:
                  - on: activate
                    command: find-output
                    arguments:
                      query: "{{jobDetails.output_search}}"
                      direction: next
              - component: text
                text:
                  binding: jobDetails.output_search_count
                style:
                  tone: muted
          - component: column
            id: execution-path
            layout:
              direction: vertical
              gap: small
            children:
              - component: text
                text:
                  literal: Execution path
                style:
                  emphasis: strong
                  tone: muted
              - component: scroller
                layout:
                  direction: horizontal
                  gap: small
                  maxHeight: "118"
                repeat:
                  source: jobDetails.timeline
                  as: item
                  key: item.id
                children:
                  - component: card
                    progress:
                      binding: item.progress
                    layout:
                      direction: vertical
                      gap: small
                      padding: small
                      minWidth: "235"
                      maxWidth: "300"
                      minHeight: "86"
                    actions:
                      - on: activate
                        command: select-timeline-item
                        arguments:
                          id: "{{item.id}}"
                    children:
                      - component: text
                        text:
                          binding: item.title
                        style:
                          emphasis: strong
                          truncate: true
                      - component: badge
                        text:
                          binding: item.status_label
                        style:
                          toneBinding: item.status
          - component: card
            id: job-output-system
            style:
              role: output-system
            layout:
              direction: vertical
              gap: small
              padding: small
            visible:
              binding: jobDetails.system_output
              empty: true
              not: true
            children:
              - component: text
                text:
                  literal: System messages
                style:
                  emphasis: strong
                  tone: console-accent
              - component: text
                id: job-output-system-text
                text:
                  binding: jobDetails.system_output
                style:
                  role: output-code
                  tone: console-text
          - component: scroller
            id: job-output-groups
            layout:
              direction: vertical
              gap: small
              maxHeight: "720"
            repeat:
              source: jobDetails.output_groups
              as: outputGroup
              key: outputGroup.id
            children:
              - component: disclosure
                progress:
                  binding: outputGroup.progress
                text:
                  binding: outputGroup.title
                disclosure:
                  defaultExpanded: false
                  stateKey: "{{outputGroup.state_key}}"
                layout:
                  direction: vertical
                  gap: "0"
                  padding: section-padding
                style:
                  role: output-group
                  toneBinding: outputGroup.status
                children:
                  - component: text
                    text: {literal: "Status: Not reached"}
                    visible: {binding: outputGroup.reached, equals: "false"}
                    style: {role: output-meta, tone: console-muted}
                  - component: text
                    text:
                      template: "Started: {{outputGroup.started}}"
                    visible:
                      binding: outputGroup.started
                      empty: true
                      not: true
                    style:
                      role: output-meta
                      tone: console-muted
                  - component: text
                    text:
                      template: "Duration: {{outputGroup.duration}}"
                    visible:
                      binding: outputGroup.duration
                      empty: true
                      not: true
                    style:
                      role: output-meta
                      tone: console-muted
                  - component: text
                    text:
                      template: "Exit code: {{outputGroup.exit_code}}"
                    visible:
                      binding: outputGroup.exit_code
                      empty: true
                      not: true
                    style: {role: output-meta, tone: console-text}
                  - component: text
                    text:
                      template: "Error: {{outputGroup.error}}"
                    visible:
                      binding: outputGroup.error
                      empty: true
                      not: true
                    style:
                      role: output-meta
                      tone: danger
                  - component: text
                    text:
                      literal: Details
                    visible:
                      binding: outputGroup.is_phase
                    style:
                      role: output-label
                      tone: console-accent
                  - component: text
                    text:
                      binding: outputGroup.details
                    visible:
                      binding: outputGroup.is_phase
                    style:
                      role: output-code
                      tone: console-text
                  - component: text
                    text:
                      literal: YAML literal
                    visible:
                      binding: outputGroup.is_step
                    style:
                      role: output-label
                      tone: console-accent
                  - component: text
                    text:
                      binding: outputGroup.yaml_literal
                    visible:
                      binding: outputGroup.is_step
                    style:
                      role: output-code
                      tone: console-text
                  - component: text
                    text:
                      literal: Expanded command
                    visible:
                      binding: outputGroup.is_step
                    style:
                      role: output-label
                      tone: console-accent
                  - component: text
                    text:
                      binding: outputGroup.expanded_command
                    visible:
                      binding: outputGroup.is_step
                    style:
                      role: output-code
                      tone: console-text
                  - component: text
                    text:
                      literal: Output
                    style:
                      role: output-label
                      tone: console-accent
                  - component: text
                    id: job-output-group-text
                    text:
                      binding: outputGroup.output
                    visible:
                      binding: outputGroup.output
                      empty: true
                      not: true
                    style:
                      role: output-code
                      tone: console-text
                  - component: text
                    text:
                      binding: outputGroup.empty_output_label
                    visible:
                      binding: outputGroup.output
                      empty: true
                    style:
                      role: output-code
                      tone: console-muted
                  - component: button
                    text:
                      literal: Collapse
                    icon: arrow-up
                    style:
                      role: floating-collapse
                    overrides:
                      gio:
                        hidden: true
                    actions:
                      - on: activate
                        command: set-disclosures
                        arguments:
                          prefix: "{{outputGroup.state_key}}"
                          expanded: "false"
      - component: row
        id: execution-reports
        layout: {direction: horizontal, gap: medium, align: start, wrap: true}
        children:
          - component: card
            layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
            children:
              - component: text
                text: {literal: Artifacts}
                style: {role: heading, emphasis: strong}
              - component: text
                text: {binding: jobDetails.artifacts.empty_label}
                visible: {binding: jobDetails.artifacts.empty_label, empty: true, not: true}
                style: {role: detail, tone: muted}
              - component: text
                text: {binding: jobDetails.artifacts.summary}
                visible: {binding: jobDetails.artifacts.summary, empty: true, not: true}
                style: {role: detail, emphasis: strong, toneBinding: jobDetails.artifacts.tone}
              - component: list
                layout: {direction: vertical, gap: small}
                repeat: {source: jobDetails.artifacts.rows, as: reportRow, key: reportRow.label}
                children:
                  - component: column
                    layout: {direction: vertical, gap: small}
                    children:
                      - component: text
                        text: {binding: reportRow.label}
                        style: {role: detail, emphasis: strong}
                      - component: text
                        text: {binding: reportRow.value}
                        style: {role: detail-small, toneBinding: reportRow.tone}
              - component: text
                text: {binding: jobDetails.artifacts.additional_label}
                visible: {binding: jobDetails.artifacts.additional_label, empty: true, not: true}
                style: {role: detail, tone: muted}
          - component: card
            layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
            children:
              - component: text
                text: {literal: Test Report}
                style: {role: heading, emphasis: strong}
              - component: text
                text: {binding: jobDetails.test_report.empty_label}
                visible: {binding: jobDetails.test_report.empty_label, empty: true, not: true}
                style: {role: detail, tone: muted}
              - component: text
                text: {binding: jobDetails.test_report.summary}
                visible: {binding: jobDetails.test_report.summary, empty: true, not: true}
                style: {role: detail, emphasis: strong, toneBinding: jobDetails.test_report.tone}
              - component: list
                layout: {direction: vertical, gap: small}
                repeat: {source: jobDetails.test_report.rows, as: reportRow, key: reportRow.label}
                children:
                  - component: column
                    layout: {direction: vertical, gap: small}
                    children:
                      - component: text
                        text: {binding: reportRow.label}
                        style: {role: detail, emphasis: strong}
                      - component: text
                        text: {binding: reportRow.value}
                        style: {role: detail-small, toneBinding: reportRow.tone}
              - component: text
                text: {binding: jobDetails.test_report.additional_label}
                visible: {binding: jobDetails.test_report.additional_label, empty: true, not: true}
                style: {role: detail, tone: muted}
          - component: card
            layout: {direction: vertical, gap: small, padding: medium, grow: true, minWidth: "320"}
            children:
              - component: text
                text: {literal: Coverage Report}
                style: {role: heading, emphasis: strong}
              - component: text
                text: {binding: jobDetails.coverage_report.empty_label}
                visible: {binding: jobDetails.coverage_report.empty_label, empty: true, not: true}
                style: {role: detail, tone: muted}
              - component: text
                text: {binding: jobDetails.coverage_report.summary}
                visible: {binding: jobDetails.coverage_report.summary, empty: true, not: true}
                style: {role: detail, emphasis: strong, toneBinding: jobDetails.coverage_report.tone}
              - component: list
                layout: {direction: vertical, gap: small}
                repeat: {source: jobDetails.coverage_report.rows, as: reportRow, key: reportRow.label}
                children:
                  - component: column
                    layout: {direction: vertical, gap: small}
                    children:
                      - component: text
                        text: {binding: reportRow.label}
                        style: {role: detail, emphasis: strong}
                      - component: text
                        text: {binding: reportRow.value}
                        style: {role: detail-small, toneBinding: reportRow.tone}
              - component: text
                text: {binding: jobDetails.coverage_report.additional_label}
                visible: {binding: jobDetails.coverage_report.additional_label, empty: true, not: true}
                style: {role: detail, tone: muted}
