apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: settings
  title: ciwi global settings
  description: Native client appearance and connection settings
screen:
  dataSources:
    - name: settings
      query: get-settings-view
      watchTopics: [server, projects, updates]
    - name: client
      query: get-native-client-state
  persistence:
    - name: selectedTheme
      storageKey: ciwi.ui.theme.v1
      defaultValue: default
      scope: client
  root:
    component: page
    id: settings
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        id: settings-header
        layout:
          direction: horizontal
          gap: large
          align: center
        style:
          role: hero
        children:
          - component: image
            image:
              asset: ciwi-logo
              description: ciwi CI/CD server
          - component: column
            layout:
              direction: vertical
              gap: small
              grow: true
            children:
              - component: text
                text:
                  literal: ciwi global settings
                style:
                  role: title
                  emphasis: strong
              - component: row
                layout:
                  direction: horizontal
                  gap: small
                  align: center
                  wrap: true
                children:
                  - component: badge
                    text:
                      binding: settings.server_version
                    style:
                      tone: muted
                      emphasis: strong
          - component: button
            text:
              literal: Back to Main
            icon: arrow-left
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /
          - component: button
            text:
              literal: Agents
            icon: server
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /agents
          - component: button
            text: {literal: Vault}
            icon: lock
            actions: [{on: activate, command: navigate, arguments: {route: /vault}}]
          - component: button
            text:
              literal: Restart Server
            icon: refresh
            enabled:
              binding: client.connected
            actions:
              - on: activate
                command: server-update-action
                arguments: {action: restart, targetVersion: ""}
                confirm:
                  title: Restart Server
                  message: Restart ciwi server now? The native client will reconnect automatically.
      - component: section
        id: appearance
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Appearance
            style:
              role: heading
              emphasis: strong
          - component: text
            text:
              literal: Choose the color theme for ciwi in this native client.
            style:
              tone: muted
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
              wrap: true
            children:
              - component: text
                text:
                  literal: Theme
                style:
                  emphasis: strong
              - component: select
                layout:
                  minWidth: "220"
                select:
                  value: settings.selected_theme
                  options: settings.themes
                  as: themeOption
                  optionValue: themeOption.name
                  optionLabel: themeOption.title
                actions:
                  - on: change
                    command: change-theme
                    arguments:
                      theme: "{{selection.value}}"
              - component: text
                text:
                  binding: settings.selected_theme_description
                style:
                  tone: muted
      - component: section
        id: native-connection
        overrides:
          web: {hidden: true}
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Native Connection
            style:
              role: heading
              emphasis: strong
          - component: card
            layout:
              direction: vertical
              gap: medium
              padding: medium
            children:
              - component: text
                text:
                  literal: Choose how this native client locates its ciwi server.
              - component: text
                text:
                  binding: client.status
                style:
                  toneBinding: client.tone
              - component: select
                select:
                  value: settings.connection_mode
                  options: settings.connection_modes
                  as: modeOption
                  optionValue: modeOption.value
                  optionLabel: modeOption.label
                actions:
                  - on: change
                    command: set-connection-field
                    arguments: {field: mode, value: "{{selection.value}}"}
              - component: input
                visible:
                  binding: settings.connection_explicit
                input:
                  value: settings.connection_endpoint
                  placeholder: tcp://127.0.0.1:8113
                actions:
                  - on: change
                    command: set-connection-field
                    arguments: {field: endpoint, value: "{{input.value}}"}
              - component: text
                visible:
                  binding: settings.connection_explicit
                text:
                  literal: Use tcp:// or quic:// for a directly reachable native endpoint.
                style:
                  tone: muted
              - component: column
                visible:
                  binding: settings.ssh
                layout:
                  direction: vertical
                  gap: medium
                children:
                  - component: text
                    text:
                      literal: Ciwi can reach a private server through an SSH jump host without opening a localhost listener. The SSH stream carries the normal encrypted CNP connection.
                    style:
                      tone: muted
                  - component: input
                    input:
                      value: settings.ssh_jump_address
                      placeholder: 192.0.2.1:22
                    actions:
                      - on: change
                        command: set-connection-field
                        arguments: {field: ssh-jump-address, value: "{{input.value}}"}
                  - component: input
                    input:
                      value: settings.ssh_username
                      placeholder: SSH username
                    actions:
                      - on: change
                        command: set-connection-field
                        arguments: {field: ssh-username, value: "{{input.value}}"}
                  - component: input
                    input:
                      value: settings.ssh_destination
                      placeholder: 10.77.77.2:8113
                    actions:
                      - on: change
                        command: set-connection-field
                        arguments: {field: ssh-destination, value: "{{input.value}}"}
                  - component: text
                    text:
                      literal: Device SSH identity
                    style:
                      emphasis: strong
                  - component: row
                    layout:
                      direction: horizontal
                      gap: small
                      wrap: true
                    children:
                      - component: button
                        text:
                          literal: Generate Device Key
                        actions:
                          - on: activate
                            command: generate-ssh-device-key
                            confirm:
                              title: Generate SSH Device Key
                              message: Generate a new device-specific SSH identity? If a key already exists, replace its restricted public key on the jump host after continuing.
                      - component: button
                        visible:
                          binding: settings.ssh_has_key
                        text:
                          literal: Copy Restricted Public Key
                        icon: copy
                        actions:
                          - on: activate
                            command: copy-text
                            arguments:
                              text: "{{settings.ssh_authorized_key}}"
                  - component: text
                    visible:
                      binding: settings.ssh_has_key
                    text:
                      binding: settings.ssh_authorized_key
                    style:
                      role: code-inline
                      tone: muted
                  - component: text
                    visible:
                      binding: settings.ssh_has_key
                    text:
                      literal: Add this restricted line to the SSH user's ~/.ssh/authorized_keys on the jump host. The private key remains in this device's secure store.
                    style:
                      tone: muted
                  - component: text
                    visible:
                      binding: settings.ssh_has_pending_fingerprint
                    text:
                      literal: Untrusted SSH host key
                    style:
                      tone: warning
                      emphasis: strong
                  - component: text
                    visible:
                      binding: settings.ssh_has_pending_fingerprint
                    text:
                      binding: settings.ssh_pending_fingerprint
                    style:
                      role: code-inline
                      tone: warning
                      emphasis: strong
                  - component: row
                    visible:
                      binding: settings.ssh_has_pending_fingerprint
                    layout:
                      direction: horizontal
                      gap: small
                      wrap: true
                    children:
                      - component: button
                        text:
                          literal: Trust This Host Key
                        actions:
                          - on: activate
                            command: trust-ssh-host-key
                            confirm:
                              title: Trust SSH Host Key
                              message: Trust this SSH host key only after verifying its fingerprint through an independent trusted channel.
                      - component: button
                        text:
                          literal: Reject Host Key
                        actions:
                          - on: activate
                            command: reject-ssh-host-key
                  - component: text
                    visible:
                      binding: settings.ssh_has_trusted_fingerprint
                    text:
                      literal: Trusted SSH host key
                    style:
                      tone: muted
                  - component: text
                    visible:
                      binding: settings.ssh_has_trusted_fingerprint
                    text:
                      binding: settings.ssh_host_fingerprint
                    style:
                      role: code-inline
                      tone: muted
              - component: button
                text:
                  literal: Save and Reconnect
                actions:
                  - on: activate
                    command: save-connection
                    arguments:
                      mode: "{{settings.connection_mode}}"
                      endpoint: "{{settings.connection_endpoint}}"
      - component: section
        id: projects
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Projects
            style:
              role: heading
              emphasis: strong
          - component: text
            text:
              literal: Import a definition from a repository or store and edit a self-contained YAML definition directly in ciwi.
            style:
              tone: muted
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
              wrap: true
            children:
              - component: input
                layout:
                  grow: true
                  minWidth: "280"
                input:
                  value: settings.import_repo_url
                  placeholder: https://github.com/you/project.git
                actions:
                  - on: change
                    command: set-project-import-field
                    arguments: {field: repoUrl, value: "{{input.value}}"}
              - component: input
                layout:
                  minWidth: "160"
                input:
                  value: settings.import_repo_ref
                  placeholder: "ref (optional: main, tag, sha)"
                actions:
                  - on: change
                    command: set-project-import-field
                    arguments: {field: repoRef, value: "{{input.value}}"}
              - component: input
                layout:
                  minWidth: "180"
                input:
                  value: settings.import_config_file
                  placeholder: ciwi-project.yaml
                actions:
                  - on: change
                    command: set-project-import-field
                    arguments: {field: configFile, value: "{{input.value}}"}
              - component: button
                text:
                  literal: Add Repository Project
                actions:
                  - on: activate
                    command: import-project
                    arguments:
                      repoUrl: "{{settings.import_repo_url}}"
                      repoRef: "{{settings.import_repo_ref}}"
                      configFile: "{{settings.import_config_file}}"
              - component: button
                text:
                  literal: Add Managed YAML
                actions:
                  - on: activate
                    command: navigate
                    arguments: {route: /managed-yaml/new}
          - component: list
            layout:
              direction: vertical
              gap: small
            repeat:
              source: settings.projects
              as: project
              key: project.id
            children:
              - component: row
                layout:
                  direction: horizontal
                  gap: small
                  align: center
                  wrap: true
                style:
                  role: settings-project-row
                children:
                  - component: column
                    layout:
                      direction: vertical
                      gap: small
                      grow: true
                    children:
                      - component: row
                        layout: {direction: horizontal, gap: small, align: center, wrap: true}
                        children:
                          - component: text
                            text: {literal: "Project:"}
                            style: {emphasis: strong}
                          - component: text
                            text: {binding: project.name}
                            style: {emphasis: strong, tone: accent}
                            actions:
                              - on: activate
                                command: navigate
                                arguments: {route: "/projects/{{project.id}}"}
                          - component: badge
                            visible: {binding: project.is_managed}
                            text: {literal: Managed YAML}
                            style: {tone: muted}
                          - component: badge
                            visible: {binding: project.has_repo}
                            text: {binding: project.repo_url}
                            style: {tone: muted}
                          - component: badge
                            visible: {binding: project.has_repo}
                            text: {template: "branch:{{project.repo_ref_label}}"}
                            style: {tone: muted}
                          - component: badge
                            visible: {binding: project.has_repo}
                            text: {binding: project.config_file}
                            style: {tone: muted}
                      - component: text
                        visible: {binding: project.is_managed}
                        text:
                          template: "Stored in ciwi database | Last update time: {{project.updated_label}}"
                        style: {tone: muted}
                      - component: row
                        visible:
                          binding: project.has_loaded_commit
                        layout:
                          direction: horizontal
                          gap: small
                          align: center
                          wrap: true
                        children:
                          - component: text
                            text:
                              literal: "Loaded commit:"
                            style:
                              tone: muted
                          - component: text
                            text:
                              binding: project.loaded_commit_short
                            style:
                              role: code-inline
                              tone: accent
                            actions:
                              - on: activate
                                command: open-url
                                arguments: {url: "{{project.loaded_commit_url}}"}
                          - component: text
                            text:
                              template: "| Last update time: {{project.updated_label}}"
                            style:
                              tone: muted
                  - component: button
                    text:
                      literal: Reload project definition from VCS
                    visible:
                      binding: project.can_reload
                    actions:
                      - on: activate
                        command: project-action
                        arguments: {projectId: "{{project.id}}", action: reload}
                  - component: button
                    text: {literal: Edit YAML}
                    visible: {binding: project.is_managed}
                    actions:
                      - on: activate
                        command: navigate
                        arguments: {route: "/managed-yaml/{{project.id}}"}
                  - component: button
                    text:
                      literal: Delete Project
                    actions:
                      - on: activate
                        command: project-action
                        arguments: {projectId: "{{project.id}}", action: delete}
                        confirm:
                          title: Delete project?
                          message: Removes this project and its pipelines and chains from ciwi. Existing job execution history remains available.
                  - component: text
                    text:
                      binding: project.action_status
                    visible:
                      binding: project.action_status
                      empty: true
                      not: true
                    style:
                      toneBinding: project.action_tone
      - component: row
        id: server-version-management
        layout:
          direction: horizontal
          gap: large
          align: start
          wrap: true
        children:
          - component: section
            id: server-updates
            layout:
              direction: vertical
              gap: medium
              grow: true
              minWidth: "420"
            children:
              - component: text
                text:
                  literal: Server Updates
                style:
                  role: heading
                  emphasis: strong
              - component: card
                layout:
                  direction: vertical
                  gap: medium
                  padding: medium
                children:
                  - component: row
                    layout:
                      direction: horizontal
                      gap: small
                      align: center
                      wrap: true
                    children:
                      - component: button
                        text:
                          literal: Check for updates
                        enabled:
                          binding: settings.update_supported
                        actions:
                          - on: activate
                            command: check-server-updates
                      - component: select
                        layout:
                          grow: true
                          minWidth: "210"
                        enabled:
                          binding: settings.update_supported
                        select:
                          value: settings.selected_update_version
                          options: settings.update_versions
                          as: versionOption
                          optionValue: versionOption.value
                          optionLabel: versionOption.label
                        actions:
                          - on: change
                            command: set-server-update-option
                            arguments: {field: update, value: "{{selection.value}}"}
                      - component: button
                        text:
                          literal: Update now
                        enabled:
                          binding: settings.selected_update_version
                          empty: true
                          not: true
                        actions:
                          - on: activate
                            command: server-update-action
                            arguments: {action: apply, targetVersion: "{{settings.selected_update_version}}"}
                            confirm:
                              title: Apply Update
                              message: "Update server and agents to {{settings.selected_update_version}} and restart ciwi?"
                  - component: text
                    text:
                      binding: settings.update_result
                    visible:
                      binding: settings.update_result
                      empty: true
                      not: true
                    style:
                      toneBinding: settings.update_result_tone
                  - component: text
                    text:
                      binding: settings.update_capability_notice
                    visible:
                      binding: settings.update_capability_notice
                      empty: true
                      not: true
                    style:
                      tone: muted
                  - component: text
                    text:
                      literal: Agents update after the server update, once their queued or running jobs finish.
                    style:
                      tone: muted
                  - component: text
                    text:
                      binding: settings.update_status_label
                    visible:
                      binding: settings.update_status_label
                      empty: true
                      not: true
                    style:
                      tone: muted
                  - component: text
                    text:
                      binding: settings.blocked_agent_notice
                    visible:
                      binding: settings.blocked_agent_notice
                      empty: true
                      not: true
                    style:
                      tone: warning
          - component: section
            id: rollback
            layout:
              direction: vertical
              gap: medium
              grow: true
              minWidth: "420"
            children:
              - component: text
                text:
                  literal: Rollback
                style:
                  role: heading
                  emphasis: strong
              - component: card
                layout:
                  direction: vertical
                  gap: medium
                  padding: medium
                children:
                  - component: row
                    layout:
                      direction: horizontal
                      gap: small
                      align: center
                      wrap: true
                    children:
                      - component: select
                        layout:
                          grow: true
                          minWidth: "210"
                        enabled:
                          binding: settings.update_supported
                        select:
                          value: settings.selected_rollback_version
                          options: settings.rollback_versions
                          as: versionOption
                          optionValue: versionOption.value
                          optionLabel: versionOption.label
                        actions:
                          - on: change
                            command: set-server-update-option
                            arguments: {field: rollback, value: "{{selection.value}}"}
                      - component: button
                        text:
                          literal: Refresh versions
                        enabled:
                          binding: settings.update_supported
                        actions:
                          - on: activate
                            command: refresh-rollback-versions
                      - component: button
                        text:
                          literal: Rollback
                        enabled:
                          binding: settings.selected_rollback_version
                          empty: true
                          not: true
                        actions:
                          - on: activate
                            command: server-update-action
                            arguments: {action: rollback, targetVersion: "{{settings.selected_rollback_version}}"}
                            confirm:
                              title: Rollback
                              message: "Rollback server and agents to {{settings.selected_rollback_version}}?"
                  - component: text
                    text:
                      binding: settings.rollback_result
                    visible:
                      binding: settings.rollback_result
                      empty: true
                      not: true
                    style:
                      toneBinding: settings.rollback_result_tone
                  - component: text
                    text:
                      binding: settings.update_capability_notice
                    visible:
                      binding: settings.update_capability_notice
                      empty: true
                      not: true
                    style:
                      tone: muted
                  - component: text
                    text:
                      literal: Shows only versions lower than the current server version.
                    style:
                      tone: muted
      - component: section
        id: connection
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Connection
            style:
              role: heading
              emphasis: strong
          - component: card
            layout:
              direction: vertical
              gap: small
              padding: medium
            children:
              - component: text
                text:
                  template: "Server: {{settings.server.name}} {{settings.server.version}}"
                style:
                  emphasis: strong
              - component: text
                text:
                  template: "Host: {{settings.server.hostname}}"
                style:
                  tone: muted
              - component: text
                text:
                  template: "Native protocol API: v{{settings.server.api_version}}"
                style:
                  tone: muted
