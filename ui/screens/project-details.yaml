apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: project-details
  title: ciwi project
  description: Project pipelines, jobs and configured steps
screen:
  dataSources:
    - name: projectDetails
      query: get-project-details
      watchTopics: [projects, queue, history]
  root:
    component: page
    id: project-details
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        id: project-header
        layout:
          direction: horizontal
          gap: medium
          align: center
        style:
          role: hero
        overrides:
          compact:
            layout:
              direction: vertical
              align: start
        children:
          - component: image
            image:
              binding: projectDetails.project_icon
              description: Project logo
            visible:
              binding: projectDetails.project_icon
              empty: true
              not: true
            style:
              role: project-icon
          - component: column
            layout:
              direction: vertical
              gap: small
              grow: true
            children:
              - component: text
                text:
                  binding: projectDetails.project.name
                style:
                  role: title
                  emphasis: strong
              - component: row
                layout:
                  direction: horizontal
                  gap: small
                  align: center
                overrides:
                  compact:
                    layout:
                      direction: vertical
                      align: start
                children:
                  - component: badge
                    text:
                      binding: projectDetails.project.repo_url
                    visible:
                      binding: projectDetails.project.repo_url
                      empty: true
                      not: true
                    style:
                      tone: muted
                  - component: badge
                    text:
                      template: "branch:{{projectDetails.project.repo_ref}}"
                    visible:
                      binding: projectDetails.project.repo_ref
                      empty: true
                      not: true
                    style:
                      tone: muted
                  - component: badge
                    text:
                      binding: projectDetails.project.config_file
                    visible:
                      binding: projectDetails.project.config_file
                      empty: true
                      not: true
                    style:
                      tone: muted
          - component: button
            text:
              literal: Back to Projects
            icon: arrow-left
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /
      - component: row
        id: project-structure-filter
        overrides:
          web:
            hidden: true
        layout:
          direction: horizontal
          gap: small
          align: center
        children:
          - component: text
            text:
              literal: "Show:"
            style:
              tone: muted
          - component: select
            layout:
              minWidth: "220"
            select:
              value: projectDetails.structure_filter
              options: projectDetails.structure_filters
              as: structureOption
              optionValue: structureOption.value
              optionLabel: structureOption.label
            actions:
              - on: change
                command: set-project-structure-filter
                arguments:
                  value: "{{selection.value}}"
      - component: graph-view
        id: project-structure
        text:
          literal: Structure
        graphView:
          stateKey: "project-structure:{{projectDetails.project.id}}"
          defaultMode: graph
          nodes: projectDetails.visible_pipelines
          as: pipeline
          nodeKey: pipeline.pipeline_id
          nodeLabel:
            binding: pipeline.pipeline_id
          nodeMeta:
            binding: pipeline.graph_summary_label
          dependencies: pipeline.depends_on
          details:
            - component: row
              layout:
                direction: horizontal
                gap: medium
                align: center
              children:
                - component: column
                  layout:
                    direction: vertical
                    gap: small
                    grow: true
                  children:
                    - component: text
                      text:
                        template: "Pipeline: {{pipeline.pipeline_id}}"
                      style:
                        role: heading
                        emphasis: strong
                    - component: text
                      text:
                        binding: pipeline.summary_label
                      style:
                        tone: muted
                - component: button
                  text:
                    literal: Options
                  icon: adjustments
                  actions:
                    - on: activate
                      command: navigate
                      arguments:
                        route: /run-options/projects/{{projectDetails.project.id}}/pipelines/{{pipeline.id}}
                - component: button
                  text:
                    literal: Run
                  icon: player-play
                  actions:
                    - on: activate
                      command: run-pipeline
                      arguments:
                        pipelineDbId: "{{pipeline.id}}"
                      confirm:
                        title: Run pipeline
                        message: This adds a new execution without interrupting jobs that are already queued or running.
                - component: button
                  text:
                    literal: Dry Run
                  icon: player-play
                  visible:
                    binding: pipeline.supports_dry_run
                  actions:
                    - on: activate
                      command: run-pipeline
                      arguments:
                        pipelineDbId: "{{pipeline.id}}"
                        dryRun: "true"
                      confirm:
                        title: Dry-run pipeline
                        message: Queues a dry-run execution of this pipeline. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
            - component: graph-view
              id: selected-pipeline-jobs
              text:
                literal: Jobs
              graphView:
                stateKey: "project-jobs:{{projectDetails.project.id}}:{{pipeline.id}}"
                defaultMode: graph
                nodes: pipeline.jobs
                as: job
                nodeKey: job.id
                nodeLabel:
                  binding: job.id
                nodeMeta:
                  binding: job.summary_label
                dependencies: job.needs
                details:
                  - component: row
                    layout:
                      direction: horizontal
                      gap: medium
                      align: center
                    children:
                      - component: text
                        text:
                          template: "Job: {{job.id}}"
                        style:
                          role: heading
                          emphasis: strong
                        layout:
                          grow: true
                      - component: button
                        text:
                          literal: Run Job
                        icon: player-play
                        actions:
                          - on: activate
                            command: run-pipeline
                            arguments:
                              pipelineDbId: "{{pipeline.id}}"
                              pipelineJobId: "{{job.id}}"
                            confirm:
                              title: Run pipeline job
                              message: Queues every matrix entry of this job as a new execution. Existing queued or running jobs are unaffected.
                      - component: button
                        text:
                          literal: Dry Run
                        icon: player-play
                        visible:
                          binding: job.supports_dry_run
                        actions:
                          - on: activate
                            command: run-pipeline
                            arguments:
                              pipelineDbId: "{{pipeline.id}}"
                              pipelineJobId: "{{job.id}}"
                              dryRun: "true"
                            confirm:
                              title: Dry-run pipeline job
                              message: Queues every matrix entry of this job as a dry run. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
                  - component: column
                    layout:
                      direction: vertical
                      gap: small
                    children:
                      - component: text
                        text:
                          template: "Needs: {{job.needs_label}}"
                        style:
                          tone: muted
                      - component: text
                        text:
                          template: "Tools: {{job.tools_label}}"
                        style:
                          tone: muted
                      - component: text
                        text:
                          binding: job.timeout_label
                        style:
                          tone: muted
                      - component: text
                        text:
                          binding: job.matrix_label
                        style:
                          tone: muted
                  - component: text
                    text:
                      literal: Configured steps
                    style:
                      emphasis: strong
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: job.steps
                      as: step
                      key: step.index
                    children:
                      - component: disclosure
                        text:
                          template: "{{step.position}}. {{step.name}}"
                        disclosure:
                          stateKey: "project-graph-step:{{projectDetails.project.id}}:{{pipeline.id}}:{{job.id}}:{{step.index}}"
                          summary:
                            - component: badge
                              text:
                                binding: step.type
                              style:
                                tone: muted
                            - component: text
                              text:
                                literal: Skipped during dry runs
                              visible:
                                binding: step.skip_dry_run
                              style:
                                tone: warning
                        layout:
                          direction: vertical
                          gap: small
                        children:
                          - component: text
                            text:
                              literal: Command
                            style:
                              emphasis: strong
                          - component: text
                            text:
                              binding: step.command
                            style:
                              role: code
                          - component: text
                            text:
                              template: "Environment: {{step.environment_label}}"
                            visible:
                              binding: step.environment_label
                              empty: true
                              not: true
                            style:
                              tone: muted
              actions:
                - on: activate
                  command: run-pipeline
                  arguments:
                    pipelineDbId: "{{pipeline.id}}"
                    pipelineJobId: "{{job.id}}"
                  confirm:
                    title: Run pipeline job
                    message: Queues every matrix entry of this job as a new execution. Existing queued or running jobs are unaffected.
              layout:
                direction: vertical
                gap: medium
              children:
                - component: list
                  layout:
                    direction: vertical
                    gap: small
                  repeat:
                    source: pipeline.jobs
                    as: job
                    key: job.id
                  children:
                    - component: card
                      layout:
                        direction: horizontal
                        gap: medium
                        align: center
                        padding: medium
                      children:
                        - component: column
                          layout:
                            direction: vertical
                            gap: small
                            grow: true
                          children:
                            - component: text
                              text:
                                template: "Job: {{job.id}}"
                              style:
                                role: code-inline
                                emphasis: strong
                            - component: text
                              text:
                                binding: job.summary_label
                              style:
                                tone: muted
                        - component: button
                          text:
                            literal: Run Job
                          icon: player-play
                          actions:
                            - on: activate
                              command: run-pipeline
                              arguments:
                                pipelineDbId: "{{pipeline.id}}"
                                pipelineJobId: "{{job.id}}"
                              confirm:
                                title: Run pipeline job
                                message: Queues every matrix entry of this job as a new execution. Existing queued or running jobs are unaffected.
        actions:
          - on: activate
            command: run-pipeline
            arguments:
              pipelineDbId: "{{pipeline.id}}"
            confirm:
              title: Run pipeline
              message: This adds a new execution without interrupting jobs that are already queued or running.
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Pipeline Chains
            visible:
              binding: projectDetails.project.has_pipeline_chains
            style:
              emphasis: strong
          - component: list
            layout:
              direction: vertical
              gap: small
            repeat:
              source: projectDetails.project.pipeline_chains
              as: chain
              key: chain.id
            children:
              - component: card
                layout:
                  direction: horizontal
                  gap: medium
                  align: center
                  padding: medium
                children:
                  - component: column
                    layout:
                      direction: vertical
                      gap: small
                      grow: true
                    children:
                      - component: text
                        text:
                          template: "Chain: {{chain.name}}"
                        style:
                          emphasis: strong
                      - component: text
                        text:
                          binding: chain.sequence_label
                        style:
                          role: code-inline
                          tone: muted
                  - component: button
                    text:
                      literal: Options
                    icon: adjustments
                    actions:
                      - on: activate
                        command: navigate
                        arguments:
                          route: /run-options/projects/{{projectDetails.project.id}}/chains/{{chain.id}}
                  - component: button
                    text:
                      literal: Run Chain
                    icon: player-play
                    actions:
                      - on: activate
                        command: run-chain
                        arguments:
                          projectId: "{{projectDetails.project.id}}"
                          chainId: "{{chain.id}}"
                        confirm:
                          title: Run pipeline chain
                          message: Queues every pipeline in this chain as one independent run. It does not interrupt jobs that are already queued or running.
                  - component: button
                    text:
                      literal: Dry Run
                    icon: player-play
                    visible:
                      binding: chain.supports_dry_run
                    actions:
                      - on: activate
                        command: run-chain
                        arguments:
                          projectId: "{{projectDetails.project.id}}"
                          chainId: "{{chain.id}}"
                          dryRun: "true"
                        confirm:
                          title: Dry-run pipeline chain
                          message: Queues a dry-run execution of every pipeline in this chain. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
          - component: text
            text:
              literal: Pipelines
            style:
              emphasis: strong
          - component: list
            id: project-pipelines
            layout:
              direction: vertical
              gap: medium
            repeat:
              source: projectDetails.visible_pipelines
              as: pipeline
              key: pipeline.id
            children:
              - component: disclosure
                text:
                  template: "Pipeline: {{pipeline.pipeline_id}}"
                disclosure:
                  defaultExpanded: true
                  stateKey: "project-pipeline:{{projectDetails.project.id}}:{{pipeline.id}}"
                  summary:
                    - component: text
                      text:
                        binding: pipeline.summary_label
                      style:
                        tone: muted
                    - component: button
                      text:
                        literal: Options
                      icon: adjustments
                      actions:
                        - on: activate
                          command: navigate
                          arguments:
                            route: /run-options/projects/{{projectDetails.project.id}}/pipelines/{{pipeline.id}}
                    - component: button
                      text:
                        literal: Run
                      icon: player-play
                      actions:
                        - on: activate
                          command: run-pipeline
                          arguments:
                            pipelineDbId: "{{pipeline.id}}"
                          confirm:
                            title: Run pipeline
                            message: This adds a new execution without interrupting jobs that are already queued or running.
                    - component: button
                      text:
                        literal: Dry Run
                      icon: player-play
                      visible:
                        binding: pipeline.supports_dry_run
                      actions:
                        - on: activate
                          command: run-pipeline
                          arguments:
                            pipelineDbId: "{{pipeline.id}}"
                            dryRun: "true"
                          confirm:
                            title: Dry-run pipeline
                            message: Queues a dry-run execution of this pipeline. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
                layout:
                  direction: vertical
                  gap: medium
                children:
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: pipeline.jobs
                      as: job
                      key: job.id
                    children:
                      - component: disclosure
                        text:
                          template: "Job: {{job.id}}"
                        disclosure:
                          stateKey: "project-job:{{projectDetails.project.id}}:{{pipeline.id}}:{{job.id}}"
                          summary:
                            - component: text
                              text:
                                binding: job.summary_label
                              style:
                                tone: muted
                            - component: button
                              text:
                                literal: Run Job
                              icon: player-play
                              actions:
                                - on: activate
                                  command: run-pipeline
                                  arguments:
                                    pipelineDbId: "{{pipeline.id}}"
                                    pipelineJobId: "{{job.id}}"
                                  confirm:
                                    title: Run pipeline job
                                    message: Queues every matrix entry of this job as a new execution. Existing queued or running jobs are unaffected.
                            - component: button
                              text:
                                literal: Dry Run
                              icon: player-play
                              visible:
                                binding: job.supports_dry_run
                              actions:
                                - on: activate
                                  command: run-pipeline
                                  arguments:
                                    pipelineDbId: "{{pipeline.id}}"
                                    pipelineJobId: "{{job.id}}"
                                    dryRun: "true"
                                  confirm:
                                    title: Dry-run pipeline job
                                    message: Queues every matrix entry of this job as a dry run. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
                        layout:
                          direction: vertical
                          gap: small
                        children:
                          - component: column
                            layout:
                              direction: vertical
                              gap: small
                            children:
                              - component: text
                                text:
                                  template: "Needs: {{job.needs_label}}"
                                style:
                                  tone: muted
                              - component: text
                                text:
                                  template: "Tools: {{job.tools_label}}"
                                style:
                                  tone: muted
                              - component: text
                                text:
                                  binding: job.timeout_label
                                style:
                                  tone: muted
                              - component: text
                                text:
                                  binding: job.matrix_label
                                style:
                                  tone: muted
                          - component: text
                            text:
                              literal: Configured steps
                            style:
                              emphasis: strong
                          - component: list
                            layout:
                              direction: vertical
                              gap: small
                            repeat:
                              source: job.steps
                              as: step
                              key: step.index
                            children:
                              - component: disclosure
                                text:
                                  template: "{{step.position}}. {{step.name}}"
                                disclosure:
                                  stateKey: "project-step:{{projectDetails.project.id}}:{{pipeline.id}}:{{job.id}}:{{step.index}}"
                                  summary:
                                    - component: badge
                                      text:
                                        binding: step.type
                                      style:
                                        tone: muted
                                    - component: text
                                      text:
                                        literal: Skipped during dry runs
                                      visible:
                                        binding: step.skip_dry_run
                                      style:
                                        tone: warning
                                layout:
                                  direction: vertical
                                  gap: small
                                children:
                                  - component: text
                                    text:
                                      literal: Command
                                    style:
                                      emphasis: strong
                                  - component: text
                                    text:
                                      binding: step.command
                                    style:
                                      role: code
                                  - component: text
                                    text:
                                      template: "Environment: {{step.environment_label}}"
                                    visible:
                                      binding: step.environment_label
                                      empty: true
                                      not: true
                                    style:
                                      tone: muted
      - component: section
        id: project-execution-history
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Execution History
            style:
              role: heading
              emphasis: strong
          - component: text
            text:
              literal: No execution history for this project.
            visible:
              binding: projectDetails.history_empty
            style:
              tone: muted
          - component: row
            layout:
              direction: horizontal
              gap: small
              align: center
            style:
              role: history-execution-header
            children:
              - component: text
                text: {literal: Job}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Status}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Pipeline}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Build}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Agent}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Created}
                style: {role: table-header, emphasis: strong}
              - component: text
                text: {literal: Duration}
                style: {role: table-header, emphasis: strong}
          - component: list
            layout:
              direction: vertical
              gap: small
            repeat:
              source: projectDetails.history_executions
              as: execution
              key: execution.key
            children:
              - component: disclosure
                disclosure:
                  stateKey: "project-history:{{projectDetails.project.id}}:{{execution.key}}"
                  summary:
                    - component: text
                      text:
                        template: "{{execution.summary.succeeded}}/{{execution.summary.total_jobs}} successful"
                      style:
                        toneBinding: execution.status
                        emphasis: strong
                layout:
                  direction: vertical
                  gap: small
                  padding: small
                text:
                  binding: execution.title
                image:
                  asset: ciwi-logo
                  description: ciwi execution
                style:
                  role: execution-row
                  emphasis: strong
                  toneBinding: execution.status
                children:
                  - component: text
                    text:
                      template: "{{execution.summary.succeeded}} succeeded · {{execution.summary.failed}} failed · {{execution.summary.total_jobs}} total"
                    style:
                      tone: muted
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: execution.sections
                      as: section
                      key: section.key
                    children:
                      - component: column
                        layout:
                          direction: vertical
                          gap: small
                        children:
                          - component: text
                            text:
                              template: "pipeline: {{section.label}}"
                            style:
                              emphasis: strong
                              tone: muted
                          - component: list
                            layout:
                              direction: vertical
                              gap: small
                            repeat:
                              source: section.jobs
                              as: job
                              key: job.id
                            children:
                              - component: row
                                layout:
                                  direction: horizontal
                                  gap: small
                                  align: start
                                style:
                                  role: history-execution-job-row
                                children:
                                  - component: text
                                    text:
                                      binding: job.label
                                    style:
                                      role: link
                                      tone: accent
                                      emphasis: strong
                                    actions:
                                      - on: activate
                                        command: navigate
                                        arguments:
                                          route: /jobs/{{job.id}}
                                  - component: text
                                    text:
                                      binding: job.status
                                    style:
                                      toneBinding: job.status
                                      emphasis: strong
                                  - component: text
                                    text: {binding: job.pipeline_id}
                                  - component: text
                                    text: {binding: job.build_label}
                                  - component: text
                                    text: {binding: job.agent_id}
                                  - component: text
                                    text: {binding: job.created_label}
                                  - component: text
                                    text: {binding: job.duration_label}
