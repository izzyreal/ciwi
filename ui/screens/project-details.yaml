apiVersion: ciwi.ui/v1
kind: Screen
metadata:
  name: project-details
  title: ciwi project
  description: Project pipelines, jobs and configured steps
screen:
  dataSources:
    - name: projectDetails
      query: get-project-details
      watchTopics: [projects]
  root:
    component: page
    id: project-details
    layout:
      direction: vertical
      gap: large
      padding: large
      maxWidth: page
    children:
      - component: row
        id: project-header
        layout:
          direction: horizontal
          gap: medium
          align: center
        style:
          role: hero
        children:
          - component: column
            layout:
              direction: vertical
              gap: small
              grow: true
            children:
              - component: text
                text:
                  template: "Project: {{projectDetails.project.name}}"
                style:
                  role: title
                  emphasis: strong
              - component: text
                text:
                  binding: projectDetails.project.repo_url
                visible:
                  binding: projectDetails.project.repo_url
                  empty: true
                  not: true
                style:
                  role: subtitle
                  tone: muted
                  truncate: true
              - component: text
                text:
                  binding: projectDetails.project.source_metadata
                visible:
                  binding: projectDetails.project.source_metadata
                  empty: true
                  not: true
                style:
                  tone: muted
          - component: button
            text:
              literal: Back to Projects
            icon: arrow-left
            actions:
              - on: activate
                command: navigate
                arguments:
                  route: /
      - component: graph-view
        id: project-structure
        text:
          literal: Structure
        graphView:
          stateKey: "project-structure:{{projectDetails.project.id}}"
          defaultMode: graph
          nodes: projectDetails.pipelines
          as: pipeline
          nodeKey: pipeline.pipeline_id
          nodeLabel:
            binding: pipeline.pipeline_id
          nodeMeta:
            binding: pipeline.graph_summary_label
          dependencies: pipeline.depends_on
        actions:
          - on: activate
            command: run-pipeline
            arguments:
              pipelineDbId: "{{pipeline.id}}"
            confirm:
              title: Run pipeline
              message: This adds a new execution without interrupting jobs that are already queued or running.
        layout:
          direction: vertical
          gap: medium
        children:
          - component: text
            text:
              literal: Pipeline Chains
            visible:
              binding: projectDetails.project.has_pipeline_chains
            style:
              emphasis: strong
          - component: list
            layout:
              direction: vertical
              gap: small
            repeat:
              source: projectDetails.project.pipeline_chains
              as: chain
              key: chain.id
            children:
              - component: card
                layout:
                  direction: horizontal
                  gap: medium
                  align: center
                  padding: medium
                children:
                  - component: column
                    layout:
                      direction: vertical
                      gap: small
                      grow: true
                    children:
                      - component: text
                        text:
                          template: "Chain: {{chain.name}}"
                        style:
                          emphasis: strong
                      - component: text
                        text:
                          binding: chain.sequence_label
                        style:
                          role: code-inline
                          tone: muted
                  - component: button
                    text:
                      literal: Options
                    icon: adjustments
                    actions:
                      - on: activate
                        command: navigate
                        arguments:
                          route: /run-options/projects/{{projectDetails.project.id}}/chains/{{chain.id}}
                  - component: button
                    text:
                      literal: Run Chain
                    icon: player-play
                    actions:
                      - on: activate
                        command: run-chain
                        arguments:
                          projectId: "{{projectDetails.project.id}}"
                          chainId: "{{chain.id}}"
                        confirm:
                          title: Run pipeline chain
                          message: Queues every pipeline in this chain as one independent run. It does not interrupt jobs that are already queued or running.
                  - component: button
                    text:
                      literal: Dry Run
                    icon: player-play
                    visible:
                      binding: chain.supports_dry_run
                    actions:
                      - on: activate
                        command: run-chain
                        arguments:
                          projectId: "{{projectDetails.project.id}}"
                          chainId: "{{chain.id}}"
                          dryRun: "true"
                        confirm:
                          title: Dry-run pipeline chain
                          message: Queues a dry-run execution of every pipeline in this chain. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
          - component: text
            text:
              literal: Pipelines
            style:
              emphasis: strong
          - component: list
            id: project-pipelines
            layout:
              direction: vertical
              gap: medium
            repeat:
              source: projectDetails.pipelines
              as: pipeline
              key: pipeline.id
            children:
              - component: disclosure
                text:
                  template: "Pipeline: {{pipeline.pipeline_id}}"
                disclosure:
                  defaultExpanded: true
                  stateKey: "project-pipeline:{{projectDetails.project.id}}:{{pipeline.id}}"
                  summary:
                    - component: text
                      text:
                        binding: pipeline.summary_label
                      style:
                        tone: muted
                    - component: button
                      text:
                        literal: Options
                      icon: adjustments
                      actions:
                        - on: activate
                          command: navigate
                          arguments:
                            route: /run-options/projects/{{projectDetails.project.id}}/pipelines/{{pipeline.id}}
                    - component: button
                      text:
                        literal: Run
                      icon: player-play
                      actions:
                        - on: activate
                          command: run-pipeline
                          arguments:
                            pipelineDbId: "{{pipeline.id}}"
                          confirm:
                            title: Run pipeline
                            message: This adds a new execution without interrupting jobs that are already queued or running.
                    - component: button
                      text:
                        literal: Dry Run
                      icon: player-play
                      visible:
                        binding: pipeline.supports_dry_run
                      actions:
                        - on: activate
                          command: run-pipeline
                          arguments:
                            pipelineDbId: "{{pipeline.id}}"
                            dryRun: "true"
                          confirm:
                            title: Dry-run pipeline
                            message: Queues a dry-run execution of this pipeline. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
                layout:
                  direction: vertical
                  gap: medium
                children:
                  - component: list
                    layout:
                      direction: vertical
                      gap: small
                    repeat:
                      source: pipeline.jobs
                      as: job
                      key: job.id
                    children:
                      - component: disclosure
                        text:
                          template: "Job: {{job.id}}"
                        disclosure:
                          stateKey: "project-job:{{projectDetails.project.id}}:{{pipeline.id}}:{{job.id}}"
                          summary:
                            - component: text
                              text:
                                binding: job.summary_label
                              style:
                                tone: muted
                            - component: button
                              text:
                                literal: Run Job
                              icon: player-play
                              actions:
                                - on: activate
                                  command: run-pipeline
                                  arguments:
                                    pipelineDbId: "{{pipeline.id}}"
                                    pipelineJobId: "{{job.id}}"
                                  confirm:
                                    title: Run pipeline job
                                    message: Queues every matrix entry of this job as a new execution. Existing queued or running jobs are unaffected.
                            - component: button
                              text:
                                literal: Dry Run
                              icon: player-play
                              visible:
                                binding: job.supports_dry_run
                              actions:
                                - on: activate
                                  command: run-pipeline
                                  arguments:
                                    pipelineDbId: "{{pipeline.id}}"
                                    pipelineJobId: "{{job.id}}"
                                    dryRun: "true"
                                  confirm:
                                    title: Dry-run pipeline job
                                    message: Queues every matrix entry of this job as a dry run. Steps marked to skip dry runs are not executed, and existing queued or running jobs are unaffected.
                        layout:
                          direction: vertical
                          gap: small
                        children:
                          - component: column
                            layout:
                              direction: vertical
                              gap: small
                            children:
                              - component: text
                                text:
                                  template: "Needs: {{job.needs_label}}"
                                style:
                                  tone: muted
                              - component: text
                                text:
                                  template: "Tools: {{job.tools_label}}"
                                style:
                                  tone: muted
                              - component: text
                                text:
                                  binding: job.timeout_label
                                style:
                                  tone: muted
                              - component: text
                                text:
                                  binding: job.matrix_label
                                style:
                                  tone: muted
                          - component: text
                            text:
                              literal: Configured steps
                            style:
                              emphasis: strong
                          - component: list
                            layout:
                              direction: vertical
                              gap: small
                            repeat:
                              source: job.steps
                              as: step
                              key: step.index
                            children:
                              - component: disclosure
                                text:
                                  template: "{{step.position}}. {{step.name}}"
                                disclosure:
                                  stateKey: "project-step:{{projectDetails.project.id}}:{{pipeline.id}}:{{job.id}}:{{step.index}}"
                                  summary:
                                    - component: badge
                                      text:
                                        binding: step.type
                                      style:
                                        tone: muted
                                    - component: text
                                      text:
                                        literal: Skipped during dry runs
                                      visible:
                                        binding: step.skip_dry_run
                                      style:
                                        tone: warning
                                layout:
                                  direction: vertical
                                  gap: small
                                children:
                                  - component: text
                                    text:
                                      literal: Command
                                    style:
                                      emphasis: strong
                                  - component: text
                                    text:
                                      binding: step.command
                                    style:
                                      role: code
                                  - component: text
                                    text:
                                      template: "Environment: {{step.environment_label}}"
                                    visible:
                                      binding: step.environment_label
                                      empty: true
                                      not: true
                                    style:
                                      tone: muted
