syntax = "proto3";

package ciwi.native.v1;

option go_package = "github.com/izzyreal/ciwi/pkg/cnp/v1;cnpv1";

message Empty {}

message Hello {
  string client_name = 1;
  string client_version = 2;
  repeated string capabilities = 3;
}

message Welcome {
  string server_name = 1;
  string server_version = 2;
  string server_instance_id = 3;
  repeated string capabilities = 4;
}

message RequestMetadata {
  string request_id = 1;
  string idempotency_key = 2;
  uint32 timeout_ms = 3;
}

enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_INVALID_ARGUMENT = 1;
  STATUS_CODE_NOT_FOUND = 2;
  STATUS_CODE_CONFLICT = 3;
  STATUS_CODE_FAILED_PRECONDITION = 4;
  STATUS_CODE_UNAVAILABLE = 5;
  STATUS_CODE_UNSUPPORTED = 6;
  STATUS_CODE_INTERNAL = 7;
}

message ErrorStatus {
  StatusCode code = 1;
  string message = 2;
}

message ServerInfo {
  string name = 1;
  uint32 api_version = 2;
  string version = 3;
  string hostname = 4;
}

message PipelineSummary {
  int64 id = 1;
  string pipeline_id = 2;
  string trigger = 3;
  repeated string depends_on = 4;
  string source_repo = 5;
  string source_ref = 6;
  bool supports_dry_run = 7;
}

message PipelineChainSummary {
  string id = 1;
  string name = 2;
  repeated string pipelines = 3;
  bool supports_dry_run = 4;
  int64 version_pipeline_id = 5;
  string sequence_label = 6;
}

message ProjectSummary {
  int64 id = 1;
  string name = 2;
  string source_kind = 3;
  string config_path = 4;
  string repo_url = 5;
  string repo_ref = 6;
  string config_file = 7;
  string loaded_commit = 8;
  int64 updated_unix_ms = 9;
  repeated PipelineSummary pipelines = 10;
  repeated PipelineChainSummary pipeline_chains = 11;
}

message ProjectList {
  repeated ProjectSummary projects = 1;
}

message FrontPageView {
  ServerInfo server = 1;
  repeated ProjectSummary projects = 2;
  repeated ExecutionCardSummary queued_executions = 3;
  repeated ExecutionCardSummary history_executions = 4;
}

message ProjectDetailsView {
  ProjectSummary project = 1;
  repeated ProjectPipelineDetails pipelines = 2;
}

message ProjectPipelineDetails {
  int64 id = 1;
  string pipeline_id = 2;
  string trigger = 3;
  repeated string depends_on = 4;
  string dependencies = 5;
  uint32 jobs_count = 6;
  bool supports_dry_run = 7;
  repeated ProjectJobDetails jobs = 8;
}

message ProjectJobDetails {
  string id = 1;
  repeated string needs = 2;
  string needs_label = 3;
  string runs_on_label = 4;
  string tools_label = 5;
  uint32 timeout_seconds = 6;
  uint32 matrix_count = 7;
  uint32 steps_count = 8;
  repeated ProjectStepDetails steps = 9;
  bool supports_dry_run = 10;
}

message ProjectStepDetails {
  uint32 index = 1;
  uint32 position = 2;
  string name = 3;
  string type = 4;
  string command = 5;
  bool skip_dry_run = 6;
  repeated string environment = 7;
}

message GetProjectDetailsRequest {
  int64 project_id = 1;
}

message GetJobDetailsRequest {
  string job_execution_id = 1;
}

message JobDetailsView {
  string id = 1;
  string title = 2;
  string context = 3;
  string status = 4;
  string status_label = 5;
  string current_step = 6;
  string agent = 7;
  string mode = 8;
  string created = 9;
  string started = 10;
  string finished = 11;
  string duration = 12;
  string exit_code = 13;
  string error = 14;
  repeated JobTimelineItem timeline = 15;
  bool can_cancel = 16;
  bool can_rerun = 17;
}

message ControlExecutionRequest {
  string job_execution_id = 1;
}

message CancelExecutionResult {
  string job_execution_id = 1;
  string status = 2;
}

message RerunExecutionResult {
  string original_job_execution_id = 1;
  string job_execution_id = 2;
  string status = 3;
}

message JobTimelineItem {
  string id = 1;
  string kind = 2;
  string title = 3;
  string description = 4;
  string status = 5;
  string status_label = 6;
  string duration = 7;
  string exit_code = 8;
  string error = 9;
}

message WatchJobOutputRequest {
  string job_execution_id = 1;
  int64 after_event_id = 2;
}

message JobOutputBatch {
  string job_execution_id = 1;
  int64 next_event_id = 2;
  repeated JobOutputLine lines = 3;
  bool has_more = 4;
  bool terminal = 5;
}

message JobOutputLine {
  int64 event_id = 1;
  string text = 2;
}

message ExecutionSummary {
  uint32 total_jobs = 1;
  uint32 succeeded = 2;
  uint32 failed = 3;
  uint32 in_progress = 4;
  uint32 waiting = 5;
}

message ExecutionCardSummary {
  string key = 1;
  string kind = 2;
  string title = 3;
  repeated string job_execution_ids = 4;
  ExecutionSummary summary = 5;
  repeated ExecutionCardSection sections = 6;
}

message ExecutionCardSection {
  string key = 1;
  string label = 2;
  repeated ExecutionCardJob jobs = 3;
}

message ExecutionCardJob {
  string id = 1;
  string label = 2;
  string status = 3;
  string current_step = 4;
}

message RunPipelineSelection {
  string pipeline_job_id = 1;
  string matrix_name = 2;
  optional int32 matrix_index = 3;
  bool dry_run = 4;
  string source_ref = 5;
  string agent_id = 6;
  string execution_mode = 7;
}

message RunPipelineRequest {
  int64 pipeline_db_id = 1;
  RunPipelineSelection selection = 2;
}

message RunPipelineResult {
  string project_name = 1;
  string pipeline_id = 2;
  uint32 enqueued = 3;
  repeated string job_execution_ids = 4;
}

message RunPipelineChainRequest {
  int64 project_id = 1;
  string chain_id = 2;
  RunPipelineSelection selection = 3;
}

message RunPipelineChainResult {
  string project_name = 1;
  string chain_id = 2;
  uint32 enqueued = 3;
  repeated string job_execution_ids = 4;
  string chain_name = 5;
}

message ClearExecutionQueueRequest {}

message ClearExecutionQueueResult {
  int64 cleared = 1;
}

message FlushExecutionHistoryRequest {
  bool all = 1;
  repeated string job_execution_ids = 2;
}

message FlushExecutionHistoryResult {
  int64 flushed = 1;
}

enum ChangeTopic {
  CHANGE_TOPIC_UNSPECIFIED = 0;
  CHANGE_TOPIC_SERVER = 1;
  CHANGE_TOPIC_PROJECTS = 2;
  CHANGE_TOPIC_AGENTS = 3;
  CHANGE_TOPIC_QUEUE = 4;
  CHANGE_TOPIC_HISTORY = 5;
  CHANGE_TOPIC_UPDATES = 6;
  CHANGE_TOPIC_VAULT = 7;
}

message WatchChangesRequest {}

message ChangeEvent {
  string server_instance_id = 1;
  uint64 revision = 2;
  repeated ChangeTopic topics = 3;
  int64 occurred_unix_ms = 4;
  bool resync_required = 5;
}

message Request {
  RequestMetadata metadata = 1;
  oneof operation {
    Empty get_server_info = 10;
    Empty list_projects = 11;
    Empty get_front_page_view = 12;
    RunPipelineRequest run_pipeline = 13;
    WatchChangesRequest watch_changes = 14;
    GetProjectDetailsRequest get_project_details = 15;
    GetJobDetailsRequest get_job_details = 16;
    WatchJobOutputRequest watch_job_output = 17;
    ClearExecutionQueueRequest clear_execution_queue = 18;
    FlushExecutionHistoryRequest flush_execution_history = 19;
    ControlExecutionRequest cancel_execution = 20;
    ControlExecutionRequest rerun_execution = 21;
    RunPipelineChainRequest run_pipeline_chain = 22;
  }
}

message Response {
  string request_id = 1;
  oneof result {
    ServerInfo server_info = 10;
    ProjectList project_list = 11;
    FrontPageView front_page_view = 12;
    RunPipelineResult run_pipeline = 13;
    ChangeEvent change = 14;
    ErrorStatus error = 15;
    ProjectDetailsView project_details = 16;
    JobDetailsView job_details = 17;
    JobOutputBatch job_output = 18;
    ClearExecutionQueueResult clear_execution_queue = 19;
    FlushExecutionHistoryResult flush_execution_history = 20;
    CancelExecutionResult cancel_execution = 21;
    RerunExecutionResult rerun_execution = 22;
    RunPipelineChainResult run_pipeline_chain = 23;
  }
}

message ClientMessage {
  oneof body {
    Hello hello = 1;
    Request request = 2;
  }
}

message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Response response = 2;
  }
}
