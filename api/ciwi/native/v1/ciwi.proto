syntax = "proto3";

package ciwi.native.v1;

option go_package = "github.com/izzyreal/ciwi/pkg/cnp/v1;cnpv1";

message Empty {}

message Hello {
  string client_name = 1;
  string client_version = 2;
  repeated string capabilities = 3;
}

message Welcome {
  string server_name = 1;
  string server_version = 2;
  string server_instance_id = 3;
  repeated string capabilities = 4;
  string server_installation_id = 5;
}

message RequestMetadata {
  string request_id = 1;
  string idempotency_key = 2;
  uint32 timeout_ms = 3;
}

enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_INVALID_ARGUMENT = 1;
  STATUS_CODE_NOT_FOUND = 2;
  STATUS_CODE_CONFLICT = 3;
  STATUS_CODE_FAILED_PRECONDITION = 4;
  STATUS_CODE_UNAVAILABLE = 5;
  STATUS_CODE_UNSUPPORTED = 6;
  STATUS_CODE_INTERNAL = 7;
}

message ErrorStatus {
  StatusCode code = 1;
  string message = 2;
}

message ServerInfo {
  string name = 1;
  uint32 api_version = 2;
  string version = 3;
  string hostname = 4;
  string installation_id = 5;
}

message PipelineSummary {
  int64 id = 1;
  string pipeline_id = 2;
  string trigger = 3;
  repeated string depends_on = 4;
  string source_repo = 5;
  string source_ref = 6;
  bool supports_dry_run = 7;
}

message PipelineChainSummary {
  string id = 1;
  string name = 2;
  repeated string pipelines = 3;
  bool supports_dry_run = 4;
  int64 version_pipeline_id = 5;
  string sequence_label = 6;
}

message ProjectSummary {
  int64 id = 1;
  string name = 2;
  string source_kind = 3;
  string config_path = 4;
  string repo_url = 5;
  string repo_ref = 6;
  string config_file = 7;
  string loaded_commit = 8;
  int64 updated_unix_ms = 9;
  repeated PipelineSummary pipelines = 10;
  repeated PipelineChainSummary pipeline_chains = 11;
  bytes project_icon = 12;
  string project_icon_content_type = 13;
  string pipeline_count_label = 14;
  string source_metadata = 15;
  bool has_pipeline_chains = 16;
  bool is_managed = 17;
  bool can_reload = 18;
  bool has_repo = 19;
  string repo_ref_label = 20;
  bool has_loaded_commit = 21;
  string loaded_commit_short = 22;
  string loaded_commit_url = 23;
  string source_label = 24;
}

message ProjectList {
  repeated ProjectSummary projects = 1;
}

message FrontPageView {
  ServerInfo server = 1;
  repeated ProjectSummary projects = 2;
  repeated ExecutionCardSummary queued_executions = 3;
  repeated ExecutionCardSummary history_executions = 4;
}

message GetFrontPageViewRequest {
  repeated int64 include_project_icon_ids = 1;
}

message GetProjectIconsRequest {
  repeated int64 project_ids = 1;
}

message ProjectIcon {
  int64 project_id = 1;
  bytes data = 2;
  string content_type = 3;
}

message ProjectIconList {
  repeated ProjectIcon icons = 1;
}

message ProjectDetailsView {
  ProjectSummary project = 1;
  repeated ProjectPipelineDetails pipelines = 2;
  repeated ExecutionCardSummary history_executions = 3;
  bytes project_icon = 4;
  string project_icon_content_type = 5;
  repeated ProjectStructureFilter structure_filters = 6;
}

message ProjectStructureFilter {
  string value = 1;
  string label = 2;
  repeated string pipeline_ids = 3;
  ProjectStructureRoot root = 4;
  bool show_chain_structure = 5;
  bool show_pipeline_structure = 6;
}

message ProjectStructureRoot {
  string id = 1;
  string label = 2;
  string meta = 3;
  bool runnable = 4;
  int64 project_id = 5;
  string chain_id = 6;
}

message ProjectPipelineDetails {
  int64 id = 1;
  string pipeline_id = 2;
  string trigger = 3;
  repeated string depends_on = 4;
  string dependencies = 5;
  uint32 jobs_count = 6;
  bool supports_dry_run = 7;
  repeated ProjectJobDetails jobs = 8;
  string summary_label = 9;
  string graph_summary_label = 10;
}

message ProjectJobDetails {
  string id = 1;
  repeated string needs = 2;
  string needs_label = 3;
  string runs_on_label = 4;
  string tools_label = 5;
  uint32 timeout_seconds = 6;
  uint32 matrix_count = 7;
  uint32 steps_count = 8;
  repeated ProjectStepDetails steps = 9;
  bool supports_dry_run = 10;
  string summary_label = 11;
  string timeout_label = 12;
  string matrix_label = 13;
}

message ProjectStepDetails {
  uint32 index = 1;
  uint32 position = 2;
  string name = 3;
  string type = 4;
  string command = 5;
  bool skip_dry_run = 6;
  repeated string environment = 7;
  string environment_label = 8;
}

message GetProjectDetailsRequest {
  int64 project_id = 1;
  bool include_project_icon = 2;
}

message GetJobDetailsRequest {
  string job_execution_id = 1;
  bool include_project_icon = 2;
}

message JobDetailsView {
  string id = 1;
  string title = 2;
  string context = 3;
  string status = 4;
  string status_label = 5;
  string current_step = 6;
  string agent = 7;
  string mode = 8;
  string created = 9;
  string started = 10;
  string finished = 11;
  string duration = 12;
  string exit_code = 13;
  string error = 14;
  repeated JobTimelineItem timeline = 15;
  bool can_cancel = 16;
  bool can_rerun = 17;
  repeated JobOutputGroup output_groups = 18;
  SchedulingDiagnosis scheduling_diagnosis = 19;
  Progress progress = 20;
  int64 project_id = 21;
  bytes project_icon = 22;
  string project_icon_content_type = 23;
  repeated JobDetailRow job_properties = 24;
  repeated JobDetailRow cache_statistics = 25;
  string cache_statistics_empty = 26;
  ToolRequirements host_tool_requirements = 27;
  ToolRequirements container_tool_requirements = 28;
  repeated JobDetailRow release_summary = 29;
  bool has_release_summary = 30;
  JobRunContext run_context = 31;
  ReportDetails artifacts = 32;
  ReportDetails test_report = 33;
  ReportDetails coverage_report = 34;
  bool interactive_log_available = 35;
  int32 interactive_log_version = 36;
  string legacy_log_notice = 37;
}

message SchedulingDiagnosis {
  string state = 1;
  string summary = 2;
  repeated string requirements = 3;
  repeated SchedulingAgentAssessment agents = 4;
  string requirements_label = 5;
  string additional_agents_label = 6;
}

message SchedulingAgentAssessment {
  string agent_id = 1;
  string status = 2;
  string details = 3;
  string tone = 4;
  bool capability_match = 5;
  bool available = 6;
}

message ControlExecutionRequest {
  string job_execution_id = 1;
}

message CancelExecutionResult {
  string job_execution_id = 1;
  string status = 2;
}

message RerunExecutionResult {
  string original_job_execution_id = 1;
  string job_execution_id = 2;
  string status = 3;
}

message JobTimelineItem {
  string id = 1;
  string kind = 2;
  string title = 3;
  string description = 4;
  string status = 5;
  string status_label = 6;
  string duration = 7;
  string exit_code = 8;
  string error = 9;
  Progress progress = 10;
}

message JobOutputGroup {
  string id = 1;
  string state_key = 2;
  string kind = 3;
  string title = 4;
  string command_summary = 5;
  string status = 6;
  string status_label = 7;
  bool reached = 8;
  string started = 9;
  string duration = 10;
  string exit_code = 11;
  string error = 12;
  string details = 13;
  string yaml_literal = 14;
  string expanded_command = 15;
  Progress progress = 16;
  bool default_expanded = 17;
}

message WatchJobOutputRequest {
  string job_execution_id = 1;
  int64 after_event_id = 2;
}

message JobOutputBatch {
  string job_execution_id = 1;
  int64 next_event_id = 2;
  repeated JobOutputEvent events = 3;
  bool has_more = 4;
  bool terminal = 5;
}

message JobOutputEvent {
  int64 event_id = 1;
  string type = 2;
  string item_id = 3;
  string text = 4;
  string error = 5;
  string exit_code = 6;
}

message JobLogDescriptorRequest {
  string job_execution_id = 1;
}

enum JobLogPageMode {
  JOB_LOG_PAGE_MODE_UNSPECIFIED = 0;
  JOB_LOG_PAGE_MODE_HEAD = 1;
  JOB_LOG_PAGE_MODE_TAIL = 2;
  JOB_LOG_PAGE_MODE_BEFORE = 3;
  JOB_LOG_PAGE_MODE_AFTER = 4;
  JOB_LOG_PAGE_MODE_AROUND = 5;
}

message JobLogPageRequest {
  string job_execution_id = 1;
  string item_id = 2;
  JobLogPageMode mode = 3;
  int64 cursor = 4;
}

message JobLogSearchRequest {
  string job_execution_id = 1;
  string query = 2;
  int64 selected_index = 3;
}

message WatchJobLogRequest {
  string job_execution_id = 1;
  int64 after_chunk_id = 2;
}

message JobLogDescriptor {
  string job_execution_id = 1;
  int32 version = 2;
  bool available = 3;
  bool terminal = 4;
  int64 latest_chunk_id = 5;
  repeated JobLogStream streams = 6;
}

message JobLogStream {
  string item_id = 1;
  int64 first_chunk_id = 2;
  int64 last_chunk_id = 3;
  int64 chunk_count = 4;
  int64 byte_count = 5;
}

message JobLogPage {
  string job_execution_id = 1;
  string item_id = 2;
  repeated JobLogChunk chunks = 3;
  int64 first_cursor = 4;
  int64 last_cursor = 5;
  bool has_before = 6;
  bool has_after = 7;
  bool terminal = 8;
}

message JobLogChunk {
  int64 id = 1;
  string item_id = 2;
  string text = 3;
  int32 byte_count = 4;
  int32 rune_count = 5;
}

message JobLogSearchResult {
  string job_execution_id = 1;
  string query = 2;
  int64 selected_index = 3;
  int64 total_matches = 4;
  JobLogMatch match = 5;
}

message JobLogMatch {
  string item_id = 1;
  int64 chunk_id = 2;
  int32 start_rune = 3;
  int32 end_rune = 4;
}

message ExecutionSummary {
  uint32 total_jobs = 1;
  uint32 succeeded = 2;
  uint32 failed = 3;
  uint32 in_progress = 4;
  uint32 waiting = 5;
}

message ExecutionCardSummary {
  string key = 1;
  string kind = 2;
  string title = 3;
  repeated string job_execution_ids = 4;
  ExecutionSummary summary = 5;
  repeated ExecutionCardSection sections = 6;
  Progress progress = 7;
  string status = 8;
  string summary_tone = 9;
  string summary_label = 10;
  string job_execution_ids_csv = 11;
}

message ExecutionCardSection {
  string key = 1;
  string label = 2;
  repeated ExecutionCardJob jobs = 3;
  Progress progress = 4;
}

message ExecutionCardJob {
  string id = 1;
  string label = 2;
  string status = 3;
  string current_step = 4;
  SchedulingDiagnosis scheduling_diagnosis = 5;
  string pipeline_id = 6;
  string build_label = 7;
  string agent_id = 8;
  string created_utc = 9;
  string started_utc = 10;
  string finished_utc = 11;
  string reason = 12;
  string action = 13;
  Progress progress = 14;
  int64 project_id = 15;
  string created_label = 16;
  string duration_label = 17;
  string status_label = 18;
}

message Progress {
  string state = 1;
  double fraction = 2;
  int64 snapshot_unix_ms = 3;
  double rate_per_ms = 4;
}

message RunPipelineSelection {
  string pipeline_job_id = 1;
  string matrix_name = 2;
  optional int32 matrix_index = 3;
  bool dry_run = 4;
  string source_ref = 5;
  string agent_id = 6;
  string execution_mode = 7;
}

message RunPipelineRequest {
  int64 pipeline_db_id = 1;
  RunPipelineSelection selection = 2;
}

message RunPipelineResult {
  string project_name = 1;
  string pipeline_id = 2;
  uint32 enqueued = 3;
  repeated string job_execution_ids = 4;
}

message RunPipelineChainRequest {
  int64 project_id = 1;
  string chain_id = 2;
  RunPipelineSelection selection = 3;
}

message RunPipelineChainResult {
  string project_name = 1;
  string chain_id = 2;
  uint32 enqueued = 3;
  repeated string job_execution_ids = 4;
  string chain_name = 5;
}

message GetRunOptionsRequest {
  int64 pipeline_db_id = 1;
  int64 project_id = 2;
  string chain_id = 3;
  RunPipelineSelection selection = 4;
}

message RunOption {
  string value = 1;
  string label = 2;
}

message RunOptionsView {
  string target_kind = 1;
  string target_label = 2;
  int64 pipeline_db_id = 3;
  int64 project_id = 4;
  string chain_id = 5;
  bool supports_dry_run = 6;
  string source_repo = 7;
  string default_source_ref = 8;
  repeated RunOption source_refs = 9;
  repeated RunOption eligible_agents = 10;
  uint32 pending_jobs = 11;
  string selected_source_ref = 12;
  string selected_agent_id = 13;
}

message AgentSummary {
  string id = 1;
  string hostname = 2;
  string platform = 3;
  string version = 4;
  string status = 5;
  string status_label = 6;
  string authorization = 7;
  string activation = 8;
  bool authorized = 9;
  bool deactivated = 10;
  bool job_in_progress = 11;
  string capabilities_label = 12;
  string run_mode = 13;
  string last_seen = 14;
  string recent_log = 15;
  string update_label = 16;
  bool can_update = 17;
  bool can_contact = 18;
  bool can_run_script = 19;
  repeated AgentScriptShell script_shells = 20;
  int64 last_seen_unix_ms = 21;
}

message AgentScriptShell {
  string value = 1;
  string label = 2;
  string example_script = 3;
}

message AgentsView {
  string summary = 1;
  repeated AgentSummary agents = 2;
}

message GetAgentDetailsRequest {
  string agent_id = 1;
}

message AgentDetailsView {
  AgentSummary agent = 1;
}

message AgentActionRequest {
  string agent_id = 1;
  string action = 2;
}

message AgentActionResult {
  bool requested = 1;
  string agent_id = 2;
  string message = 3;
  string target = 4;
}

message RunAgentScriptRequest {
  string agent_id = 1;
  string shell = 2;
  string script = 3;
  int32 timeout_seconds = 4;
}

message RunAgentScriptResult {
  bool queued = 1;
  string agent_id = 2;
  string job_execution_id = 3;
  string shell = 4;
  int32 timeout_seconds = 5;
}

message ProjectActionRequest {
  int64 project_id = 1;
  string action = 2;
}

message ProjectActionResult {
  int64 project_id = 1;
  string message = 2;
}

message ImportProjectRequest {
  string repo_url = 1;
  string repo_ref = 2;
  string config_file = 3;
}

message ImportProjectResult {
  string project_name = 1;
  string repo_url = 2;
  string repo_ref = 3;
  string config_file = 4;
  uint32 pipelines = 5;
}

message GetManagedYAMLRequest {
  int64 project_id = 1;
}

message ManagedYAMLRequest {
  int64 project_id = 1;
  string yaml = 2;
  string revision = 3;
}

message ManagedYAMLDefinition {
  int64 project_id = 1;
  string project_name = 2;
  string yaml = 3;
  string revision = 4;
  uint32 pipelines = 5;
  uint32 pipeline_chains = 6;
}

message VaultConnection {
  int64 id = 1;
  string name = 2;
  string url = 3;
  string auth_method = 4;
  string approle_mount = 5;
  string role_id = 6;
  string secret_id_env = 7;
  string namespace = 8;
  string kv_default_mount = 9;
  int32 kv_default_version = 10;
}

message VaultConnectionList {
  repeated VaultConnection connections = 1;
}

message UpsertVaultConnectionRequest {
  string name = 1;
  string url = 2;
  string auth_method = 3;
  string approle_mount = 4;
  string role_id = 5;
  string secret_id_env = 6;
  string namespace = 7;
  string kv_default_mount = 8;
  int32 kv_default_version = 9;
}

message VaultConnectionIDRequest {
  int64 id = 1;
}

message TestVaultConnectionRequest {
  int64 id = 1;
  string secret_id_override = 2;
}

message TestVaultConnectionResult {
  bool ok = 1;
  string message = 2;
}

message DeleteVaultConnectionResult {
  bool deleted = 1;
  int64 id = 2;
}

message ServerUpdateStatus {
  string current_version = 1;
  string latest_version = 2;
  bool update_available = 3;
  string last_checked_utc = 4;
  string last_apply_status = 5;
  string last_apply_utc = 6;
  string message = 7;
  string server_mode = 8;
  bool self_update_supported = 9;
  string self_update_reason = 10;
  string agent_target_version = 11;
  repeated string blocked_agent_ids = 12;
}

message ServerUpdateCheckResult {
  string current_version = 1;
  string latest_version = 2;
  repeated string available_versions = 3;
  bool update_available = 4;
  string release_url = 5;
  string asset_name = 6;
  string message = 7;
}

message ServerUpdateVersions {
  repeated string versions = 1;
  string current_version = 2;
}

message ServerUpdateActionRequest {
  string action = 1;
  string target_version = 2;
}

message ServerUpdateActionResult {
  bool updated = 1;
  bool restarting = 2;
  bool staged = 3;
  string message = 4;
  string target_version = 5;
  string current_version = 6;
}

message ClearExecutionQueueRequest {}

message ClearExecutionQueueResult {
  int64 cleared = 1;
}

message FlushExecutionHistoryRequest {
  bool all = 1;
  repeated string job_execution_ids = 2;
}

message FlushExecutionHistoryResult {
  int64 flushed = 1;
}

message RemoveQueuedExecutionResult {
  string job_execution_id = 1;
  bool removed = 2;
}

message CommandReceiptStatusRequest {
  string key = 1;
}

message CommandReceiptStatus {
  bool found = 1;
  string key = 2;
  string operation = 3;
  string fingerprint = 4;
  string status = 5;
  bytes result_json = 6;
}

enum ChangeTopic {
  CHANGE_TOPIC_UNSPECIFIED = 0;
  CHANGE_TOPIC_SERVER = 1;
  CHANGE_TOPIC_PROJECTS = 2;
  CHANGE_TOPIC_AGENTS = 3;
  CHANGE_TOPIC_QUEUE = 4;
  CHANGE_TOPIC_HISTORY = 5;
  CHANGE_TOPIC_UPDATES = 6;
  CHANGE_TOPIC_VAULT = 7;
  CHANGE_TOPIC_AGENT_ELIGIBILITY = 8;
  CHANGE_TOPIC_JOB_OUTPUT = 9;
}

message WatchChangesRequest {}

message ChangeEvent {
  string server_instance_id = 1;
  uint64 revision = 2;
  repeated ChangeTopic topics = 3;
  int64 occurred_unix_ms = 4;
  bool resync_required = 5;
  repeated string job_execution_ids = 6;
}

message Request {
  RequestMetadata metadata = 1;
  oneof operation {
    Empty get_server_info = 10;
    Empty list_projects = 11;
    GetFrontPageViewRequest get_front_page_view = 12;
    RunPipelineRequest run_pipeline = 13;
    WatchChangesRequest watch_changes = 14;
    GetProjectDetailsRequest get_project_details = 15;
    GetJobDetailsRequest get_job_details = 16;
    WatchJobOutputRequest watch_job_output = 17;
    ClearExecutionQueueRequest clear_execution_queue = 18;
    FlushExecutionHistoryRequest flush_execution_history = 19;
    ControlExecutionRequest cancel_execution = 20;
    ControlExecutionRequest rerun_execution = 21;
    RunPipelineChainRequest run_pipeline_chain = 22;
    GetRunOptionsRequest get_run_options = 23;
    Empty get_agents_view = 24;
    AgentActionRequest agent_action = 25;
    ProjectActionRequest project_action = 26;
    ImportProjectRequest import_project = 27;
    Empty get_server_update_status = 28;
    Empty check_server_updates = 29;
    Empty list_server_update_versions = 30;
    ServerUpdateActionRequest server_update_action = 31;
    ControlExecutionRequest remove_queued_execution = 32;
    GetAgentDetailsRequest get_agent_details = 33;
    CommandReceiptStatusRequest get_command_receipt_status = 34;
    RunAgentScriptRequest run_agent_script = 35;
    GetManagedYAMLRequest get_managed_yaml = 36;
    ManagedYAMLRequest validate_managed_yaml = 37;
    ManagedYAMLRequest save_managed_yaml = 38;
    Empty list_vault_connections = 39;
    UpsertVaultConnectionRequest upsert_vault_connection = 40;
    TestVaultConnectionRequest test_vault_connection = 41;
    VaultConnectionIDRequest delete_vault_connection = 42;
    ArtifactDownloadRequest download_artifact = 43;
    GetProjectIconsRequest get_project_icons = 44;
    JobLogDescriptorRequest get_job_log_descriptor = 45;
    JobLogPageRequest get_job_log_page = 46;
    JobLogSearchRequest search_job_log = 47;
    WatchJobLogRequest watch_job_log = 48;
  }
}

message Response {
  string request_id = 1;
  oneof result {
    ServerInfo server_info = 10;
    ProjectList project_list = 11;
    FrontPageView front_page_view = 12;
    RunPipelineResult run_pipeline = 13;
    ChangeEvent change = 14;
    ErrorStatus error = 15;
    ProjectDetailsView project_details = 16;
    JobDetailsView job_details = 17;
    JobOutputBatch job_output = 18;
    ClearExecutionQueueResult clear_execution_queue = 19;
    FlushExecutionHistoryResult flush_execution_history = 20;
    CancelExecutionResult cancel_execution = 21;
    RerunExecutionResult rerun_execution = 22;
    RunPipelineChainResult run_pipeline_chain = 23;
    RunOptionsView run_options = 24;
    AgentsView agents_view = 25;
    AgentActionResult agent_action = 26;
    ProjectActionResult project_action = 27;
    ImportProjectResult import_project = 28;
    ServerUpdateStatus server_update_status = 29;
    ServerUpdateCheckResult server_update_check = 30;
    ServerUpdateVersions server_update_versions = 31;
    ServerUpdateActionResult server_update_action = 32;
    RemoveQueuedExecutionResult remove_queued_execution = 33;
    AgentDetailsView agent_details = 34;
    CommandReceiptStatus command_receipt_status = 35;
    RunAgentScriptResult run_agent_script = 36;
    ManagedYAMLDefinition managed_yaml = 37;
    VaultConnectionList vault_connection_list = 38;
    VaultConnection vault_connection = 39;
    TestVaultConnectionResult test_vault_connection = 40;
    DeleteVaultConnectionResult delete_vault_connection = 41;
    ArtifactDownloadChunk artifact_download = 42;
    ProjectIconList project_icons = 43;
    JobLogDescriptor job_log_descriptor = 44;
    JobLogPage job_log_page = 45;
    JobLogSearchResult job_log_search = 46;
  }
}

message ClientMessage {
  oneof body {
    Hello hello = 1;
    Request request = 2;
  }
}

message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Response response = 2;
  }
}

message JobDetailRow {
  string label = 1;
  string value = 2;
  string tone = 3;
}

message ToolRequirements {
  string empty_label = 1;
  string summary = 2;
  string tone = 3;
  repeated string issues = 4;
}

message ReportDetails {
  string empty_label = 1;
  string summary = 2;
  string tone = 3;
  repeated JobDetailRow rows = 4;
  string additional_label = 5;
  repeated TreeNode nodes = 6;
  repeated ReportFilter filters = 7;
  string filter = 8;
  bool can_download_all = 9;
}

message ReportFilter {
  string value = 1;
  string label = 2;
}

message TreeNode {
  string key = 1;
  reserved 2;
  string label = 3;
  string detail = 4;
  string tone = 5;
  string link = 6;
  string action_label = 7;
  string action_kind = 8;
  string action_path = 9;
  bool default_expanded = 10;
  repeated string filter_values = 11;
  repeated TreeNode children = 12;
}

message ArtifactDownloadRequest {
  string job_execution_id = 1;
  string kind = 2;
  string path = 3;
  string token = 4;
  int64 offset = 5;
  bool cancel = 6;
}

message ArtifactDownloadChunk {
  string token = 1;
  string file_name = 2;
  string content_type = 3;
  bytes data = 4;
  int64 next_offset = 5;
  int64 total_size = 6;
  bool complete = 7;
}

message JobRunContext {
  bool available = 1;
  string scope = 2;
  string scope_label = 3;
  string current_execution_id = 4;
  string current_pipeline_id = 5;
  string current_pipeline_job_id = 6;
  repeated JobRunContextPipeline pipelines = 7;
}

message JobRunContextPipeline {
  int64 id = 1;
  string pipeline_id = 2;
  repeated string depends_on = 3;
  string status = 4;
  string summary_label = 5;
  repeated JobRunContextJob jobs = 6;
}

message JobRunContextJob {
  string id = 1;
  repeated string needs = 2;
  string status = 3;
  string summary_label = 4;
  repeated JobRunContextExecution executions = 5;
}

message JobRunContextExecution {
  string id = 1;
  string status = 2;
  string matrix_label = 3;
  string attempt_label = 4;
  bool current = 5;
  bool latest_attempt = 6;
}
