version: 1
project:
  name: ciwi

pipelines:
  - id: build
    trigger: manual
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    versioning:
      file: VERSION
      tag_prefix: v
    jobs:
      - id: unit-tests
        runs_on:
          executor: script
          shell: posix
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
        timeout_seconds: 600
        steps:
          - name: Run Go unit tests
            test:
              name: go-unit
              command: mkdir -p dist && go test -json -coverprofile=dist/go-unit.cover ./... > dist/go-unit.json
              format: go-test-json
              report: dist/go-unit.json
              coverage_format: go-coverprofile
              coverage_report: dist/go-unit.cover
      - id: build-cross-platform
        needs:
          - unit-tests
        runs_on:
          executor: script
          shell: posix
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
        timeout_seconds: 600
        artifacts:
          - dist/**
        matrix:
          include:
            - name: linux-amd64
              goos: linux
              goarch: amd64
              ext: ""
            - name: windows-amd64
              goos: windows
              goarch: amd64
              ext: ".exe"
            - name: windows-arm64
              goos: windows
              goarch: arm64
              ext: ".exe"
            - name: darwin-amd64
              goos: darwin
              goarch: amd64
              ext: ""
            - name: darwin-arm64
              goos: darwin
              goarch: arm64
              ext: ""
        steps:
          - name: Prepare dist
            run: mkdir -p dist
          - name: Build ciwi binary
            run: GOOS={{goos}} GOARCH={{goarch}} CGO_ENABLED=0 go build -v -trimpath -ldflags="-s -w -X github.com/izzyreal/ciwi/internal/version.Version=${CIWI_PIPELINE_VERSION}" -o dist/ciwi-{{name}}{{ext}} ./cmd/ciwi
      - id: desktop-macos-unsigned
        needs:
          - unit-tests
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
            xcodebuild: "*"
            plistbuddy: "*"
        timeout_seconds: 1200
        artifacts:
          - dist/desktop-macos-unsigned/**
        steps:
          - name: Prepare macOS desktop output
            run: rm -rf dist/desktop-macos-unsigned && mkdir -p dist/desktop-macos-unsigned
          - name: Build universal macOS desktop app
            run: sh packaging/build-macos-app.sh "${CIWI_PIPELINE_VERSION}" dist/desktop-macos-unsigned
      - id: desktop-windows-amd64
        needs:
          - unit-tests
        runs_on:
          executor: script
          shell: powershell
          os: windows
          arch: amd64
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
            wix: ">=6.0.0"
        timeout_seconds: 1800
        artifacts:
          - dist/Ciwi-Client-windows-Setup-x86_64-v*.exe
        steps:
          - name: Prepare Windows desktop output
            run: New-Item -ItemType Directory -Force -Path dist | Out-Null
          - name: Build Windows desktop installer
            run: $version = (Get-Content VERSION -Raw).Trim(); & powershell -ExecutionPolicy Bypass -File packaging\build-windows-installer.ps1 -Version $version -OutputExe "dist\Ciwi-Client-windows-Setup-x86_64-v$version.exe"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: desktop-linux-amd64
        needs:
          - unit-tests
        runs_on:
          executor: script
          shell: posix
          os: linux
          arch: amd64
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
            zip: "*"
            xorg-dev: "*"
        timeout_seconds: 1200
        artifacts:
          - dist/Ciwi-Client-linux-amd64-v*.zip
        steps:
          - name: Prepare Linux desktop output
            run: mkdir -p dist
          - name: Build Linux desktop archive
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && sh packaging/build-linux-zip.sh "$VERSION" "dist/Ciwi-Client-linux-amd64-v${VERSION}.zip"
  - id: release
    trigger: manual
    depends_on:
      - build
      - codesign-macos
      - package-macos
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    versioning:
      file: VERSION
      tag_prefix: v
      auto_bump: patch
      auto_bump_vcs_token: "{{ secret.github-secret }}"
      auto_bump_vault:
        connection: home-vault
        secrets:
          - name: github-secret
            mount: kv
            path: gh
            key: token
            kv_version: 2
    jobs:
      - id: github-release
        artifact_sources:
          - pipeline: build
            job: build-cross-platform
          - pipeline: build
            job: desktop-windows-amd64
          - pipeline: build
            job: desktop-linux-amd64
          - pipeline: codesign-macos
            job: macos-codesign
          - pipeline: package-macos
            job: macos-dmg
        runs_on:
          executor: script
          shell: posix
        requires:
          tools:
            git: "*"
            gh: "*"
        timeout_seconds: 1200
        steps:
          - name: Check GitHub credentials
            run: test -n "$GITHUB_TOKEN"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"
          - name: Configure release remote
            run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/izzyreal/ciwi.git"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"
          - name: Verify VERSION file
            run: test -f VERSION
          - name: Check working tree
            run: |
              DIRTY="$(git status --porcelain | grep -vE '^\?\? dist/' || true)"
              if [ -n "$DIRTY" ]; then
                echo "working tree is not clean"
                exit 1
              fi
          - name: Check release tag
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                echo "tag exists: $TAG"
                exit 1
              fi
              if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                echo "remote tag exists: $TAG"
                exit 1
              fi
          - name: Verify release artifacts and create checksums
            run: |
              VERSION="${CIWI_PIPELINE_VERSION#v}"
              test -f dist/ciwi-linux-amd64
              test -f dist/ciwi-darwin-amd64
              test -f dist/ciwi-darwin-arm64
              test -f dist/codesigned-macos/ciwi-darwin-amd64.zip
              test -f dist/codesigned-macos/ciwi-darwin-arm64.zip
              test -f dist/ciwi-windows-amd64.exe
              test -f dist/ciwi-windows-arm64.exe
              test -f "dist/Ciwi-Client-macos-v${VERSION}.dmg"
              test -f "dist/Ciwi-Client-windows-Setup-x86_64-v${VERSION}.exe"
              test -f "dist/Ciwi-Client-linux-amd64-v${VERSION}.zip"
              for f in \
                dist/ciwi-linux-amd64 \
                dist/ciwi-darwin-amd64 \
                dist/ciwi-darwin-arm64 \
                dist/codesigned-macos/ciwi-darwin-amd64.zip \
                dist/codesigned-macos/ciwi-darwin-arm64.zip \
                dist/ciwi-windows-amd64.exe \
                dist/ciwi-windows-arm64.exe \
                "dist/Ciwi-Client-macos-v${VERSION}.dmg" \
                "dist/Ciwi-Client-windows-Setup-x86_64-v${VERSION}.exe" \
                "dist/Ciwi-Client-linux-amd64-v${VERSION}.zip"; do
                shasum -a 256 "$f" | awk '{ sub(/^.*\//, "", $2); print $1 "  " $2 }'
              done > dist/ciwi-checksums.txt
              test -f dist/ciwi-checksums.txt
            skip_dry_run: true
          - name: Create release tag
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              git tag -a "$TAG" -m "ciwi $TAG"
              git push origin "$TAG"
            skip_dry_run: true
          - name: Create release and upload assets
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              VERSION="${CIWI_PIPELINE_VERSION#v}"
              gh release create "$TAG" \
                --repo izzyreal/ciwi \
                --title "ciwi $TAG" \
                --notes "Release $TAG"

              set -- \
                dist/ciwi-linux-amd64 \
                dist/ciwi-darwin-amd64 \
                dist/ciwi-darwin-arm64 \
                dist/codesigned-macos/ciwi-darwin-amd64.zip \
                dist/codesigned-macos/ciwi-darwin-arm64.zip \
                dist/ciwi-windows-amd64.exe \
                dist/ciwi-windows-arm64.exe \
                "dist/Ciwi-Client-macos-v${VERSION}.dmg" \
                "dist/Ciwi-Client-windows-Setup-x86_64-v${VERSION}.exe" \
                "dist/Ciwi-Client-linux-amd64-v${VERSION}.zip" \
                dist/ciwi-checksums.txt
              TOTAL="$#"
              IDX=0
              for FILE in "$@"; do
                IDX=$((IDX + 1))
                SIZE="$(wc -c < "$FILE" | tr -d ' ')"
                START="$(date +%s)"
                echo "[release] Uploading ${IDX}/${TOTAL}: ${FILE} (${SIZE} bytes)"
                gh release upload "$TAG" "$FILE" --repo izzyreal/ciwi --clobber
                END="$(date +%s)"
                echo "[release] Uploaded ${IDX}/${TOTAL}: ${FILE} in $((END-START))s"
              done
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"

  - id: codesign-macos
    trigger: manual
    depends_on:
      - build
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    jobs:
      - id: macos-codesign
        artifact_sources:
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: darwin-amd64
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: darwin-arm64
          - pipeline: build
            job: desktop-macos-unsigned
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        requires:
          tools:
            codesign: "*"
        timeout_seconds: 1200
        artifacts:
          - dist/codesigned-macos/**
        steps:
          - name: Check Apple signing credentials
            run: test -n "$DEV_IDENTITY_APP" && test -n "$NOTARYTOOL_PASSWORD" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_ID"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Verify macOS binaries
            run: test -f dist/ciwi-darwin-amd64 && test -f dist/ciwi-darwin-arm64 && test -d dist/desktop-macos-unsigned/Ciwi.app
          - name: Prepare macOS bundle output
            run: rm -rf dist/codesigned-macos && mkdir -p dist/codesigned-macos/bundles
            skip_dry_run: true
          - name: Build, sign, and notarize amd64 agent bundle
            run: sh scripts/build_macos_agent_bundle.sh dist/ciwi-darwin-amd64 "${CIWI_PIPELINE_VERSION}" dist/codesigned-macos/bundles/CiwiAgent-amd64.app dist/codesigned-macos/ciwi-darwin-amd64.zip
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Build, sign, and notarize arm64 agent bundle
            run: sh scripts/build_macos_agent_bundle.sh dist/ciwi-darwin-arm64 "${CIWI_PIPELINE_VERSION}" dist/codesigned-macos/bundles/CiwiAgent-arm64.app dist/codesigned-macos/ciwi-darwin-arm64.zip
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Sign macOS desktop app
            run: codesign --force --deep --strict --options=runtime --entitlements packaging/macos-entitlements.plist --timestamp --sign "$DEV_IDENTITY_APP" dist/desktop-macos-unsigned/Ciwi.app
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
          - name: Verify macOS desktop signature
            run: codesign --verify --deep --strict -v dist/desktop-macos-unsigned/Ciwi.app
            skip_dry_run: true
          - name: Publish signed macOS desktop app
            run: cp -R dist/desktop-macos-unsigned/Ciwi.app dist/codesigned-macos/Ciwi.app
            skip_dry_run: true

  - id: package-macos
    trigger: manual
    depends_on:
      - codesign-macos
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    jobs:
      - id: macos-dmg
        artifact_sources:
          - pipeline: codesign-macos
            job: macos-codesign
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        requires:
          tools:
            dmgbuild: "*"
            notarytool: "*"
            stapler: "*"
        timeout_seconds: 2400
        artifacts:
          - dist/Ciwi-Client-macos-v*.dmg
        steps:
          - name: Check Apple notarization credentials
            run: test -n "$NOTARYTOOL_PASSWORD" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_ID"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Verify signed macOS desktop app
            run: test -d dist/codesigned-macos/Ciwi.app && codesign --verify --deep --strict -v dist/codesigned-macos/Ciwi.app
            skip_dry_run: true
          - name: Build macOS desktop disk image
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && sh packaging/build-macos-dmg.sh dist/codesigned-macos/Ciwi.app "$VERSION" "dist/Ciwi-Client-macos-v${VERSION}.dmg"
            skip_dry_run: true
          - name: Notarize macOS desktop disk image
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && RESULT_JSON="$PWD/dist/notary-result-ciwi-client-macos.json" && xcrun notarytool submit "$PWD/dist/Ciwi-Client-macos-v${VERSION}.dmg" --apple-id "$APPLE_ID" --password "$NOTARYTOOL_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RESULT_JSON" && STATUS="$(/usr/bin/plutil -extract status raw -o - "$RESULT_JSON")" && SUBMISSION_ID="$(/usr/bin/plutil -extract id raw -o - "$RESULT_JSON")" && if [ "$STATUS" != "Accepted" ]; then echo "notarytool status=${STATUS} submission_id=${SUBMISSION_ID}"; xcrun notarytool log "$SUBMISSION_ID" --apple-id "$APPLE_ID" --password "$NOTARYTOOL_PASSWORD" --team-id "$APPLE_TEAM_ID"; exit 1; fi
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Staple macOS desktop disk image
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && xcrun stapler staple "$PWD/dist/Ciwi-Client-macos-v${VERSION}.dmg"
            skip_dry_run: true

pipeline_chains:
  - name: Build and release
    pipelines:
      - build
      - codesign-macos
      - package-macos
      - release
