version: 1
project:
  name: ciwi

pipelines:
  - id: build
    trigger: manual
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    versioning:
      file: VERSION
      tag_prefix: v
    jobs:
      - id: unit-tests
        runs_on:
          executor: script
          shell: posix
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
        timeout_seconds: 600
        steps:
          - name: Run Go unit tests
            test:
              name: go-unit
              command: mkdir -p dist && go test -p 1 -tags nowayland,nox11,novulkan,noopengl -coverpkg=./... -json -coverprofile=dist/go-unit.cover ./... > dist/go-unit.json
              format: go-test-json
              report: dist/go-unit.json
              coverage_format: go-coverprofile
              coverage_report: dist/go-unit.cover
      - id: integration-tests
        runs_on:
          executor: script
          shell: posix
          os: linux
          arch: amd64
        requires:
          tools:
            git: "*"
            docker: "*"
        timeout_seconds: 1800
        artifacts:
          - dist/browser-dom-junit.xml
        steps:
          - name: Pull Playwright test image
            run: docker pull mcr.microsoft.com/playwright:v1.62.1-noble
          - name: Run browser DOM integration tests
            test:
              name: browser-dom-integration
              command: mkdir -p dist integration/browser-dom/node_modules && docker run --rm --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 -e CIWI_JUNIT_REPORT=/work/dist/browser-dom-junit.xml -v "$PWD:/work" -w /work/integration/browser-dom mcr.microsoft.com/playwright:v1.62.1-noble bash -lc 'npm ci && npm test'
              format: junit-xml
              report: dist/browser-dom-junit.xml
      - id: build-cross-platform
        needs:
          - unit-tests
          - integration-tests
        runs_on:
          executor: script
          shell: posix
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
        timeout_seconds: 600
        artifacts:
          - dist/**
        matrix:
          include:
            - name: linux-amd64
              goos: linux
              goarch: amd64
              ext: ""
            - name: windows-amd64
              goos: windows
              goarch: amd64
              ext: ".exe"
            - name: windows-arm64
              goos: windows
              goarch: arm64
              ext: ".exe"
            - name: darwin-amd64
              goos: darwin
              goarch: amd64
              ext: ""
            - name: darwin-arm64
              goos: darwin
              goarch: arm64
              ext: ""
        steps:
          - name: Prepare dist
            run: mkdir -p dist
          - name: Build ciwi binary
            run: GOOS={{goos}} GOARCH={{goarch}} CGO_ENABLED=0 go build -v -trimpath -ldflags="-s -w -X github.com/izzyreal/ciwi/internal/version.Version=${CIWI_PIPELINE_VERSION}" -o dist/ciwi-{{name}}{{ext}} ./cmd/ciwi
  - id: build-desktop
    trigger: manual
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    versioning:
      file: VERSION
      tag_prefix: v
    jobs:
      - id: macos-unsigned
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
            xcodebuild: "*"
            plistbuddy: "*"
        timeout_seconds: 1200
        artifacts:
          - dist/desktop-macos-unsigned/**
        steps:
          - name: Prepare macOS desktop output
            run: rm -rf dist/desktop-macos-unsigned && mkdir -p dist/desktop-macos-unsigned
          - name: Build universal macOS desktop app
            run: sh packaging/build-macos-app.sh "${CIWI_PIPELINE_VERSION}" dist/desktop-macos-unsigned
      - id: windows-amd64
        runs_on:
          executor: script
          shell: posix
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
        timeout_seconds: 1200
        artifacts:
          - dist/desktop-windows-amd64/**
        steps:
          - name: Prepare Windows desktop output
            run: rm -rf dist/desktop-windows-amd64 && mkdir -p dist/desktop-windows-amd64
          - name: Build Windows desktop application
            run: sh packaging/build-windows-app.sh "${CIWI_PIPELINE_VERSION}" dist/desktop-windows-amd64/Ciwi.exe
      - id: linux-amd64
        runs_on:
          executor: script
          shell: posix
          os: linux
          arch: amd64
        go_cache: {}
        requires:
          tools:
            git: "*"
            docker: "*"
        timeout_seconds: 1200
        artifacts:
          - dist/desktop-linux-amd64/**
        steps:
          - name: Prepare Linux desktop output
            run: rm -rf dist/desktop-linux-amd64 && mkdir -p dist/desktop-linux-amd64
          - name: Build Linux desktop application
            run: sh packaging/build-linux-container.sh "${CIWI_PIPELINE_VERSION}" dist/desktop-linux-amd64/ciwi
  - id: ios
    trigger: manual
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    versioning:
      file: VERSION
      tag_prefix: v
    jobs:
      - id: ios-archive
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        go_cache: {}
        requires:
          tools:
            git: "*"
            go: ">=1.24"
            xcodebuild: "*"
            plistbuddy: "*"
            codesign: "*"
        timeout_seconds: 2700
        artifacts:
          - dist/ios/Ciwi.xcarchive/**
          - dist/ios/ExportOptions.plist
        steps:
          - name: Race-test native lifecycle boundaries
            run: go test -race ./pkg/cnpclient ./internal/presentation/operations ./internal/adapters/gio
          - name: Prepare iOS output
            run: rm -rf dist/ios dist/ios-build dist/ios-check && mkdir -p dist/ios dist/ios-build dist/ios-check
          - name: Build iOS Gio framework
            run: sh packaging/build-ios-framework.sh "${CIWI_PIPELINE_VERSION}" dist/ios-build/Ciwi.framework
          - name: Verify unsigned iPhoneOS application
            run: sh packaging/build-ios-host.sh check "${CIWI_PIPELINE_VERSION}" dist/ios-build/Ciwi.framework dist/ios-check/Ciwi.app
          - name: Build signed iOS archive
            run: sh packaging/build-ios-host.sh archive "${CIWI_PIPELINE_VERSION}" dist/ios-build/Ciwi.framework dist/ios/Ciwi.xcarchive
            skip_dry_run: true
          - name: Validate signed iOS archive
            run: sh packaging/validate-ios-archive.sh "${CIWI_PIPELINE_VERSION}" dist/ios/Ciwi.xcarchive
            skip_dry_run: true
          - name: Stage App Store export options
            run: cp packaging/ios/ExportOptions.plist dist/ios/ExportOptions.plist
  - id: release-ios
    trigger: manual
    depends_on:
      - ios
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    jobs:
      - id: testflight
        artifact_sources:
          - pipeline: ios
            job: ios-archive
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        requires:
          tools:
            xcodebuild: "*"
        timeout_seconds: 2700
        steps:
          - name: Verify iOS release inputs
            run: test -d dist/ios/Ciwi.xcarchive && test -f dist/ios/ExportOptions.plist
            skip_dry_run: true
          - name: Upload iOS build to TestFlight
            run: rm -rf dist/ios-upload && mkdir -p dist/ios-upload && xcodebuild -exportArchive -archivePath dist/ios/Ciwi.xcarchive -exportOptionsPlist dist/ios/ExportOptions.plist -exportPath dist/ios-upload -allowProvisioningUpdates
            skip_dry_run: true
  - id: package-windows
    trigger: manual
    depends_on:
      - build-desktop
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    jobs:
      - id: windows-installer
        artifact_sources:
          - pipeline: build-desktop
            job: windows-amd64
        runs_on:
          executor: script
          shell: powershell
          os: windows
          arch: amd64
        requires:
          tools:
            git: "*"
            wix: ">=6.0.0"
        timeout_seconds: 1200
        artifacts:
          - dist/Ciwi-Client-windows-Setup-x86_64-v*.exe
        steps:
          - name: Verify Windows desktop application
            run: if (-not (Test-Path -LiteralPath "dist\desktop-windows-amd64\Ciwi.exe" -PathType Leaf)) { throw "Windows desktop application artifact is missing" }
          - name: Build Windows desktop installer
            run: $version = ((Get-Content VERSION -Raw).Trim() -replace '^[vV]', ''); & powershell -ExecutionPolicy Bypass -File packaging\build-windows-installer.ps1 -InputExe "dist\desktop-windows-amd64\Ciwi.exe" -Version $version -OutputExe "dist\Ciwi-Client-windows-Setup-x86_64-v$version.exe"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  - id: package-linux
    trigger: manual
    depends_on:
      - build-desktop
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    jobs:
      - id: linux-archive
        artifact_sources:
          - pipeline: build-desktop
            job: linux-amd64
        runs_on:
          executor: script
          shell: posix
          os: linux
          arch: amd64
        requires:
          tools:
            git: "*"
            zip: "*"
        timeout_seconds: 600
        artifacts:
          - dist/Ciwi-Client-linux-amd64-v*.zip
        steps:
          - name: Verify Linux desktop application
            run: test -f dist/desktop-linux-amd64/ciwi
          - name: Build Linux desktop archive
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && sh packaging/build-linux-zip.sh dist/desktop-linux-amd64/ciwi "$VERSION" "dist/Ciwi-Client-linux-amd64-v${VERSION}.zip"
  - id: release
    trigger: manual
    depends_on:
      - build
      - codesign-macos-agents
      - package-macos
      - package-windows
      - package-linux
      - release-ios
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    versioning:
      file: VERSION
      tag_prefix: v
      auto_bump: patch
      auto_bump_vcs_token: "{{ secret.github-secret }}"
      auto_bump_vault:
        connection: home-vault
        secrets:
          - name: github-secret
            mount: kv
            path: gh
            key: token
            kv_version: 2
    jobs:
      - id: github-release
        artifact_sources:
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: linux-amd64
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: windows-amd64
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: windows-arm64
          - pipeline: package-windows
            job: windows-installer
          - pipeline: package-linux
            job: linux-archive
          - pipeline: codesign-macos-agents
            job: macos-agents
          - pipeline: package-macos
            job: macos-dmg
        runs_on:
          executor: script
          shell: posix
        requires:
          tools:
            git: "*"
            gh: "*"
        timeout_seconds: 1200
        steps:
          - name: Check GitHub credentials
            run: test -n "$GITHUB_TOKEN"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"
          - name: Configure release remote
            run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/izzyreal/ciwi.git"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"
          - name: Verify VERSION file
            run: test -f VERSION
          - name: Check working tree
            run: |
              DIRTY="$(git status --porcelain | grep -vE '^\?\? dist/' || true)"
              if [ -n "$DIRTY" ]; then
                echo "working tree is not clean"
                exit 1
              fi
          - name: Check release tag
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                echo "tag exists: $TAG"
                exit 1
              fi
              if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                echo "remote tag exists: $TAG"
                exit 1
              fi
          - name: Verify release artifacts and create checksums
            run: |
              VERSION="${CIWI_PIPELINE_VERSION#v}"
              test -f dist/ciwi-linux-amd64
              test -f dist/codesigned-macos/ciwi-darwin-amd64.zip
              test -f dist/codesigned-macos/ciwi-darwin-arm64.zip
              test -f dist/ciwi-windows-amd64.exe
              test -f dist/ciwi-windows-arm64.exe
              test -f "dist/Ciwi-Client-macos-v${VERSION}.dmg"
              test -f "dist/Ciwi-Client-windows-Setup-x86_64-v${VERSION}.exe"
              test -f "dist/Ciwi-Client-linux-amd64-v${VERSION}.zip"
              for f in \
                dist/ciwi-linux-amd64 \
                dist/codesigned-macos/ciwi-darwin-amd64.zip \
                dist/codesigned-macos/ciwi-darwin-arm64.zip \
                dist/ciwi-windows-amd64.exe \
                dist/ciwi-windows-arm64.exe \
                "dist/Ciwi-Client-macos-v${VERSION}.dmg" \
                "dist/Ciwi-Client-windows-Setup-x86_64-v${VERSION}.exe" \
                "dist/Ciwi-Client-linux-amd64-v${VERSION}.zip"; do
                shasum -a 256 "$f" | awk '{ sub(/^.*\//, "", $2); print $1 "  " $2 }'
              done > dist/ciwi-checksums.txt
              test -f dist/ciwi-checksums.txt
            skip_dry_run: true
          - name: Create release tag
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              git tag -a "$TAG" -m "ciwi $TAG"
              git push origin "$TAG"
            skip_dry_run: true
          - name: Create release and upload assets
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              VERSION="${CIWI_PIPELINE_VERSION#v}"
              gh release create "$TAG" \
                --repo izzyreal/ciwi \
                --title "ciwi $TAG" \
                --notes "Release $TAG"

              set -- \
                dist/ciwi-linux-amd64 \
                dist/codesigned-macos/ciwi-darwin-amd64.zip \
                dist/codesigned-macos/ciwi-darwin-arm64.zip \
                dist/ciwi-windows-amd64.exe \
                dist/ciwi-windows-arm64.exe \
                "dist/Ciwi-Client-macos-v${VERSION}.dmg" \
                "dist/Ciwi-Client-windows-Setup-x86_64-v${VERSION}.exe" \
                "dist/Ciwi-Client-linux-amd64-v${VERSION}.zip" \
                dist/ciwi-checksums.txt
              TOTAL="$#"
              IDX=0
              for FILE in "$@"; do
                IDX=$((IDX + 1))
                SIZE="$(wc -c < "$FILE" | tr -d ' ')"
                START="$(date +%s)"
                echo "[release] Uploading ${IDX}/${TOTAL}: ${FILE} (${SIZE} bytes)"
                gh release upload "$TAG" "$FILE" --repo izzyreal/ciwi --clobber
                END="$(date +%s)"
                echo "[release] Uploaded ${IDX}/${TOTAL}: ${FILE} in $((END-START))s"
              done
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"

  - id: release-core
    trigger: manual
    depends_on:
      - build
      - codesign-macos-agents
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    versioning:
      file: VERSION
      tag_prefix: v
      auto_bump: patch
      auto_bump_vcs_token: "{{ secret.github-secret }}"
      auto_bump_vault:
        connection: home-vault
        secrets:
          - name: github-secret
            mount: kv
            path: gh
            key: token
            kv_version: 2
    jobs:
      - id: github-release
        artifact_sources:
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: linux-amd64
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: windows-amd64
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: windows-arm64
          - pipeline: codesign-macos-agents
            job: macos-agents
        runs_on:
          executor: script
          shell: posix
        requires:
          tools:
            git: "*"
            gh: "*"
        timeout_seconds: 1200
        steps:
          - name: Check GitHub credentials
            run: test -n "$GITHUB_TOKEN"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"
          - name: Configure release remote
            run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/izzyreal/ciwi.git"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"
          - name: Verify VERSION file
            run: test -f VERSION
          - name: Check working tree
            run: |
              DIRTY="$(git status --porcelain | grep -vE '^\?\? dist/' || true)"
              if [ -n "$DIRTY" ]; then
                echo "working tree is not clean"
                exit 1
              fi
          - name: Check release tag
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                echo "tag exists: $TAG"
                exit 1
              fi
              if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                echo "remote tag exists: $TAG"
                exit 1
              fi
          - name: Verify core release artifacts and create checksums
            run: |
              test -f dist/ciwi-linux-amd64
              test -f dist/codesigned-macos/ciwi-darwin-amd64.zip
              test -f dist/codesigned-macos/ciwi-darwin-arm64.zip
              test -f dist/ciwi-windows-amd64.exe
              test -f dist/ciwi-windows-arm64.exe
              for f in \
                dist/ciwi-linux-amd64 \
                dist/codesigned-macos/ciwi-darwin-amd64.zip \
                dist/codesigned-macos/ciwi-darwin-arm64.zip \
                dist/ciwi-windows-amd64.exe \
                dist/ciwi-windows-arm64.exe; do
                shasum -a 256 "$f" | awk '{ sub(/^.*\//, "", $2); print $1 "  " $2 }'
              done > dist/ciwi-checksums.txt
              test -f dist/ciwi-checksums.txt
            skip_dry_run: true
          - name: Create release tag
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              git tag -a "$TAG" -m "ciwi $TAG"
              git push origin "$TAG"
            skip_dry_run: true
          - name: Create release and upload core assets
            run: |
              TAG="${CIWI_PIPELINE_TAG}"
              gh release create "$TAG" \
                --repo izzyreal/ciwi \
                --title "ciwi $TAG" \
                --notes "Release $TAG (native client packages omitted)"

              set -- \
                dist/ciwi-linux-amd64 \
                dist/codesigned-macos/ciwi-darwin-amd64.zip \
                dist/codesigned-macos/ciwi-darwin-arm64.zip \
                dist/ciwi-windows-amd64.exe \
                dist/ciwi-windows-arm64.exe \
                dist/ciwi-checksums.txt
              TOTAL="$#"
              IDX=0
              for FILE in "$@"; do
                IDX=$((IDX + 1))
                SIZE="$(wc -c < "$FILE" | tr -d ' ')"
                START="$(date +%s)"
                echo "[release] Uploading ${IDX}/${TOTAL}: ${FILE} (${SIZE} bytes)"
                gh release upload "$TAG" "$FILE" --repo izzyreal/ciwi --clobber
                END="$(date +%s)"
                echo "[release] Uploaded ${IDX}/${TOTAL}: ${FILE} in $((END-START))s"
              done
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: github-secret
                  mount: kv
                  path: gh
                  key: token
                  kv_version: 2
            env:
              GITHUB_TOKEN: "{{ secret.github-secret }}"

  - id: codesign-macos-agents
    trigger: manual
    depends_on:
      - build
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    jobs:
      - id: macos-agents
        artifact_sources:
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: darwin-amd64
          - pipeline: build
            job: build-cross-platform
            matrix:
              name: darwin-arm64
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        requires:
          tools:
            codesign: "*"
        timeout_seconds: 1200
        artifacts:
          - dist/codesigned-macos/**
        steps:
          - name: Check Apple signing credentials
            run: test -n "$DEV_IDENTITY_APP" && test -n "$NOTARYTOOL_PASSWORD" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_ID"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Verify macOS agent binaries
            run: test -f dist/ciwi-darwin-amd64 && test -f dist/ciwi-darwin-arm64
          - name: Prepare macOS bundle output
            run: rm -rf dist/codesigned-macos && mkdir -p dist/codesigned-macos/bundles
            skip_dry_run: true
          - name: Build, sign, and notarize amd64 agent bundle
            run: sh scripts/build_macos_agent_bundle.sh dist/ciwi-darwin-amd64 "${CIWI_PIPELINE_VERSION}" dist/codesigned-macos/bundles/CiwiAgent-amd64.app dist/codesigned-macos/ciwi-darwin-amd64.zip
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Build, sign, and notarize arm64 agent bundle
            run: sh scripts/build_macos_agent_bundle.sh dist/ciwi-darwin-arm64 "${CIWI_PIPELINE_VERSION}" dist/codesigned-macos/bundles/CiwiAgent-arm64.app dist/codesigned-macos/ciwi-darwin-arm64.zip
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"

  - id: codesign-desktop-macos
    trigger: manual
    depends_on:
      - build-desktop
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    jobs:
      - id: macos-app
        artifact_sources:
          - pipeline: build-desktop
            job: macos-unsigned
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        requires:
          tools:
            codesign: "*"
        timeout_seconds: 1200
        artifacts:
          - dist/codesigned-macos/Ciwi.app/**
          - dist/codesigned-macos/Ciwi.app.dSYM/**
        steps:
          - name: Check Apple signing credentials
            run: test -n "$DEV_IDENTITY_APP"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
          - name: Verify unsigned macOS desktop app
            run: test -d dist/desktop-macos-unsigned/Ciwi.app && test -d dist/desktop-macos-unsigned/Ciwi.app.dSYM
          - name: Restore macOS desktop executable permissions
            run: chmod +x dist/desktop-macos-unsigned/Ciwi.app/Contents/MacOS/Ciwi && test -x dist/desktop-macos-unsigned/Ciwi.app/Contents/MacOS/Ciwi
          - name: Prepare signed macOS desktop output
            run: rm -rf dist/codesigned-macos/Ciwi.app dist/codesigned-macos/Ciwi.app.dSYM && mkdir -p dist/codesigned-macos
            skip_dry_run: true
          - name: Sign macOS desktop app
            run: codesign --force --deep --strict --options=runtime --runtime-version 11.0 --entitlements packaging/macos-entitlements.plist --timestamp --sign "$DEV_IDENTITY_APP" dist/desktop-macos-unsigned/Ciwi.app
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: dev-identity-app
                  mount: kv
                  path: apple-id
                  key: dev-identity-app
            env:
              DEV_IDENTITY_APP: "{{ secret.dev-identity-app }}"
          - name: Verify macOS desktop signature and compatibility
            run: |
              codesign --verify --deep --strict -v dist/desktop-macos-unsigned/Ciwi.app
              RUNTIME_VERSION="$(codesign -dv --verbose=4 dist/desktop-macos-unsigned/Ciwi.app 2>&1 | sed -n 's/^Runtime Version=//p')"
              if [ "$RUNTIME_VERSION" != "11.0.0" ]; then
                echo "unexpected hardened runtime version: ${RUNTIME_VERSION:-missing} (expected 11.0.0)" >&2
                exit 1
              fi
            skip_dry_run: true
          - name: Publish signed macOS desktop app
            run: cp -R dist/desktop-macos-unsigned/Ciwi.app dist/codesigned-macos/Ciwi.app && cp -R dist/desktop-macos-unsigned/Ciwi.app.dSYM dist/codesigned-macos/Ciwi.app.dSYM
            skip_dry_run: true

  - id: package-macos
    trigger: manual
    depends_on:
      - codesign-desktop-macos
    vcs_source:
      repo: https://github.com/izzyreal/ciwi.git
    jobs:
      - id: macos-dmg
        artifact_sources:
          - pipeline: codesign-desktop-macos
            job: macos-app
        runs_on:
          executor: script
          shell: posix
          os: darwin
          arch: arm64
        requires:
          tools:
            dmgbuild: "*"
            notarytool: "*"
            stapler: "*"
        timeout_seconds: 2400
        artifacts:
          - dist/Ciwi-Client-macos-v*.dmg
          - dist/Ciwi-Client-macos-v*.dSYM.zip
        steps:
          - name: Check Apple notarization credentials
            run: test -n "$NOTARYTOOL_PASSWORD" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_ID"
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Verify signed macOS desktop app
            run: test -d dist/codesigned-macos/Ciwi.app && test -d dist/codesigned-macos/Ciwi.app.dSYM && chmod +x dist/codesigned-macos/Ciwi.app/Contents/MacOS/Ciwi && test -x dist/codesigned-macos/Ciwi.app/Contents/MacOS/Ciwi && codesign --verify --deep --strict -v dist/codesigned-macos/Ciwi.app && sh packaging/verify-apple-debug-info.sh dist/codesigned-macos/Ciwi.app/Contents/MacOS/Ciwi "arm64 x86_64" "github.com/izzyreal/ciwi/internal/adapters/gio.(*Renderer).SetOperations" dist/codesigned-macos/Ciwi.app.dSYM
            skip_dry_run: true
          - name: Package macOS desktop debug symbols
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && rm -f "dist/Ciwi-Client-macos-v${VERSION}.dSYM.zip" && ditto -c -k --sequesterRsrc --keepParent dist/codesigned-macos/Ciwi.app.dSYM "dist/Ciwi-Client-macos-v${VERSION}.dSYM.zip"
            skip_dry_run: true
          - name: Build macOS desktop disk image
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && sh packaging/build-macos-dmg.sh dist/codesigned-macos/Ciwi.app "$VERSION" "dist/Ciwi-Client-macos-v${VERSION}.dmg"
            skip_dry_run: true
          - name: Notarize macOS desktop disk image
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && RESULT_JSON="$PWD/dist/notary-result-ciwi-client-macos.json" && xcrun notarytool submit "$PWD/dist/Ciwi-Client-macos-v${VERSION}.dmg" --apple-id "$APPLE_ID" --password "$NOTARYTOOL_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RESULT_JSON" && STATUS="$(/usr/bin/plutil -extract status raw -o - "$RESULT_JSON")" && SUBMISSION_ID="$(/usr/bin/plutil -extract id raw -o - "$RESULT_JSON")" && if [ "$STATUS" != "Accepted" ]; then echo "notarytool status=${STATUS} submission_id=${SUBMISSION_ID}"; xcrun notarytool log "$SUBMISSION_ID" --apple-id "$APPLE_ID" --password "$NOTARYTOOL_PASSWORD" --team-id "$APPLE_TEAM_ID"; exit 1; fi
            skip_dry_run: true
            vault:
              connection: home-vault
              secrets:
                - name: notarytool-password
                  mount: kv
                  path: notarytool
                  key: password
                - name: apple-team-id
                  mount: kv
                  path: apple-id
                  key: team-id
                - name: apple-id
                  mount: kv
                  path: apple-id
                  key: email
            env:
              NOTARYTOOL_PASSWORD: "{{ secret.notarytool-password }}"
              APPLE_TEAM_ID: "{{ secret.apple-team-id }}"
              APPLE_ID: "{{ secret.apple-id }}"
          - name: Staple macOS desktop disk image
            run: VERSION="${CIWI_PIPELINE_VERSION#v}" && xcrun stapler staple "$PWD/dist/Ciwi-Client-macos-v${VERSION}.dmg"
            skip_dry_run: true

pipeline_chains:
  - name: Build and release
    pipelines:
      - build
      - build-desktop
      - ios
      - codesign-macos-agents
      - codesign-desktop-macos
      - package-macos
      - package-windows
      - package-linux
      - release-ios
      - release
  - name: Build and release without native clients
    pipelines:
      - build
      - codesign-macos-agents
      - release-core
  - name: Build desktop clients
    pipelines:
      - build-desktop
      - codesign-desktop-macos
      - package-macos
      - package-windows
      - package-linux
  - name: Build and publish iOS client
    pipelines:
      - ios
      - release-ios
